#
# The changelog-fragment gate (#2600).
#
# A public API change carries a CHANGELOG note (CLAUDE.md, docs/agents/pr-review.md), and
# the note is a fragment file, `<package>/changelog.d/<issue>.<kind>.md`, which the release
# folds into `[Unreleased]` with `tools/changelog_assemble.py`. Two PRs that each add a
# fragment never conflict, where two PRs that each add a bullet to the same `### Added`
# list did on every rebase.
#
# The job fails a PR whose diff changes a public header with no fragment for that
# package (`tools/check_changelog_fragment.py` holds the path rule), and a PR whose
# fragment is misnamed, names a heading its CHANGELOG does not use, or is not a bullet
# (`tools/changelog_assemble.py --check`, which also prints the assembled sections).
#
# One job with a path filter (CI demand ruling, 2026-10-29): it runs on a PR push that
# touches a public header, a fragment or the tools, and is skipped otherwise. There is no
# escape label: none existed for the CHANGELOG obligation before this.
#
# Cost: one treeless checkout and well under a second of python, no toolchain, no build.
name: changelog-fragment

on:
  pull_request:
    paths:
      - "core/include/**"
      - "backends/*/include/**"
      - "integrations/esp-idf/libtracer/include/**"
      - "**/changelog.d/**"
      - "**/CHANGELOG.md"
      - "tools/changelog_assemble.py"
      - "tools/check_changelog_fragment.py"
      - "tools/consolidate_changelog.py"
      - "tools/gen_release_notes.py"
      - "tools/tests/test_changelog_fragments.py"
      - ".github/workflows/changelog-fragment.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-fragment-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7725929bb02b
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # Same shape as no-binaries (one treeless checkout, a git diff, python). 10 = the
    # short-job floor.
    timeout-minutes: 10
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      # Full history, treeless, as in no-binaries.yml: the check diffs against the MERGE
      # BASE, and trees arrive only when git reads them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The gate's own suite first, so a rule bug reports as a rule bug: it drives a
      # throwaway repository through both arms (red on a header change with no fragment,
      # green with one) and diffs an assembled CHANGELOG against a hand edit.
      - name: Fragment tool unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_changelog_fragments.py" -v
      - name: Every fragment is well formed (dry-run assembly)
        run: python3 tools/changelog_assemble.py --check
      - name: A public header change carries a fragment
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE='${{ github.event.pull_request.base.sha }}'
              HEAD='${{ github.event.pull_request.head.sha }}'
              ;;
            *)
              BASE='origin/${{ github.event.repository.default_branch }}'
              HEAD='${{ github.sha }}'
              ;;
          esac
          python3 tools/check_changelog_fragment.py --base "$BASE" --head "$HEAD"
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job; a host job first takes root-owned leftovers back through a throwaway
        # container (no sudo), so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; if [ "$(id -u)" != 0 ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then docker run --rm -v "$w/..:/w" -v "$t:/t" ghcr.io/avatarsd-llc/libtracer-ci:noble-7725929bb02b chown -R "$(id -u):$(id -g)" /w /t || r=1; fi; find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
