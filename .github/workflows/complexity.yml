#
# Cyclomatic-complexity ratchet on core/ and the agent-doc length cap (#1790), plus the
# public-std ratchet (#1781): `tools/check_public_std.py` counts every owning std type in
# the installed headers (core/include/libtracer), comments and strings excluded, against
# tools/public_std_baseline.json. A count may only go down, toward zero (ADR-0083 Decision 11).
#
# `tools/check_ccn.py` measures every function in core/include and core/src with a
# pinned lizard: an unpinned function above CCN 15 fails, a pinned one may only go
# down (tools/ccn_pins.json), and CLAUDE.md / CONTEXT.md must stay at 100 lines or
# fewer. The job summary carries the CCN distribution and, report only, each file's
# CCN above 10 against the base commit — the number a helper split cannot move.
#
# Its own workflow, not a core-ci job: it needs no build, and core-ci's trigger is
# DERIVED from what core-ci compiles (tools/gen_ci_paths.py). Adding CLAUDE.md and
# CONTEXT.md there would fire the whole build matrix on a doc edit; leaving them out
# would let a doc-only PR break the cap unseen. This filter is exactly the gate's
# inputs instead. Same reasoning as doc-citations.yml.
#
# RUNNER: hosted `ubuntu-24.04` on every route, no container and no self-hosted
# routing — it builds nothing, so there is nothing to gain from the ci-local pool and
# no fork guard or workspace-ownership step to carry.
name: complexity

on:
  push:
    branches: [main]
    paths:
      - "core/include/**"
      - "core/src/**"
      - "CLAUDE.md"
      - "CONTEXT.md"
      - "tools/check_ccn.py"
      - "tools/ccn_pins.json"
      - "tools/tests/test_check_ccn.py"
      - "tools/check_public_std.py"
      - "tools/public_std_baseline.json"
      - "tools/tests/test_check_public_std.py"
      - ".github/workflows/complexity.yml"
  pull_request:
    # Duplicated rather than a YAML anchor: GitHub Actions does not expand aliases.
    paths:
      - "core/include/**"
      - "core/src/**"
      - "CLAUDE.md"
      - "CONTEXT.md"
      - "tools/check_ccn.py"
      - "tools/ccn_pins.json"
      - "tools/tests/test_check_ccn.py"
      - "tools/check_public_std.py"
      - "tools/public_std_baseline.json"
      - "tools/tests/test_check_public_std.py"
      - ".github/workflows/complexity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complexity-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ccn:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # lizard over ~125 files takes ~10 s, twice with the base; the only network steps
    # are setup-python and one pip install. 10 = the short-job floor (see core-ci.yml).
    timeout-minutes: 10
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lizard (pinned; must match LIZARD_VERSION in tools/check_ccn.py)
        timeout-minutes: 5
        run: python -m pip install --quiet "lizard==1.24.0"
      # The gate's own logic first, so a tool bug reports as a tool bug.
      - name: Ratchet unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_ccn.py" -v
      - name: Fetch the base commit for the per-file report
        id: base
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git fetch --quiet --no-tags --depth=1 origin "$BASE"; then
            echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          fi
      - name: CCN ratchet + agent-doc cap (distribution in the job summary)
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: python3 tools/check_ccn.py ${BASE:+--base "$BASE"}
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

  public-std:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # A regex scan of ~100 headers; no install step. 10 = the short-job floor.
    timeout-minutes: 10
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ratchet unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_public_std.py" -v
      - name: No owning std type in the installed headers (ratchet toward zero)
        run: python3 tools/check_public_std.py
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
