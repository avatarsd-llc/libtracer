      - name: Configure + build (C++23, aarch64) + ctest
        run: |
          cmake -S core -B core/build-arm64 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build core/build-arm64 --parallel "$BUILD_JOBS"
          ctest --test-dir core/build-arm64 --output-on-failure

  # GCC-15 host gate: build the core + ctest with GCC 15 (the same major the
  # ESP-IDF v6.0 RISC-V toolchain ships), so the core is gated on the compiler
  # the MCU actually uses — catches toolchain-version-specific issues (e.g. the
  # FNV-1a 64-bit-constant overflow on 32-bit size_t GCC 15 newly -Werror's).
  # GCC 15 is not in ubuntu-24.04's default repos; the toolchain test PPA carries it.
  build-test-gcc15:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured healthy max 4.68 min (5.17 on the incident day) — the worst of the
    # build-test group, because it adds an `add-apt-repository` PPA round-trip on top of
    # the container apt step. 20 = ~3.9x.
    timeout-minutes: 20
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      # Same PPA as before, minus `sudo` (root in the container) plus
      # software-properties-common, which the hosted image preinstalls and a bare
      # ubuntu:24.04 does not. Same noble base, so apt resolves g++-15 identically.
      - name: Install g++-15 (toolchain PPA)
        # Two apt-updates plus a PPA add: measured p50 1.55 min, max 2.60. 10 = ~4x.
        timeout-minutes: 10
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends g++-15 gcc-15
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Configure + build (C++23, GCC 15) + ctest
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -S core -B core/build-gcc15 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
          cmake --build core/build-gcc15 --parallel "$BUILD_JOBS"
          ctest --test-dir core/build-gcc15 --output-on-failure
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # Both sanitizer legs run against both LKV slot bindings (ADR-0069 §1) as parallel
  # matrix jobs rather than extra steps, so the second binding costs no wall clock.
  # hazard_slot_t is hand-rolled lock-free reclamation: ASan/LSan is what proves a
  # displaced node is neither freed under a reader nor leaked, and TSan is what proves
  # the announce/re-read protocol actually orders. A green single-threaded run does not.
  # NOT routed to `ci-local` (phase 2): the `setarch -R` below sets
  # `personality(ADDR_NO_RANDOMIZE)`, which Docker's default seccomp profile denies
  # (EPERM), so the container route cannot run this leg — and without a container the
  # job would assume a host toolchain these runners are not asserted to carry. Routing
  # it needs a runner-side `--security-opt seccomp=unconfined` decision first.
  sanitizers:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    # Measured healthy max 7.98 min, p50 7.4-7.6, min 7.33 — a very tight distribution.
    # 25 = ~3.1x the observed max; ASan/UBSan runtime here is stable.
    timeout-minutes: 25
    strategy:
      matrix:
        lkv_slot: [single_writer_slot_t, hazard_slot_t]
    name: sanitizers (slot=${{ matrix.lkv_slot }})
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
      - name: ASan + UBSan build + ctest
        run: |
          cmake -S core -B core/build-asan -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build core/build-asan --parallel "$BUILD_JOBS"
          # ASLR can make ASan/TSan abort in this runner; pin it off.
          setarch "$(uname -m)" -R ctest --test-dir core/build-asan --output-on-failure

  # NOT routed to `ci-local` (phase 2) — same `setarch -R` seccomp bar as `sanitizers`.
  tsan:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    # The longest core-ci jobs and legitimately the most variable: measured healthy max
    # 12.27 min (sp_atomic) / 8.22 (hazard) against a p50 of 6.5, and 15.67 on the
    # incident day. 35 = ~2.9x the healthy max — deliberately loose, because a false red
    # on a sanitizer leg is read as flakiness rather than as a wedge.
    timeout-minutes: 35
    strategy:
      matrix:
        lkv_slot: [single_writer_slot_t, hazard_slot_t]
    name: tsan (slot=${{ matrix.lkv_slot }})
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
      - name: ThreadSanitizer build + ctest (graph concurrency)
        run: |
          cmake -S core -B core/build-tsan -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          cmake --build core/build-tsan --parallel "$BUILD_JOBS"
          setarch "$(uname -m)" -R ctest --test-dir core/build-tsan --output-on-failure

  # The SAME TSan matrix with `reclaim_qsbr_t` bound (#1376). A separate job rather than a third
  # matrix axis because it needs the override fragment generated first. This is the gate that
  # matters most for this policy: it is the first one with real cross-thread ordering (a seq_cst
  # announce paired against the retiring thread's epoch RMW — a Dekker shape), and it must run at
  # BOTH lkv_slot bindings because `hazard_slot_t` is the leg that exercises #897's self-drain.
  tsan-reclaim-qsbr:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lkv_slot: [single_writer_slot_t, hazard_slot_t]
    name: tsan qsbr (slot=${{ matrix.lkv_slot }})
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
      - name: ThreadSanitizer build + ctest (reclaim_qsbr grace period)
        run: |
          mkdir -p "$PWD/reclaim-qsbr-tsan/libtracer"
          cat > "$PWD/reclaim-qsbr-tsan/libtracer/config_override.hpp" <<'FRAGMENT'
          /**
           * @file
           * @brief GENERATED CI fixture — the ADR-0080 CROSS-THREAD reclamation policy bound.
           */
          #pragma once

          namespace tr::graph {

          /** @brief The defaults, with a grace point spanning every thread (a many-core host). */
          struct reclaim_qsbr_config_t : default_config_t {
              using reclaim_policy_t = reclaim_qsbr_t;
              // The two link modules are opt-in since v0.17.0 (#1670); this leg's subject is
              // elsewhere, so it keeps the full test build's modules on.
              static constexpr bool kBusLinks = true;
              static constexpr bool kSelfHealLinks = true;
          };

          using config_t = reclaim_qsbr_config_t;

          }  // namespace tr::graph
          FRAGMENT
          cmake -S core -B core/build-tsan-qsbr -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -I$PWD/reclaim-qsbr-tsan"
          cmake --build core/build-tsan-qsbr --parallel "$BUILD_JOBS"
          setarch "$(uname -m)" -R ctest --test-dir core/build-tsan-qsbr --output-on-failure

  # Regression guard for the CMake install/export (find_package packaging). Builds
  # + installs core to a staging prefix, then configures the tests/packaging fixture
  # SEPARATELY against that prefix — the real downstream flow: find_package(libtracer)
  # + link libtracer::libtracer + include a public header + call a compiled symbol.
  # Catches broken install rules, a malformed package config, or a missing exported
  # target before they reach a consumer.
  install-consume:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured max 1.78 min (p50 ~1.1). Short-job floor of 15 rather than 3x (~5 min):
    # the entire risk here is the container apt step, so the ceiling answers "how long is
    # it acceptable to be wedged", not "how long does the work take".
    timeout-minutes: 15
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Build + install core to a staging prefix
        run: |
          cmake -S core -B core/build-install -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build-install --parallel "$BUILD_JOBS"
          cmake --install core/build-install --prefix "${RUNNER_TEMP}/prefix"
      - name: Consume via find_package(libtracer)
        run: |
          cmake -S tests/packaging -B "${RUNNER_TEMP}/consumer" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/prefix"
          cmake --build "${RUNNER_TEMP}/consumer" --parallel "$BUILD_JOBS"
          "${RUNNER_TEMP}/consumer/app"
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # Compile EVERY bench target, run none of them (#781). The measuring workflows
  # (perf.yml, docs.yml) each name the handful of targets they execute, so a bench
  # nobody currently runs is compiled by nothing — and rots silently against the very
  # API changes it was written to measure. bench_pin_ratio, bench_pin_net and the
  # pin_bench example all stopped compiling the moment RFC-0022 §3.B deleted
  # `settings_t`, and the tree stayed green for six PRs. This job is the guard: it
  # is a COMPILE gate, so it costs one build and cannot be confounded by a runner's
  # load. Ablate it by reverting any bench to a deleted API — the job goes red.
  bench-compile:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured max 2.10 min (p50 ~1.3) — the longest of the short container jobs.
    # Short-job floor of 15; see install-consume for why it is not 3x.
    timeout-minutes: 15
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Configure + build every bench target (compile only, nothing is run)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --parallel "$BUILD_JOBS"
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # The failable census, RUN rather than compiled (#1414). Both of its modes are
  # deterministic gates over counts, not timings, so neither needs a quiesced host and
  # neither can be confounded by a shared runner's load — the same property that lets
  # perf-local.yml's `Zero-heap forward gate` run there.
  #
  # It is a SEPARATE job on purpose: bench-compile above contracts "compile EVERY bench
  # target, run none of them", and quietly running one target inside it would make that
  # header a lie and put a runtime failure under a compile gate's name.
  #
  # What it defends: `guard` is the #848 escape gate; `blocks` is the block census, which
  # until #1402 could not report a zero-escape row at all because its two columns were not
  # disjoint — and NOTHING ran it, so the rot was found by hand months later. The two
  # `census_canary_*` rows assert the disjointness in both directions. Ablate by pointing
  # `counting_source_t::try_alloc` back at `tr::mem::heap_source()`: the job goes red on
  # `census_canary_seam_only ... verdict=FAIL`.
  census-gate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # One bench target plus libtracer, then two sub-second runs. Short-job floor of 15.
    timeout-minutes: 15
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Build bench_failable_census only
        # Its own build tree: bench-compile writes bench/build, and on the self-hosted
        # runner the two jobs can share a workspace.
        run: |
          cmake -S bench -B bench/build-census -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build-census --target bench_failable_census --parallel "$BUILD_JOBS"
      # Each gate is ONE command, not a pipeline. `container:` has no bash, so every `run:`
      # here is `sh -e {0}` — dash, whose `set` has no `-o pipefail`. A first cut wrote
      # `set -o pipefail && … | tee …` and the step died on `Illegal option -o pipefail`
      # before the census ran at all. A bare command needs neither: `sh -e` fails the step
      # on its exit status, and the transcript is already the step's log.
      - name: "Block census gate (blocks) — the two columns must stay disjoint"
        run: ./bench/build-census/bench_failable_census blocks
      # Quoted because an unquoted YAML scalar treats ` #848` as a comment and silently
      # truncates the name — which it did, on the first cut.
      - name: "Allocation escape gate (guard) — #848"
        run: ./bench/build-census/bench_failable_census guard
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # This workflow's own CORE_CI_PATHS gate (the `changes` job; it was the `paths:` trigger
  # until #1614), checked against what its jobs actually build
  # (#1082). The list used to be hand-written — `core/**`, `bench/**`,
  # `tests/packaging/**` — while ctest targets defined in core/tests/CMakeLists.txt
  # compile ESP-IDF sources out of `integrations/esp-idf/` and read the conformance
  # vectors out of `tests/conformance/`. Neither tree was named, so a pull request
  # confined to one of them ran no host test at all, from the very suites written to
  # cover it. tools/gen_ci_paths.py re-derives the list from a real configure of the
  # core project (CMake file-api: target sources, include directories, path-valued
  # compile definitions, ctest properties) plus every `cmake -S <dir>` this file runs,
  # and fails here on any drift. Making a suite compile a new tree means editing a
  # CMakeLists under `core/**`, which is always in the list, so this check runs on
  # exactly the changes that can invalidate it. Ablate it by deleting a CORE_CI_PATHS entry
  # — the job goes red naming that entry.
  ci-paths:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget; harmless on the hosted fallback
      # (ubuntu-24.04 runners have 16 GB).
      options: --memory 10g
    # Measured max 1.80 min (p50 ~1.0). Short-job floor of 15 (has a package install).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: core-ci's CORE_CI_PATHS gate covers everything core-ci builds
        run: python3 tools/gen_ci_paths.py --check
      # An unverified gate is not a gate: the parser runs over synthetic workflows in
      # both arms first, so a parser bug reports as a parser bug rather than as a
      # phantom-clean sweep of the real files.
      - name: Workspace-ownership gate unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_ci_workspace_cleanup.py" -v
      # The #1538 gate. It rides in `ci-paths` because this job's subject already is
      # "core-ci's own wiring is coherent". It sweeps EVERY workflow file, not just this
      # one, so a self-hosted container job added anywhere in the tree is caught the next
      # time core-ci runs — which is nearly every PR. doc-citations.yml runs the same
      # check as its own step, because its `paths:` include itself and core-ci's do not:
      # between the two, an edit to either of the workflows that carry such jobs today
      # fires the gate on the commit that made the edit.
      - name: Every self-hosted container job restores workspace ownership
        run: python3 tools/check_ci_workspace_cleanup.py
      # The CI base image's tag is the Dockerfile's content hash; every `image:` reference
      # must carry it (tools/check_ci_image_tag.py, .github/ci-image/Dockerfile header).
      - name: Every CI image reference matches the Dockerfile hash
        run: python3 tools/check_ci_image_tag.py
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  format:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget; harmless on the hosted fallback
      # (ubuntu-24.04 runners have 16 GB).
      options: --memory 10g
    # Measured max 1.17 min (p50 0.7) when it still apt-installed twice; the short-job
    # floor of 15 stays.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      # `clang-format` comes from the same noble archive the hosted image installed it
      # from, so the enforced style is the same version's, not a second dialect.
      - name: clang-format (dry-run, error on diff)
        # The step needs bash for `mapfile` and process substitution; inside a
        # `container:` job the runner may resolve the default shell to plain sh.
        shell: bash
        # clang-format comes from the CI image; the step measures well under a minute.
        timeout-minutes: 8
        run: |
          mapfile -t files < <(find core/include core/src core/tests core/examples \
            backends tests/packaging -name '*.hpp' -o -name '*.cpp')
          clang-format --dry-run --Werror "${files[@]}"
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  doxygen-gate:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget; harmless on the hosted fallback
      # (ubuntu-24.04 runners have 16 GB).
      options: --memory 10g
    # Measured max 1.30 min (p50 0.8) when it still apt-installed twice. Short-job
    # floor of 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Doxygen strict gate (undocumented public symbol = failure)
        # doxygen comes from the CI image; same cap as `clang-format`.
        timeout-minutes: 8
        run: |
          doxygen core/Doxyfile
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # THE REQUIRED CHECK (#1614). Branch protection requires a check named `build-test`,
  # and this is the one job that always reports it. It needs every job in this file:
  #   * `changes` must have succeeded — no verdict without a decision;
  #   * relevant change: every job must be `success` (a skip here is a bug, not a pass);
  #   * no relevant change: every job must be `skipped`.
  # Anything else (failure, cancelled, an unexpected skip or run) is red. Hosted, like
  # `changes`: it builds nothing and reads only the `needs` context.
  build-test-required:
    name: build-test
    if: always()
    needs: [changes, build-test, build-test-minimal-set, build-test-reclaim-strict, build-test-bus-closed, build-test-self-heal-closed, build-test-reclaim-qsbr, build-test-arm64, build-test-gcc15, sanitizers, tsan, tsan-reclaim-qsbr, install-consume, bench-compile, census-gate, ci-paths, format, doxygen-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Combine the core-ci job results into one verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          set -euo pipefail
          changes="$(jq -r '.changes.result' <<< "$NEEDS")"
          if [ "$changes" != "success" ]; then
            echo "::error::the changes job ended '$changes'; there is no decision to report"
            exit 1
          fi
          if [ "$RELEVANT" = "true" ]; then want=success; else want=skipped; fi
          echo "relevant=$RELEVANT, so every job must be '$want'"
          bad="$(jq -r --arg want "$want" 'to_entries[] | select(.key != "changes" and .value.result != $want) | "\(.key)=\(.value.result)"' <<< "$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::core-ci jobs not '$want': $(tr '\n' ' ' <<< "$bad")"
            exit 1
          fi
          echo "ok"
