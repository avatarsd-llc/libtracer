#
# Core C++23 reference implementation CI: build + ctest, clang-format, and the
# strict Doxygen documentation gate. Keeps `main` green on every change to core/.
#
# RUNNER ROUTING (self-hosted `ci-local`). Most x86 legs below pick the maintainer's
# self-hosted runners when — and ONLY when — the run is trusted; every other run falls
# back to `ubuntu-24.04`. The guard repeated in each `runs-on:` reads:
#
#   this repository (not a fork of it) AND (the event is not a pull_request OR the PR's
#   head branch lives in this same repository, i.e. it is not a fork PR)
#
# SECURITY (public repo + self-hosted runner): fork code must never execute on the
# self-hosted machine. A fork PR runs attacker-authored steps, and these runners are
# non-ephemeral hardware on the maintainer's network — a single fork PR routed there
# owns the box and everything it can reach. That expression is the ONLY thing standing
# between a fork PR and that machine, so it is repeated verbatim per job (Actions does
# not expand YAML anchors, and a shared `env:` cannot be read from `runs-on:`) rather
# than factored out. Because the fallback is automatic, no required check ever waits on
# hardware a fork cannot use. NEVER route here: a `pull_request_target` job, anything
# touching secrets (release.yml, publish-npm.yml, docs.yml's deploy), the arm64 leg
# below, or perf.yml (its interleaved gates are designed for hosted runners).
#
# CONTAINER: the self-hosted runners are bare machines, NOT the ubuntu-24.04 image —
# there is no preinstalled tool set. Every migrated job therefore runs inside the CI
# base image `ghcr.io/avatarsd-llc/libtracer-ci` — `ubuntu:24.04` plus the jobs' tool set,
# baked once (.github/ci-image/Dockerfile, published by ci-image.yml) instead of
# apt-installed per job. Steps run as root (no `sudo` anywhere). The container applies on
# BOTH routes, so the hosted fallback compiles in exactly the same environment — hermetic
# parity, not a second configuration. The image tag is the Dockerfile's content hash, and
# tools/check_ci_image_tag.py (run by `ci-paths`) fails the build if a reference drifts.
# The job and step ceilings below were sized while every job still apt-installed its
# tool set; with the install gone they are generous, not tight.
#
# ── WORKSPACE OWNERSHIP (#1538) ─────────────────────────────────────────────────────
# The container runs as ROOT, and on the self-hosted runners its `/__w` is a bind mount
# of the host runner's `_work` tree — NOT a throwaway VM disk. Every file a job here
# creates (the checkout, each CMake build tree, `$RUNNER_TEMP`) is left owned by root
# after the job ends, the runner user cannot clean it, and the NEXT job on that machine
# dies inside `actions/checkout`'s clean step. It reads as code breakage and is not: on
# 2026-08-23 it took `perf-local / bench-local` red with 129 root-owned paths under
# `core/build-minimal`, left by `build-test-minimal-set` — one of the two jobs that had
# been missed when the cleanup step was added to the others.
#
# So EVERY job below that pairs `container:` with the self-hosted routing ends with the
# same `if: always()` step, and `tools/check_ci_workspace_cleanup.py` (run by the
# `ci-paths` job) fails the build if any such job omits it or spells it differently. The
# step is inline in each job rather than a composite action ON PURPOSE: a local
# `uses: ./...` action is only resolvable after `actions/checkout` has run, and the
# cleanup has to survive a job that died BEFORE checkout (the per-job apt step was the
# wedge surface documented above; build-test-gcc15 still has one). `if: always()` for the same reason: the run that
# leaves the most wreckage is the one that failed or was cancelled mid-build.
#
# What it chowns, and to whom: `..` is the workspace's parent, created by the runner
# process on the host, so its owner IS the runner user — no uid is hard-coded and the
# step is a harmless no-op on the hosted fallback route. `$RUNNER_TEMP` is included
# because `install-consume` builds into it as root and the runner cannot clear a
# root-owned subtree between jobs either.
#
# AND `persist-credentials: false` on every checkout in those jobs, which is the other
# half and was found by measuring rather than by reading: with the cleanup step alone,
# the first green run still left exactly ONE root-owned file per runner — `.git/config`,
# the one file the next checkout must write to clean. `actions/checkout`'s POST step
# runs after the last real step and calls `removeAuth()` unconditionally, and
# `git config --local --unset-all http.<url>.extraheader` REWRITES the file when it
# matches, as root. Measured here: with a match it re-owns the file to the caller; with
# no match it exits 5 and does not touch it. Turning credential persistence off moves
# the removal into the MAIN step (still root, but BEFORE the cleanup) and leaves the
# post step nothing to match. These jobs build, test and lint — none uses a git
# credential after checkout — so nothing else changes. The gate enforces both halves.
#
# NOT MIGRATED, and why (phase 2): the sanitizer and TSan legs run `setarch -R`, and
# Docker's default seccomp profile denies `personality(ADDR_NO_RANDOMIZE)` — verified
# EPERM — so the container route cannot run them, while the direct-on-host route would
# assume a toolchain these runners are not yet asserted to carry. The arm64 leg is a
# different architecture and stays hosted permanently.
#
# ── COMPILER CACHE (#1691) ──────────────────────────────────────────────────────────
# Every job that compiles on the self-hosted route shares ONE persistent ccache: the host
# directory /home/github-runner/ccache (runner user, 0775) is bind-mounted at `/ccache`.
# The mount lives in `container.options`, selected by the SAME trust guard as `runs-on`,
# so a hosted or fork run never names a host path (a fork cannot reach it, and on the
# hosted fallback the `-v` would just create an empty directory). The "Set build
# parallelism" step switches ccache on only when `/ccache` exists, by exporting
# CMAKE_{C,CXX}_COMPILER_LAUNCHER — CMake reads those from the environment, so no
# `cmake -S` line below changes and the hosted route compiles exactly as before.
#
# Why it is safe to share one cache across every leg: ccache keys on the compiler's
# full argument list plus the preprocessed source, so a leg with other flags or another
# config override (-I fixture dirs, -DLIBTRACER_*, Release vs RelWithDebInfo) can never
# be served another leg's object. `compiler_check=content` hashes the compiler binary
# itself, so the gcc-13 legs and the g++-15 leg cannot collide either, whatever the
# image's mtimes. `CCACHE_BASEDIR` is the workspace, so paths stay relocatable if a
# runner's `_work` ever moves. Size cap 20G (LRU-evicted by ccache itself). The files it
# writes are root-owned (the container runs as root) — every writer is a root container,
# so that is harmless, and they live OUTSIDE the workspace the cleanup step chowns.
# perf-local.yml / perf.yml / bench builds are untouched: they do not set the launcher.
#
# Each job logs its own hit rate (`CCACHE_STATSLOG`, printed by the "Compiler cache
# statistics" step) — the cache's global counters are shared by every runner at once.
#
# BUILD_JOBS=4 on the self-hosted route: the slice gives ALL runners and containers 11
# cores / 24 GB, and the three `ci-local` runners (studio-ci-1, studio-lt-7, studio-lt-8)
# run up to 3 container jobs at once, so 3 x 4 = 12 is ~one compiler per core with a
# little slack for link/IO stalls (6 each asked for 18, ~1.6x the slice). Memory is not
# the binding limit — the heaviest TUs peak at ~0.55 GB RSS (graph.cpp, measured
# RelWithDebInfo), so 3 jobs x 4 compilers stay near 7 GB, far under the 24 GB slice.
#
# ── TIMEOUT CEILINGS (the tree-wide policy; the fuller explanation lives here) ──────
# Every job in this repo carries a `timeout-minutes`, and this file is where the policy
# is written down once rather than pasted onto each job.
#
# WHY. On 2026-08-19 a transient apt/network event wedged package-install steps across
# the tree: `docs / build` sat in_progress for 56 and 36 minutes with no step progress,
# `perf / compose-audit` for 27, and footprint-cortexm0's arm toolchain install for 36.4
# minutes inside a run that still went GREEN. `build-test` here is a REQUIRED check, so a
# wedge does not fail a PR — it holds the merge queue against GitHub's 6-hour default.
# Every occurrence cleared on cancel+rerun, so the fault is infrastructure, not content.
# A ceiling does not make the hang less likely; it converts "wedged forever, and
# indistinguishable from running" into "red in N minutes, named, and retryable". Same
# treatment docs.yml's `build` got in #1403.
#
# HOW THE NUMBERS WERE PICKED. Per-job runtimes were measured from the Actions REST API
# (40 successful runs per workflow, per-job and per-step timings), and each ceiling is
# quoted against the HEALTHY figure — the 2026-08-19 incident runs are excluded from
# "healthy" and named separately. Jobs longer than a couple of minutes get ~3x their
# measured max; jobs shorter than that get a flat floor of 10 minutes (no package
# install) or 15 (with one), because 3x a 40-second job is two minutes and any transient
# runner stall would breach it. A ceiling that reds a healthy run is worse than none —
# the cost of a false red is a maintainer learning to ignore the colour, and the cost of
# a loose ceiling on a short job is at worst ten wasted minutes.
#
# STEP CEILINGS. The job ceiling only turns a wedge red an hour later; the per-step
# `timeout-minutes` on each package install is what NAMES the culprit in the checks UI.
# Those are tight (5-10 min against sub-two-minute healthy installs) because a wedged
# apt is never a slow apt. Queue time is not covered by either — `timeout-minutes` starts
# when the job begins executing, and GitHub counts queued jobs against its own 24-hour
# limit — so the self-hosted legs' measured queue waits (up to 11.6 min here) do not eat
# into any number below.
name: core-ci

# ── ALWAYS TRIGGERED, GATED BY A `changes` JOB (#1614) ──────────────────────────────
# core-ci owns the REQUIRED check `build-test`. It used to be path-filtered at the
# trigger (`on: paths:`), and a required check from a workflow that is never queued
# never REPORTS: a docs-only pull request matched no pattern, `build-test` stayed
# pending forever and the pull request was BLOCKED with nothing to fix. A skipped job
# counts as passing; a check that never reports does not.
#
# So the workflow triggers on every change, and the path decision moved one level
# down: the `changes` job matches the diff against CORE_CI_PATHS (derived by
# tools/gen_ci_paths.py, checked by the `ci-paths` job — the same list the trigger
# used to carry) and every job below runs only when something matched. The final
# `build-test-required` job, NAMED `build-test`, is the required check: it always runs
# and turns the `needs` results into one verdict (see that job). Run and skip come
# from the one derived list, so there is no hand-kept complement that could drift into
# a green check on a diff that should have been built.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether this change can affect anything core-ci builds. GitHub-hosted on
  # purpose: it executes no build and must never wait on the self-hosted pool, and a
  # fork PR running it touches nothing but a throwaway VM.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # DERIVED by tools/gen_ci_paths.py -- do not hand-edit: this list is what
      # core-ci's jobs read and build. `gen_ci_paths.py --apply` rewrites it.
      CORE_CI_PATHS: |
        bench/**
        core/**
        integrations/esp-idf/libtracer/**
        integrations/esp-idf/tests/host/**
        tests/conformance/vectors/v1/**
        tests/packaging/**
        .github/workflows/core-ci.yml
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is the merge commit: HEAD^1 is the base tip it was
          # merged onto, so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
          persist-credentials: false
      - name: Match the diff against CORE_CI_PATHS
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        # Every uncertain branch answers `true` (run everything): a needless build costs
        # minutes, a wrong skip is a green required check on code nobody built. The
        # patterns are only `<dir>/**` and exact paths, and bash's `[[ == ]]` lets `*`
        # cross `/`, so a match here is never narrower than GitHub's own glob.
        run: |
          set -euo pipefail
          relevant=true
          changed="$RUNNER_TEMP/changed"
          if [ "$EVENT" = "pull_request" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            git diff --name-only -z HEAD^1 HEAD > "$changed"
            relevant=false
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git fetch -q --no-tags --depth=1 "$REPO_URL" "$BEFORE"; then
            git diff --name-only -z "$BEFORE" HEAD > "$changed"
            relevant=false
          fi
          if [ "$relevant" = false ]; then
            mapfile -t patterns <<< "$CORE_CI_PATHS"
            while IFS= read -r -d '' file; do
              for pat in "${patterns[@]}"; do
                [ -n "$pat" ] || continue
                # shellcheck disable=SC2053  # $pat is a glob on purpose
                if [[ "$file" == $pat ]]; then
                  echo "match: $file  (pattern $pat)"
                  relevant=true
                  break 2
                fi
              done
            done < "$changed"
            [ "$relevant" = true ] || echo "no changed path matches CORE_CI_PATHS; core-ci's jobs are skipped"
          else
            echo "event '$EVENT' has no comparable base; running everything"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant"
  build-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured healthy max 4.82 min across the three legs (p50 ~4.5). 20 = ~4x, with
    # extra room over a bare 3x because the image pull and the apt step below are inside
    # the measured job time and are exactly the wedge surface.
    timeout-minutes: 20
    # Build + ctest under BOTH ACL policy configs: the default ALLOW-only MCU
    # subset (acl_full=OFF) and the full security_acl host policy with DENY
    # (acl_full=ON). LIBTRACER_ACL_FULL swaps acl_policy_t at compile time, so
    # the full config is a distinct compilation the default job never covers (#345).
    #
    # The first two legs keep the default single-writer slot (the binding an RTOS target
    # uses, RFC 0028 §5.5, here over the striped host mutex guard); the third rebinds
    # tr::graph::lkv_slot_t to the hazard-reclamation slot (ADR-0069 §1). lkv_slot_test covers both
    # policies in every leg by naming them, but only a rebound build puts one under
    # graph_t — which is what caught the deferred-reclamation-vs-injected-pmr-resource
    # break in graph_pmr_test.
    strategy:
      matrix:
        include:
          - acl_full: OFF
            lkv_slot: single_writer_slot_t
          - acl_full: ON
            lkv_slot: single_writer_slot_t
          - acl_full: OFF
            lkv_slot: hazard_slot_t
    name: build-test (acl_full=${{ matrix.acl_full }}, slot=${{ matrix.lkv_slot }})
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
        with:
          # NOT tidiness. checkout's POST step calls `removeAuth()` unconditionally,
          # and `git config --unset-all http.<url>.extraheader` REWRITES `.git/config`
          # when it matches — as ROOT, after the cleanup step below has already run.
          # Measured on this host: with a match it re-owns the file to the caller; with
          # no match it exits 5 and does not touch it. Without this the first green run
          # of the fixed workflows still left exactly one root-owned file per runner,
          # and it was `.git/config` — the one the next checkout must write to clean.
          # These jobs build, test and lint; none uses git credentials after checkout.
          persist-credentials: false
      - name: Configure + build (C++23) + ctest
        run: |
          cmake -S core -B core/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIBTRACER_ACL_FULL=${{ matrix.acl_full }} -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }}
          cmake --build core/build --parallel "$BUILD_JOBS"
          ctest --test-dir core/build --output-on-failure
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # MINIMAL MODULE SET (#1293). Every other leg here configures with the module options at
  # their defaults (all ON), so nothing in CI ever linked the closed module set ADR-0047
  # promises: the L0/L1 substrate + wire codec + graph runtime, with the net/routing plane
  # and every transport OFF. That is the configuration an MCU consumer selects, and it built
  # the LIBRARY fine while its TESTS did not link at all — the test targets were
  # unconditional while the library sources were gated. This leg is the evidence: same
  # sources, the minimal option set, BUILD_TESTING=ON, and the reduced ctest suite run.
  build-test-minimal-set:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured healthy max 2.97 min. Held at the build-test group's 20 rather than
    # tightened: same container + apt step, same wedge surface.
    timeout-minutes: 20
    steps:
      # Build parallelism (#1637, #1691): 4 on the self-hosted runners (11-core slice shared
      # by up to ~3 concurrent jobs), `nproc` on hosted runners. RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (COMPILER CACHE in the header). POSIX
      # sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=4; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
            echo "ccache: ON (/ccache)"
          fi
      - uses: actions/checkout@v4
        with:
          # See the WORKSPACE OWNERSHIP header: without this, checkout's post step
          # re-roots `.git/config` after the cleanup step has already run.
          persist-credentials: false
      - name: Configure + build (minimal module set) + ctest
        run: |
          cmake -S core -B core/build-minimal -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBTRACER_NET_PLANE=OFF \
            -DLIBTRACER_TRANSPORT_TCP=OFF -DLIBTRACER_TRANSPORT_UDP=OFF \
            -DLIBTRACER_TRANSPORT_WS=OFF -DLIBTRACER_TRANSPORT_CAN=OFF
          cmake --build core/build-minimal --parallel "$BUILD_JOBS"
          ctest --test-dir core/build-minimal --output-on-failure
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of this file's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"

  # THE SECOND RECLAMATION POLICY (#894, ADR-0080). `reclaim_local_t` is the default and every
  # other leg here compiles it; `reclaim_strict_t` is the opt-in zero-cost MCU mode, and a seam
  # whose other member nothing ever builds is a seam that has already rotted. This leg binds it
  # and runs the whole suite — `reclaim_test` follows the binding by `if constexpr`, dropping
  # the three re-entrant cases the policy forbids, so one executable serves both.
  #
  # It is bound with an ORDINARY override fragment rather than a `-D` knob, per ADR-0068: a new
  # configuration member does not get a CMake variable, it is set in `config_override.hpp` as
  # plain C++. Three lines that inherit the defaults, so it cannot drift from them.
  build-test-reclaim-strict:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # CPU is bounded host-side: dockerd's cgroup-parent puts every container under
      # runners.slice (11 cores for all runners + containers together), so no per-container
      # `--cpus` (#1691). 10g is the per-job memory budget. The trusted (self-hosted) route
      # also mounts the persistent compiler cache — see COMPILER CACHE in the header; the
      # guard is the `runs-on` one verbatim, so hosted and fork runs get no mount.
      options: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g -v /home/github-runner/ccache:/ccache' || '--memory 10g' }}
    # Measured healthy max 4.88 min. 20 = ~4x; same group, same container apt step.
    timeout-minutes: 20
    steps:
