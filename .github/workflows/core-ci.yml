#
# Core C++23 reference implementation CI: build + ctest, clang-format, and the
# strict Doxygen documentation gate. Keeps `main` green on every change to core/.
#
# RUNNER ROUTING (self-hosted `ci-local`). Most x86 legs below pick the maintainer's
# self-hosted runners when — and ONLY when — the run is trusted; every other run falls
# back to `ubuntu-24.04`. The guard repeated in each `runs-on:` reads:
#
#   this repository (not a fork of it) AND (the event is not a pull_request OR the PR's
#   head branch lives in this same repository, i.e. it is not a fork PR)
#
# SECURITY (public repo + self-hosted runner): fork code must never execute on the
# self-hosted machine. A fork PR runs attacker-authored steps, and these runners are
# non-ephemeral hardware on the maintainer's network — a single fork PR routed there
# owns the box and everything it can reach. That expression is the ONLY thing standing
# between a fork PR and that machine, so it is repeated verbatim per job (Actions does
# not expand YAML anchors, and a shared `env:` cannot be read from `runs-on:`) rather
# than factored out. Because the fallback is automatic, no required check ever waits on
# hardware a fork cannot use. NEVER route here: a `pull_request_target` job, anything
# touching secrets (release.yml, publish-npm.yml, docs.yml's deploy), the arm64 leg
# below, or perf.yml (its interleaved gates are designed for hosted runners).
#
# CONTAINER: the self-hosted runners are bare machines, NOT the ubuntu-24.04 image —
# there is no preinstalled tool set and the runner user has no passwordless sudo. Every
# migrated job therefore runs inside `container: ubuntu:24.04` and apt-installs what it
# needs as root (no `sudo` anywhere). The container applies on BOTH routes, so the
# hosted fallback compiles in exactly the same environment — hermetic parity, not a
# second configuration. Each migrated leg was run end-to-end in that container before
# migrating (full ctest: 134/134).
#
# NOT MIGRATED, and why (phase 2): the sanitizer and TSan legs run `setarch -R`, and
# Docker's default seccomp profile denies `personality(ADDR_NO_RANDOMIZE)` — verified
# EPERM — so the container route cannot run them, while the direct-on-host route would
# assume a toolchain these runners are not yet asserted to carry. The arm64 leg is a
# different architecture and stays hosted permanently.
#
# ── TIMEOUT CEILINGS (the tree-wide policy; the fuller explanation lives here) ──────
# Every job in this repo carries a `timeout-minutes`, and this file is where the policy
# is written down once rather than pasted onto each job.
#
# WHY. On 2026-08-19 a transient apt/network event wedged package-install steps across
# the tree: `docs / build` sat in_progress for 56 and 36 minutes with no step progress,
# `perf / compose-audit` for 27, and footprint-cortexm0's arm toolchain install for 36.4
# minutes inside a run that still went GREEN. `build-test` here is a REQUIRED check, so a
# wedge does not fail a PR — it holds the merge queue against GitHub's 6-hour default.
# Every occurrence cleared on cancel+rerun, so the fault is infrastructure, not content.
# A ceiling does not make the hang less likely; it converts "wedged forever, and
# indistinguishable from running" into "red in N minutes, named, and retryable". Same
# treatment docs.yml's `build` got in #1403.
#
# HOW THE NUMBERS WERE PICKED. Per-job runtimes were measured from the Actions REST API
# (40 successful runs per workflow, per-job and per-step timings), and each ceiling is
# quoted against the HEALTHY figure — the 2026-08-19 incident runs are excluded from
# "healthy" and named separately. Jobs longer than a couple of minutes get ~3x their
# measured max; jobs shorter than that get a flat floor of 10 minutes (no package
# install) or 15 (with one), because 3x a 40-second job is two minutes and any transient
# runner stall would breach it. A ceiling that reds a healthy run is worse than none —
# the cost of a false red is a maintainer learning to ignore the colour, and the cost of
# a loose ceiling on a short job is at worst ten wasted minutes.
#
# STEP CEILINGS. The job ceiling only turns a wedge red an hour later; the per-step
# `timeout-minutes` on each package install is what NAMES the culprit in the checks UI.
# Those are tight (5-10 min against sub-two-minute healthy installs) because a wedged
# apt is never a slow apt. Queue time is not covered by either — `timeout-minutes` starts
# when the job begins executing, and GitHub counts queued jobs against its own 24-hour
# limit — so the self-hosted legs' measured queue waits (up to 11.6 min here) do not eat
# into any number below.
name: core-ci

on:
  push:
    branches: [main]
    # DERIVED by tools/gen_ci_paths.py -- do not hand-edit: this list is what
    # core-ci's jobs configure and compile. `gen_ci_paths.py --apply` rewrites it.
    paths:
      - "bench/**"
      - "core/**"
      - "integrations/esp-idf/libtracer/**"
      - "integrations/esp-idf/tests/host/**"
      - "tests/conformance/vectors/v1/**"
      - "tests/packaging/**"
      - ".github/workflows/core-ci.yml"
  pull_request:
    # DERIVED by tools/gen_ci_paths.py -- do not hand-edit: this list is what
    # core-ci's jobs configure and compile. `gen_ci_paths.py --apply` rewrites it.
    paths:
      - "bench/**"
      - "core/**"
      - "integrations/esp-idf/libtracer/**"
      - "integrations/esp-idf/tests/host/**"
      - "tests/conformance/vectors/v1/**"
      - "tests/packaging/**"
      - ".github/workflows/core-ci.yml"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured healthy max 4.82 min across the three legs (p50 ~4.5). 20 = ~4x, with
    # extra room over a bare 3x because the image pull and the apt step below are inside
    # the measured job time and are exactly the wedge surface.
    timeout-minutes: 20
    # Build + ctest under BOTH ACL policy configs: the default ALLOW-only MCU
    # subset (acl_full=OFF) and the full security_acl host policy with DENY
    # (acl_full=ON). LIBTRACER_ACL_FULL swaps acl_policy_t at compile time, so
    # the full config is a distinct compilation the default job never covers (#345).
    #
    # The third leg rebinds tr::graph::lkv_slot_t to the hazard-reclamation slot
    # (ADR-0069 §1). lkv_slot_test covers both policies in every leg by naming them,
    # but only a rebound build puts one under graph_t — which is what caught the
    # deferred-reclamation-vs-injected-pmr-resource break in graph_pmr_test.
    strategy:
      matrix:
        include:
          - acl_full: OFF
            lkv_slot: sp_atomic_slot_t
          - acl_full: ON
            lkv_slot: sp_atomic_slot_t
          - acl_full: OFF
            lkv_slot: hazard_slot_t
    name: build-test (acl_full=${{ matrix.acl_full }}, slot=${{ matrix.lkv_slot }})
    steps:
      # Runs as root INSIDE the container — never `sudo`, which the self-hosted runner
      # user does not have. `git` + `ca-certificates` come first because checkout falls
      # back to a REST tarball without them.
      - name: Toolchain (container has no preinstalled tool set)
        # The wedge surface. Measured over 90 runs of this step across the jobs below:
        # p50 0.67 min, max 1.32. 8 = ~6x the worst healthy install.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure + build (C++23) + ctest
        run: |
          cmake -S core -B core/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLIBTRACER_ACL_FULL=${{ matrix.acl_full }} -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }}
          cmake --build core/build -j "$(nproc)"
          ctest --test-dir core/build --output-on-failure
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  # MINIMAL MODULE SET (#1293). Every other leg here configures with the module options at
  # their defaults (all ON), so nothing in CI ever linked the closed module set ADR-0047
  # promises: the L0/L1 substrate + wire codec + graph runtime, with the net/routing plane
  # and every transport OFF. That is the configuration an MCU consumer selects, and it built
  # the LIBRARY fine while its TESTS did not link at all — the test targets were
  # unconditional while the library sources were gated. This leg is the evidence: same
  # sources, the minimal option set, BUILD_TESTING=ON, and the reduced ctest suite run.
  build-test-minimal-set:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured healthy max 2.97 min. Held at the build-test group's 20 rather than
    # tightened: same container + apt step, same wedge surface.
    timeout-minutes: 20
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # The wedge surface. Measured over 90 runs of this step across the jobs below:
        # p50 0.67 min, max 1.32. 8 = ~6x the worst healthy install.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure + build (minimal module set) + ctest
        run: |
          cmake -S core -B core/build-minimal -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLIBTRACER_NET_PLANE=OFF \
            -DLIBTRACER_TRANSPORT_TCP=OFF -DLIBTRACER_TRANSPORT_UDP=OFF \
            -DLIBTRACER_TRANSPORT_WS=OFF -DLIBTRACER_TRANSPORT_CAN=OFF
          cmake --build core/build-minimal -j "$(nproc)"
          ctest --test-dir core/build-minimal --output-on-failure

  # THE SECOND RECLAMATION POLICY (#894, ADR-0080). `reclaim_local_t` is the default and every
  # other leg here compiles it; `reclaim_strict_t` is the opt-in zero-cost MCU mode, and a seam
  # whose other member nothing ever builds is a seam that has already rotted. This leg binds it
  # and runs the whole suite — `reclaim_test` follows the binding by `if constexpr`, dropping
  # the three re-entrant cases the policy forbids, so one executable serves both.
  #
  # It is bound with an ORDINARY override fragment rather than a `-D` knob, per ADR-0068: a new
  # configuration member does not get a CMake variable, it is set in `config_override.hpp` as
  # plain C++. Three lines that inherit the defaults, so it cannot drift from them.
  build-test-reclaim-strict:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured healthy max 4.88 min. 20 = ~4x; same group, same container apt step.
    timeout-minutes: 20
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # The wedge surface. Measured over 90 runs of this step across the jobs below:
        # p50 0.67 min, max 1.32. 8 = ~6x the worst healthy install.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Bind reclaim_strict_t, build + ctest
        run: |
          mkdir -p "$PWD/reclaim-strict/libtracer"
          cat > "$PWD/reclaim-strict/libtracer/config_override.hpp" <<'FRAGMENT'
          /**
           * @file
           * @brief GENERATED CI fixture — the ADR-0080 zero-cost reclamation policy bound.
           */
          #pragma once

          namespace tr::graph {

          /** @brief The defaults, with re-entrant unsubscribe forbidden (an MCU target). */
          struct reclaim_strict_config_t : default_config_t {
              using reclaim_policy_t = reclaim_strict_t;
          };

          using config_t = reclaim_strict_config_t;

          }  // namespace tr::graph
          FRAGMENT
          cmake -S core -B core/build-strict -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-I$PWD/reclaim-strict"
          cmake --build core/build-strict -j "$(nproc)"
          ctest --test-dir core/build-strict --output-on-failure

  build-test-reclaim-qsbr:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Bind reclaim_qsbr_t, build + ctest
        run: |
          mkdir -p "$PWD/reclaim-qsbr/libtracer"
          cat > "$PWD/reclaim-qsbr/libtracer/config_override.hpp" <<'FRAGMENT'
          /**
           * @file
           * @brief GENERATED CI fixture — the ADR-0080 CROSS-THREAD reclamation policy bound.
           */
          #pragma once

          namespace tr::graph {

          /** @brief The defaults, with a grace point spanning every thread (a many-core host). */
          struct reclaim_qsbr_config_t : default_config_t {
              using reclaim_policy_t = reclaim_qsbr_t;
          };

          using config_t = reclaim_qsbr_config_t;

          }  // namespace tr::graph
          FRAGMENT
          cmake -S core -B core/build-qsbr -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_FLAGS="-I$PWD/reclaim-strict"
          cmake --build core/build-qsbr -j "$(nproc)"
          ctest --test-dir core/build-qsbr --output-on-failure

  # WEAKLY-ORDERED host gate (#1140). Every other leg here runs x86-64, whose TSO model
  # hides an entire class of defect: a seq_cst store lowers to a locked `xchg`, so a LATER
  # RELAXED load of zero still cannot observe the pre-store world. Every acquire/release and
  # Dekker pairing in the graph's lock-free gates — `own_subs_ordered`'s fan-out skip (#635),
  # `mark_pending`'s deferred skip (#1140) — is therefore untestable where CI runs, and both
  # were argued from the code rather than covered. aarch64 does NOT order a relaxed load
  # after a seq_cst store, which is the same property the shipped rv32 targets have and the
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .
  # reason those arguments matter at all. This leg is the real evidence: same sources, same
  # ctest, a memory model that can actually exhibit the anomaly. Ablate it by relaxing any of
  # those ordered loads — the graph race guards can then fail HERE and nowhere else.
  # NOT routed to `ci-local`: the self-hosted runners are x86-64, and this leg exists
  # precisely to run somewhere x86-64's TSO model does not hide the defect. Hosted,
  # permanently.
  build-test-arm64:
    runs-on: ubuntu-24.04-arm
    # Measured healthy max 4.92 min. 20 = ~4x. No container and no apt step here, but the
    # number is kept equal to the rest of the build-test group so one review covers them.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure + build (C++23, aarch64) + ctest
        run: |
          cmake -S core -B core/build-arm64 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build core/build-arm64 -j "$(nproc)"
          ctest --test-dir core/build-arm64 --output-on-failure

  # GCC-15 host gate: build the core + ctest with GCC 15 (the same major the
  # ESP-IDF v6.0 RISC-V toolchain ships), so the core is gated on the compiler
  # the MCU actually uses — catches toolchain-version-specific issues (e.g. the
  # FNV-1a 64-bit-constant overflow on 32-bit size_t GCC 15 newly -Werror's).
  # GCC 15 is not in ubuntu-24.04's default repos; the toolchain test PPA carries it.
  build-test-gcc15:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured healthy max 4.68 min (5.17 on the incident day) — the worst of the
    # build-test group, because it adds an `add-apt-repository` PPA round-trip on top of
    # the container apt step. 20 = ~3.9x.
    timeout-minutes: 20
    steps:
      # Same PPA as before, minus `sudo` (root in the container) plus
      # software-properties-common, which the hosted image preinstalls and a bare
      # ubuntu:24.04 does not. Same noble base, so apt resolves g++-15 identically.
      - name: Install g++-15 (toolchain PPA)
        # Two apt-updates plus a PPA add: measured p50 1.55 min, max 2.60. 10 = ~4x.
        timeout-minutes: 10
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends g++-15 gcc-15
      - uses: actions/checkout@v4
      - name: Configure + build (C++23, GCC 15) + ctest
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -S core -B core/build-gcc15 -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15
          cmake --build core/build-gcc15 -j "$(nproc)"
          ctest --test-dir core/build-gcc15 --output-on-failure
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  # Both sanitizer legs run against both LKV slot bindings (ADR-0069 §1) as parallel
  # matrix jobs rather than extra steps, so the second binding costs no wall clock.
  # hazard_slot_t is hand-rolled lock-free reclamation: ASan/LSan is what proves a
  # displaced node is neither freed under a reader nor leaked, and TSan is what proves
  # the announce/re-read protocol actually orders. A green single-threaded run does not.
  # NOT routed to `ci-local` (phase 2): the `setarch -R` below sets
  # `personality(ADDR_NO_RANDOMIZE)`, which Docker's default seccomp profile denies
  # (EPERM), so the container route cannot run this leg — and without a container the
  # job would assume a host toolchain these runners are not asserted to carry. Routing
  # it needs a runner-side `--security-opt seccomp=unconfined` decision first.
  sanitizers:
    runs-on: ubuntu-24.04
    # Measured healthy max 7.98 min, p50 7.4-7.6, min 7.33 — a very tight distribution.
    # 25 = ~3.1x the observed max; ASan/UBSan runtime here is stable.
    timeout-minutes: 25
    strategy:
      matrix:
        lkv_slot: [sp_atomic_slot_t, hazard_slot_t]
    name: sanitizers (slot=${{ matrix.lkv_slot }})
    steps:
      - uses: actions/checkout@v4
      - name: ASan + UBSan build + ctest
        run: |
          cmake -S core -B core/build-asan -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          cmake --build core/build-asan -j "$(nproc)"
          # ASLR can make ASan/TSan abort in this runner; pin it off.
          setarch "$(uname -m)" -R ctest --test-dir core/build-asan --output-on-failure

  # NOT routed to `ci-local` (phase 2) — same `setarch -R` seccomp bar as `sanitizers`.
  tsan:
    runs-on: ubuntu-24.04
    # The longest core-ci jobs and legitimately the most variable: measured healthy max
    # 12.27 min (sp_atomic) / 8.22 (hazard) against a p50 of 6.5, and 15.67 on the
    # incident day. 35 = ~2.9x the healthy max — deliberately loose, because a false red
    # on a sanitizer leg is read as flakiness rather than as a wedge.
    timeout-minutes: 35
    strategy:
      matrix:
        lkv_slot: [sp_atomic_slot_t, hazard_slot_t]
    name: tsan (slot=${{ matrix.lkv_slot }})
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer build + ctest (graph concurrency)
        run: |
          cmake -S core -B core/build-tsan -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
          cmake --build core/build-tsan -j "$(nproc)"
          setarch "$(uname -m)" -R ctest --test-dir core/build-tsan --output-on-failure

  # The SAME TSan matrix with `reclaim_qsbr_t` bound (#1376). A separate job rather than a third
  # matrix axis because it needs the override fragment generated first. This is the gate that
  # matters most for this policy: it is the first one with real cross-thread ordering (a seq_cst
  # announce paired against the retiring thread's epoch RMW — a Dekker shape), and it must run at
  # BOTH lkv_slot bindings because `hazard_slot_t` is the leg that exercises #897's self-drain.
  tsan-reclaim-qsbr:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        lkv_slot: [sp_atomic_slot_t, hazard_slot_t]
    name: tsan qsbr (slot=${{ matrix.lkv_slot }})
    steps:
      - uses: actions/checkout@v4
      - name: ThreadSanitizer build + ctest (reclaim_qsbr grace period)
        run: |
          mkdir -p "$PWD/reclaim-qsbr-tsan/libtracer"
          cat > "$PWD/reclaim-qsbr-tsan/libtracer/config_override.hpp" <<'FRAGMENT'
          /**
           * @file
           * @brief GENERATED CI fixture — the ADR-0080 CROSS-THREAD reclamation policy bound.
           */
          #pragma once

          namespace tr::graph {

          /** @brief The defaults, with a grace point spanning every thread (a many-core host). */
          struct reclaim_qsbr_config_t : default_config_t {
              using reclaim_policy_t = reclaim_qsbr_t;
          };

          using config_t = reclaim_qsbr_config_t;

          }  // namespace tr::graph
          FRAGMENT
          cmake -S core -B core/build-tsan-qsbr -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DLIBTRACER_LKV_SLOT=${{ matrix.lkv_slot }} \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -I$PWD/reclaim-qsbr-tsan"
          cmake --build core/build-tsan-qsbr -j "$(nproc)"
          setarch "$(uname -m)" -R ctest --test-dir core/build-tsan-qsbr --output-on-failure

  # Regression guard for the CMake install/export (find_package packaging). Builds
  # + installs core to a staging prefix, then configures the tests/packaging fixture
  # SEPARATELY against that prefix — the real downstream flow: find_package(libtracer)
  # + link libtracer::libtracer + include a public header + call a compiled symbol.
  # Catches broken install rules, a malformed package config, or a missing exported
  # target before they reach a consumer.
  install-consume:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 1.78 min (p50 ~1.1). Short-job floor of 15 rather than 3x (~5 min):
    # the entire risk here is the container apt step, so the ceiling answers "how long is
    # it acceptable to be wedged", not "how long does the work take".
    timeout-minutes: 15
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # The wedge surface. Measured over 90 runs of this step across the jobs below:
        # p50 0.67 min, max 1.32. 8 = ~6x the worst healthy install.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Build + install core to a staging prefix
        run: |
          cmake -S core -B core/build-install -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build-install -j "$(nproc)"
          cmake --install core/build-install --prefix "${RUNNER_TEMP}/prefix"
      - name: Consume via find_package(libtracer)
        run: |
          cmake -S tests/packaging -B "${RUNNER_TEMP}/consumer" \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/prefix"
          cmake --build "${RUNNER_TEMP}/consumer" -j "$(nproc)"
          "${RUNNER_TEMP}/consumer/app"
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  # Compile EVERY bench target, run none of them (#781). The measuring workflows
  # (perf.yml, docs.yml) each name the handful of targets they execute, so a bench
  # nobody currently runs is compiled by nothing — and rots silently against the very
  # API changes it was written to measure. bench_pin_ratio, bench_pin_net and the
  # pin_bench example all stopped compiling the moment RFC-0022 §3.B deleted
  # `settings_t`, and the tree stayed green for six PRs. This job is the guard: it
  # is a COMPILE gate, so it costs one build and cannot be confounded by a runner's
  # load. Ablate it by reverting any bench to a deleted API — the job goes red.
  bench-compile:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 2.10 min (p50 ~1.3) — the longest of the short container jobs.
    # Short-job floor of 15; see install-consume for why it is not 3x.
    timeout-minutes: 15
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # The wedge surface. Measured over 90 runs of this step across the jobs below:
        # p50 0.67 min, max 1.32. 8 = ~6x the worst healthy install.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git ca-certificates
      - uses: actions/checkout@v4
      - name: Configure + build every bench target (compile only, nothing is run)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build -j "$(nproc)"
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  # This workflow's own `paths:` trigger, gated against what its jobs actually build
  # (#1082). The list used to be hand-written — `core/**`, `bench/**`,
  # `tests/packaging/**` — while ctest targets defined in core/tests/CMakeLists.txt
  # compile ESP-IDF sources out of `integrations/esp-idf/` and read the conformance
  # vectors out of `tests/conformance/`. Neither tree was named, so a pull request
  # confined to one of them ran no host test at all, from the very suites written to
  # cover it. tools/gen_ci_paths.py re-derives the list from a real configure of the
  # core project (CMake file-api: target sources, include directories, path-valued
  # compile definitions, ctest properties) plus every `cmake -S <dir>` this file runs,
  # and fails here on any drift. Making a suite compile a new tree means editing a
  # CMakeLists under `core/**`, which is always in the trigger, so this check runs on
  # exactly the changes that can invalidate it. Ablate it by deleting a `paths:` entry
  # — the job goes red naming that entry.
  ci-paths:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 1.80 min (p50 ~1.0). Short-job floor of 15 (has a package install).
    timeout-minutes: 15
    steps:
      # `gen_ci_paths.py --check` runs a REAL configure of the core project and reads
      # the CMake file-api back, so this leg needs the compiler too — not just python.
      - name: Toolchain (container has no preinstalled tool set)
        # Same step, same measured distribution as the build legs' (p50 0.67, max 1.32).
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential cmake git python3 ca-certificates
      - uses: actions/checkout@v4
      - name: core-ci's paths trigger covers everything core-ci builds
        run: python3 tools/gen_ci_paths.py --check
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  format:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 1.17 min (p50 0.7) — but it apt-installs TWICE (the toolchain step and
    # clang-format below), so the short-job floor of 15 covers both round-trips.
    timeout-minutes: 15
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # Same step, same measured distribution as the build legs' (p50 0.67, max 1.32).
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      # `clang-format` comes from the same noble archive the hosted image installed it
      # from, so the enforced style is the same version's, not a second dialect.
      - name: clang-format (dry-run, error on diff)
        # The step needs bash for `mapfile` and process substitution; inside a
        # `container:` job the runner may resolve the default shell to plain sh.
        shell: bash
        # It apt-installs INLINE before doing its real work, so the cap covers both
        # halves; the whole step measures well under a minute.
        timeout-minutes: 8
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang-format
          mapfile -t files < <(find core/include core/src core/tests core/examples \
            tests/packaging -name '*.hpp' -o -name '*.cpp')
          clang-format --dry-run --Werror "${files[@]}"
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .

  doxygen-gate:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 1.30 min (p50 0.8). Short-job floor of 15; like `format` it
    # apt-installs twice, so both round-trips are inside this ceiling.
    timeout-minutes: 15
    steps:
      - name: Toolchain (container has no preinstalled tool set)
        # Same step, same measured distribution as the build legs' (p50 0.67, max 1.32).
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Doxygen strict gate (undocumented public symbol = failure)
        # Also apt-installs inline before its real work; same cap as `clang-format`.
        timeout-minutes: 8
        run: |
          apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends doxygen
          doxygen core/Doxyfile
      - name: Restore workspace ownership for the host runner
        # This job runs as root inside `container:` on a self-hosted runner whose
        # _work tree is shared with non-container jobs (perf-local's bench-local runs
        # directly on the host); root-owned leftovers break their checkout cleanup.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" .
