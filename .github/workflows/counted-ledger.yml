# The counted-metrics ledger (#2137): the gate the peer-path work (#2136) is judged by.
#
# Copies, syscalls and task switches per relayed frame, RAM per peer and idle wakeups per
# second, pinned per target in bench/ledger/*.json. Every figure is a COUNT, so it does not
# move with runner load and needs no A/A pair: it can render a verdict on a hosted runner,
# on every PR. A raise fails; a fall fails too, with the re-pin instruction, as the symbol
# ratchet does, so a pin never sits above the truth.
#
# Two checks, and why both:
#   * the pin-file ratchet (`counted_ledger.py diff`) compares the PR's pins with its base.
#     A pin may not rise without a waiver, may not move without naming the change in
#     `moved_by`, and may not disappear. For a MID row, which is a static count read from
#     the code, this IS the gate: its pin is the count.
#   * the measured gate (`counted_ledger.py gate`) runs bench_peer_counts and bench_conn_ram
#     and compares the WIDE rows with their pins. The RAM rows ram_census_pins.json pins
#     read their pins, band and mode from that file, which is still warn-first, so their
#     drift warns and does not fail until its activation block says so. The RAM rows the
#     ledger pins itself (remote subscriptions, a peer's buffer after a 16 KiB frame) fail.
#
# History is not written here: perf-local.yml banks one point per row on every merge to
# main, into the bench-local store the perf page's ledger section reads.
#
# Like symbol-ratchet.yml, no `paths:` filter: a check that never reports blocks a PR
# forever (the #1614 trap). The job decides for itself whether to build.
name: counted-ledger

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # Docs-only PRs skip (core-ci.yml's header, DOCS-ONLY PULL REQUESTS). Not a required
  # check, so a workflow-level filter is safe here.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

# One run per PR (a newer push supersedes the older one); on main every push keeps its own run.
concurrency:
  group: counted-ledger-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  counted-ledger:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      # The trusted route also mounts the persistent compiler cache (core-ci.yml's
      # COMPILER CACHE header); the guard is the `runs-on` one verbatim.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice -v /home/github-runner/ccache:/ccache -v /sys/fs/cgroup/runners.slice/runners-ci.slice:/ci-slice:ro' || '--memory 10g' }}
    timeout-minutes: 30
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            n=$(ls -d /ci-slice/docker-*.scope 2>/dev/null | wc -l)
            echo "CI containers running in runners-ci.slice (this one included): $n"
            if [ "$n" -ge 1 ] && [ "$n" -le 3 ]; then jobs=4; else jobs=2; fi
          else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Did anything a counted row is built from change?
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"
            echo "no usable base; measuring"; exit 0
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          if git diff --name-only "$BASE" HEAD | grep -v '\.md$' | grep -qE '^(core|bench)/|^\.github/workflows/counted-ledger\.yml$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "core/ or bench/ changed; measuring"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "nothing under core/ or bench/ changed; no count can move"
          fi
      - name: Ledger decision-rule tests
        if: steps.scope.outputs.run == 'true'
        run: python3 bench/test_counted_ledger.py
      - name: Pin-file ratchet against the base
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.base != ''
        run: python3 bench/counted_ledger.py diff --base "${{ steps.scope.outputs.base }}"
      - name: Build the counting instruments (Release)
        if: steps.scope.outputs.run == 'true'
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_peer_counts bench_conn_ram --parallel "$BUILD_JOBS"
      # Printed whole, pass or fail: the transcript is the record, and a gate whose numbers
      # show only when it fails cannot be re-pinned from its own log.
      - name: Measure (bench_peer_counts, bench_conn_ram)
        if: steps.scope.outputs.run == 'true'
        run: |
          # pipefail: a bench that fails to measure (a refused subscribe in any repetition, a
          # pushed frame never delivered) exits non-zero, and `tee` must not swallow that.
          set -o pipefail
          ./bench/build/bench_peer_counts --reps=3 | tee bench/bench_peer_counts_raw.txt
          ./bench/build/bench_conn_ram --no-can --reps=5 | tee bench/bench_conn_ram_raw.txt
      - name: Counted-metrics gate
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 bench/counted_ledger.py gate --mode fail \
            --raw bench/bench_peer_counts_raw.txt --conn-raw bench/bench_conn_ram_raw.txt
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
