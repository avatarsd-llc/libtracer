#
# The doc-citation gate, on every change that can move a cited line.
#
# `tools/check_doc_citations.py` pins each `file:line` citation in the docs to a
# substring the cited line must contain. It ran in ONE place — `docs.yml` — whose path
# filter is a documentation filter: `docs/**`, `*.md`, `core/include/**`, `tools/**`.
# `core/src/**` is not in it, and neither is `integrations/**`. Over half the anchors
# point into exactly those two trees, so the commits most able to shift a citation were
# the commits that ran no check at all (#803). This job closes that: its filter is the
# UNION of every tree an anchor can name plus every tree a citation can live in.
#
# `backends/**` joined that union with the GPU backend's move out of core (#1381): the
# tier's CMake project is an enrolled non-source path, so a commit that shifts a line in
# it must be a commit this gate fires on — the same rule `EnrolledPathsArePinnedTest`
# enforces for every other enrolled path.
#
# It is deliberately its own workflow rather than a step inside core-ci: the check needs
# no build, no toolchain and ~0.3 s, and hanging it off a 3-way build matrix would make a
# doc-only failure wait on compilation.
#
# `tools/check_config_keys.py` rides along (#1012). It is the same GENRE of check — a
# hand-maintained doc pointer that rots silently — over a different artifact: the
# connection-config key tables in `docs/modules/connection-config.md`, derived from the
# `tr::net::config_reader_t` accessor calls that actually read those keys. It needs the
# same two trees (`docs/**`, `core/**`), the same zero build, and the same ~0.1 s, so a
# second workflow would only duplicate this one's checkout.
#
# RUNNER ROUTING (self-hosted `ci-local`). This job's filter is the widest in the repo,
# so it is also the one that fires most often — which is exactly what makes it worth
# moving off hosted queue time. The guard in `runs-on:` picks the self-hosted runners
# only when the run is trusted: this repository (not a fork of it) AND (the event is not
# a pull_request OR the PR head branch lives in this same repository).
#
# SECURITY (public repo + self-hosted runner): fork code must never execute on the
# self-hosted machine — those runners are non-ephemeral hardware on the maintainer's
# network, and a fork PR runs attacker-authored steps. The expression is the ONLY thing
# standing between a fork PR and that machine; keep it verbatim, and note Actions cannot
# expand a YAML anchor or read a job `env:` from `runs-on:`, so it is repeated per job
# by necessity. A fork PR falls back to `ubuntu-24.04`, so this required check never
# waits on hardware a fork cannot use.
#
# CONTAINER: the self-hosted runners are bare machines with no preinstalled tool set,
# so the job runs in `container: ubuntu:24.04` on BOTH routes.
# That image ships python 3.12 — the very version `setup-python` was pinning — so the
# interpreter pin now comes from the image and the action is gone with it, one less
# moving part in a job whose whole point is that it needs no toolchain.
name: doc-citations

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "core/**"
      - "backends/**"
      - "bench/**"
      - "tests/**"
      - "integrations/**"
      - "examples/**"
      - "tools/check_doc_citations.py"
      - "tools/tests/test_check_doc_citations.py"
      # An anchor may now name a tooling script (#1052). `tools/**` is deliberately NOT
      # the entry — most of this tree cannot move a cited line — so every enrolled path
      # UNDER `tools/` is listed one by one, and `EnrolledPathsArePinnedTest` fails if one
      # is missed. The other enrolled build path, `core/tests/CMakeLists.txt`, needs no
      # entry of its own: the `core/**` filter above already covers it.
      - "tools/cortexm0_footprint.py"
      - "tools/check_config_keys.py"
      - "tools/tests/test_check_config_keys.py"
      # The #1538 workspace-ownership gate and its tests ride in this job, so a change
      # to either must fire it — same rule as the two checks above.
      - "tools/check_ci_workspace_cleanup.py"
      - "tools/tests/test_check_ci_workspace_cleanup.py"
      - ".github/workflows/doc-citations.yml"
      # #1095 enrolled seven more non-source paths. Four sit under `core/**`, `bench/**`
      # or `integrations/**` and are already covered above; these three are not, and an
      # anchor that no job fires on is not a gate. Listed exactly rather than as
      # `.github/workflows/**` and `bindings/**`, for the same reason `tools/**` is not
      # the entry: most of those trees cannot move a cited line.
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/footprint-cortexm0.yml"
      - "bindings/typescript/packages/client/test/mesh-testbed.test.mjs"
  pull_request:
    # Duplicated rather than a YAML anchor: GitHub Actions does not expand aliases.
    paths:
      - "docs/**"
      - "**/*.md"
      - "core/**"
      - "backends/**"
      - "bench/**"
      - "tests/**"
      - "integrations/**"
      - "examples/**"
      - "tools/check_doc_citations.py"
      - "tools/tests/test_check_doc_citations.py"
      - "tools/cortexm0_footprint.py"
      - "tools/check_config_keys.py"
      - "tools/tests/test_check_config_keys.py"
      - "tools/check_ci_workspace_cleanup.py"
      - "tools/tests/test_check_ci_workspace_cleanup.py"
      - ".github/workflows/doc-citations.yml"
      - ".github/workflows/core-ci.yml"
      - ".github/workflows/footprint-cortexm0.yml"
      - "bindings/typescript/packages/client/test/mesh-testbed.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doc-citations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ (github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container: ubuntu:24.04
    # Measured max 0.87 min, p50 0.65, min 0.48. 15 = the short-job floor (~17x): it runs
    # in a bare ubuntu container with the apt step below, and it is routed to the
    # self-hosted ci-local pool where queue-before-start reached 3.20 min (queue time does
    # NOT count against timeout-minutes). See core-ci.yml's header for the policy.
    timeout-minutes: 15
    steps:
      # Runs as root inside the container — never `sudo`. `git` + `ca-certificates`
      # come first because checkout falls back to a REST tarball without them.
      - name: python3 + git (container has no preinstalled tool set)
        # Measured p50 0.22 min, max 0.45. 8 = the install-step floor.
        timeout-minutes: 8
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 git ca-certificates
      - uses: actions/checkout@v4
      # The resolver reads three citation spellings (full path, basename shorthand,
      # bare `:N` continuation) and must not guess; its unit tests run FIRST so a
      # resolver bug reports as a resolver bug rather than as 300 phantom drifts.
      - name: Resolver unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_doc_citations.py" -v
      - name: Doc-citation gate (anchored file:line citations still resolve)
        run: python3 tools/check_doc_citations.py
      # Same reasoning one artifact over: the key extractor is a derivation, and a
      # derivation that under-reads makes the gate pass over an incomplete page.
      - name: Config-key extractor unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_config_keys.py" -v
      - name: Config-key gate (the connection-config page matches the source that reads the keys)
        run: python3 tools/check_config_keys.py
      # The #1538 workspace-ownership gate, run HERE as well as in core-ci's `ci-paths`
      # job. This job is itself a self-hosted `container:` job, and this workflow's
      # `paths:` include this file while core-ci's do not — so an edit that adds or
      # breaks a cleanup step in this file is gated by the commit that makes it. Its own
      # unit tests run first, same rule as the two checks above.
      - name: Workspace-ownership gate unit tests
        run: python3 -m unittest discover -s tools/tests -p "test_check_ci_workspace_cleanup.py" -v
      - name: Every self-hosted container job restores workspace ownership
        run: python3 tools/check_ci_workspace_cleanup.py
      - name: Restore workspace ownership for the host runner
        # Hands the container's root-owned tree back to the host runner user. WHY, and
        # why it is duplicated inline rather than factored into a composite action: the
        # WORKSPACE OWNERSHIP section of core-ci.yml's header. Gated by
        # tools/check_ci_workspace_cleanup.py — every self-hosted `container:` job must
        # END with this exact step.
        if: always()
        run: chown -R "$(stat -c '%u:%g' ..)" . "$RUNNER_TEMP"
