#
# Build the Sphinx documentation and deploy it to GitHub Pages. Pull requests
# build only (to verify); pushes to main build and deploy.
#
# One-time setup: in the repository settings, set Pages → Build and deployment →
# Source = "GitHub Actions".
name: docs

# ── ALWAYS TRIGGERED, GATED BY A `changes` JOB (#1614) ──────────────────────────────
# `build` is a REQUIRED check, and a required check from a path-filtered workflow
# never reports on a diff outside its paths, so such a pull request is BLOCKED with
# nothing to fix. The workflow therefore triggers on every change; the `changes` job
# matches a pull request's diff against DOCS_PATHS (derived by tools/gen_ci_paths.py,
# checked by core-ci's `ci-paths` job), `docs-build` runs only when something matched,
# and the `build-required` job — NAMED `build`, the only producer of that check name —
# always reports the verdict.
#
# A push to main always builds and deploys, exactly as a matching push did before.
#
# ── THE PAGE FOLLOWS THE BENCH STORE (2026-10-07) ───────────────────────────────────
# The Performance page is generated from the gh-pages bench stores at build time, and a
# push builds within seconds of the merge, while perf-local banks that merge's point
# 5-20 min later. Its push to gh-pages uses GITHUB_TOKEN, which triggers no workflow, so
# the newest point reached the page only when some LATER push happened to rebuild it.
# `workflow_run` closes that: every completed, successful perf-local run rebuilds and
# redeploys `main`. It is a hosted job. perf-local itself triggers only on pushes to
# `main` or a `v*` tag, the schedule and manual dispatch, never from a fork, and the
# `changes` job checks the triggering run's repository, branch and event again before
# anything builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [perf-local]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write # post the libtracer-vs-Zenoh absolute comparison as a PR comment

# Deploys serialize on one group; PR builds do NOT belong in it.
#
# This used to be a bare `group: pages` for every trigger, which quietly broke PR
# checks: GitHub keeps at most ONE pending run per concurrency group, so whenever a
# second PR's docs build was queued behind the first, it was CANCELLED rather than
# queued. A cancelled check is not a red check — it reports no conclusion at all, so
# the PR simply appears to have no docs result, and any merge gate counting completed
# checks sees nothing to wait for. That is not hypothetical; it let a PR merge on an
# incomplete matrix.
#
# A pull_request run never reaches the deploy job (`if: github.ref == 'refs/heads/main'`
# on both the artifact upload and the deploy job), so it has no claim on the deployment
# lock. PR builds therefore get their own per-PR group, where cancel-in-progress is not
# only safe but wanted: a force-push supersedes its own earlier build.
#
# `main` builds no longer share a WORKFLOW-level group (2026-10-07). The whole run held
# `pages` until its deploy finished, so one deploy that hung in `waiting` (run
# 37443785572, e95d1fca, 2026-10-06 09:55, no reviewer and no wait timer configured) held
# the group for a day, and every later push run queued behind it and was cancelled by the
# next one: 13 consecutive main pushes, 7f07e5c4 through 7894a2e3, never deployed. Builds
# now run in a group of their own run, and only the `deploy` JOB takes `pages`, with
# cancel-in-progress: a newer deploy cancels an older or wedged one, and a deploy whose
# commit is no longer the head of `main` skips itself, so an older build cannot overwrite
# a newer page.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.event.pull_request.number) || format('docs-main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether a pull request can affect the docs build. Hosted, read-only, and
  # it executes nothing from the diff beyond `git diff`.
  changes:
    # A `workflow_run` rebuild runs only for a SUCCESSFUL perf-local run of this
    # repository's `main` or a release tag, started by a push, the schedule or a dispatch.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # DERIVED by tools/gen_ci_paths.py -- do not hand-edit: this list is what
      # docs's jobs read and build. `gen_ci_paths.py --apply` rewrites it.
      DOCS_PATHS: |
        CONTEXT.md
        bench/**
        bindings/rust/examples/fwd_read_stats.rs
        bindings/rust/examples/fwd_subscribe.rs
        bindings/rust/examples/fwd_write.rs
        bindings/rust/examples/path_tlv.rs
        bindings/rust/examples/value_crc.rs
        bindings/typescript/examples/remote-error.mjs
        bindings/typescript/examples/subscribe.mjs
        bindings/typescript/examples/value-crc.mjs
        bindings/typescript/examples/write-read.mjs
        bindings/typescript/examples/ws-dial.mjs
        core/**
        docs/**
        index.md
        integrations/esp-idf/examples/concepts/arena_sizing/main/app_main.cpp
        integrations/esp-idf/examples/concepts/minimal/main/app_main.cpp
        integrations/esp-idf/examples/concepts/one_link/main/app_main.cpp
        integrations/esp-idf/examples/concepts/single_threaded/main/app_main.cpp
        integrations/esp-idf/examples/concepts/stats_subpools/main/app_main.cpp
        integrations/esp-idf/libtracer/**
        integrations/esp-idf/tests/host/**
        tests/conformance/**
        tools/**
        .github/workflows/docs.yml
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is the merge commit: HEAD^1 is the base tip it was
          # merged onto, so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2
          persist-credentials: false
      - name: Match the diff against DOCS_PATHS
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        # Every uncertain branch answers `true` (build): a needless build costs minutes,
        # a wrong skip is a green required check on docs nobody built. The patterns are
        # `<dir>/**` and exact paths, and bash's `[[ == ]]` lets `*` cross `/`, so a
        # match here is never narrower than GitHub's own glob. Pushes always build (see
        # the header).
        run: |
          set -euo pipefail
          relevant=true
          if [ "$EVENT" = "pull_request" ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            changed="$RUNNER_TEMP/changed"
            git diff --name-only -z HEAD^1 HEAD > "$changed"
            relevant=false
            mapfile -t patterns <<< "$DOCS_PATHS"
            while IFS= read -r -d '' file; do
              for pat in "${patterns[@]}"; do
                [ -n "$pat" ] || continue
                # shellcheck disable=SC2053  # $pat is a glob on purpose
                if [[ "$file" == $pat ]]; then
                  echo "match: $file  (pattern $pat)"
                  relevant=true
                  break 2
                fi
              done
            done < "$changed"
            [ "$relevant" = true ] || echo "no changed path matches DOCS_PATHS; the docs build is skipped"
          else
            echo "event '$EVENT': building unconditionally"
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant"

  docs-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Its verdict is the REQUIRED status check `build` (through `build-required`), so a
    # hung step here does not fail a PR — it blocks every merge behind it for GitHub's
    # 6-hour default. That is not theoretical:
    # on 2026-08-19 the `Install dependencies` step below wedged twice in one afternoon,
    # sitting `in_progress` for 56 and 36 minutes with no step progress, while the rest of
    # the matrix sat green. Both times cancel+rerun cleared it and the rerun passed in ~17
    # minutes, so the fault is transient and NOT this repo's content. The ceiling exists to
    # convert "wedged forever" into "red in an hour, retry it".
    timeout-minutes: 60
    steps:
      # Build parallelism (#1637): 6 on the self-hosted runners (their systemd units carry
      # CPUQuota=600%; more compilers than that only thrash), `nproc` on hosted runners.
      # RUNNER_ENVIRONMENT comes from the runner, so this follows the runtime `runs-on`
      # routing. POSIX sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS)
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then jobs=6; else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the released-version doc subtrees are rebuilt
          # from their vX.Y.Z tags on every deploy (tools/assemble_release_docs.sh).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install dependencies
        # The step that wedged (see the job-level note). Ten minutes is ~4x its healthy
        # runtime, so a genuine slow mirror still passes while a wedge fails fast and
        # names itself, instead of being read as "still running" for hours.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update && sudo -E apt-get install -y --no-install-recommends doxygen unzip
          pip install -r docs/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # rust-core's codec perf bench (`cargo run --release --example perf`) feeds the
      # cross-core matrix in gen_results_page.py; without a toolchain that row would
      # degrade to an "unavailable" note on the live page (ADR-0032 §auto-published).
      - uses: dtolnay/rust-toolchain@stable
      # DOCS_PATHS is derived from inputs that mostly live in this job's own gate
      # (docs/conf.py's include_patterns, the pages' literalincludes, this file's
      # commands), so it is re-checked here, in a run already gated on it; core-ci's
      # `ci-paths` job checks it too. A configure of the core, no build.
      - name: The changes job's DOCS_PATHS covers everything this build reads
        run: python3 tools/gen_ci_paths.py --check
      - name: API docs gate (Doxygen, strict — undocumented public symbol fails)
        run: doxygen core/Doxyfile
      # Doc-citation gate: every symbol citation in the docs must still name exactly one
      # place in its file, and no living doc may cite by line number (#1705, #1706).
      # Hand-maintained pointers rot silently — a stale citation still reads
      # authoritative and sends the reader somewhere else, so nothing fails without this.
      #
      # The AUTHORITATIVE run is `doc-citations.yml`, whose path filter covers every tree
      # a citation can name — `core/src/**` and `integrations/**` are absent from THIS
      # workflow's filter, so for most citations this step never fires (#803). It is
      # kept because it costs ~0.3 s inside a job that already runs for minutes, and it
      # fails the docs build itself rather than only a sibling check.
      - name: Doc-citation gate (symbol citations resolve; no line-number citations)
        run: python3 tools/check_doc_citations.py
      # Auto-generate the Performance & Conformance page from the LIVE harnesses
      # (cross-core matrix + perf bench + coverage), replacing the static snapshot
      # (ADR-0032 §auto-published). Regenerated in-place each build; the artifact
      # that deploys carries the fresh page. All three codec cores must render live:
      # cpp-core (bench_codec), ts-core (node perf.mjs — runs directly under node 22,
      # no install/build needed; it imports src/*.mjs, not the dist build), and
      # rust-core (cargo --example perf, via the rust-toolchain step above).
      - name: Build harnesses for the results page
        run: |
          cmake -S core -B core/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build core/build --parallel "$BUILD_JOBS"   # all test targets, for the live test report
          bash bench/fetch_zenoh.sh || echo "zenoh fetch failed — comparison will be omitted"
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_libtracer bench_codec bench_forward_heap bench_transports bench_forward_demux bench_chain_delivery --parallel "$BUILD_JOBS"
          # zenoh is optional: build it separately so a missing/failed vendor never breaks
          # the docs deploy (the comparison degrades to a note; libtracer numbers stand).
          cmake --build bench/build --target bench_zenoh bench_zenoh_net bench_zenoh_compose --parallel "$BUILD_JOBS" || echo "bench_zenoh unavailable — comparison omitted"
      # Run the libtracer-vs-Zenoh sweep ONCE here; both the docs page and the PR comment
      # consume this file (LIBTRACER_COMPARE_TSV) so the ~40s sweep isn't paid twice.
      - name: Run the libtracer-vs-Zenoh comparison sweep
        run: |
          out="${RUNNER_TEMP}/compare.tsv"
          raw="${RUNNER_TEMP}/compare-rounds.tsv"
          # BEST-OF-ROUNDS, both engines. A single round on a shared GitHub runner
          # publishes whatever that runner happened to be doing; contamination is
          # one-sided (a noisy neighbour can only make a round slower), so the best of a
          # few rounds is the estimator closest to the code. Both engines are executed in
          # the SAME loop the same number of times — reducing one arm over rounds while
          # the other gets one shot would be a thumb on the scale, not a measurement.
          : >"$raw"
          for r in 1 2 3; do
            { ./bench/build/bench_libtracer grid; ./bench/build/bench_zenoh grid; } >>"$raw" 2>/dev/null || true
          done
          python3 bench/best_of_rounds.py <"$raw" >"$out" || cp "$raw" "$out"
          # The composition-throughput rows are still NOT collected here. The harness that
          # earns them now exists (bench/run_compose.sh — two processes on both sides, the
          # receiver counts the values, and the publisher is audited for wire use), but
          # publishing that comparison is a reviewed step, so this job does not draw it.
          # The version that was withdrawn declared a Zenoh publisher with no subscriber and
          # no peer, so `put()` never reached the wire (5 sendto for 520 000 puts, all
          # scouting beacons) and it reported one K-independent rate for every K; the
          # libtracer side published sendmsg_rate x K, egress-only. Both curves were
          # arithmetic and only one engine did any I/O.
          # Network transports (UDP/TCP) — two-process pub/sub over real loopback sockets,
          # the SAME topology for both engines. Best-effort; never fails the build (a chart
          # is simply omitted if a transport doesn't come up).
          bash bench/run_net.sh >>"$out" 2>/dev/null || true
      # The trend charts' source rules (#1769): the page opens on bench-local, the hosted
      # store is the portability envelope, and the zenoh ratio is same-pass only. Tested
      # here because this job is the one that renders the charts; it needs no build.
      # Any change to bench/render_*.py, bench/gen_results_page.py or
      # docs/_static/perf_history.* reaches this step through DOCS_PATHS (bench/**,
      # docs/**) (#1853). The band tests execute docs/_static/perf_history.js under node
      # and SKIP without it, so node is asserted first: a missing node fails here
      # instead of passing with those tests skipped. `-v` names every test and skip.
      - name: Trend-chart renderer and page-script tests
        run: |
          node --version
          python3 bench/test_render_history.py -v
      # The sustained-step detector's decision rule (#1770): the page's "Recent steps"
      # table and the step markers on the trend charts are both drawn from it.
      - name: Sustained-step detector tests
        run: python3 bench/test_step_detect.py
      - name: Generate live performance + conformance page
        env:
          LIBTRACER_CXX_HARNESS: ${{ github.workspace }}/core/build/tests/conformance_runner
          LIBTRACER_COMPARE_TSV: ${{ runner.temp }}/compare.tsv
          # A missing bench binary must FAIL the published build, not degrade into a
          # placeholder sitting under prose that asserts measured figures (that is exactly
          # what happened to the forward-demux section). Local previews still degrade.
          LIBTRACER_DOCS_STRICT: "1"
        run: python3 bench/gen_results_page.py
      # Absolute-number comparison table, upserted as a single sticky PR comment (option
      # "publish result to pr"). Absolute values only — the full interactive charts land
      # on the Performance page after merge.
      - name: Post the absolute comparison on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const tsv = process.env.RUNNER_TEMP + '/compare.tsv';
            let table;
            try {
              table = execSync('python3 bench/render_compare.py --md', { input: fs.readFileSync(tsv), encoding: 'utf8' });
            } catch (e) { core.warning('comparison sweep produced no data; skipping PR comment'); return; }
            const marker = '<!-- ltz-compare -->';
            const body = `${marker}\n### 📊 libtracer vs Zenoh — absolute (this run)\n\n`
              + `Measured on this CI runner in the same pass. libtracer built from source at \`-O3\`; Zenoh is the upstream zenoh-c 1.9.0 prebuilt release. Absolute values, no ratios — `
              + `shared-runner variance is real, read trends not the third digit. Interactive charts land on the `
              + `[Performance page](https://libtracer.avatarsd.com/docs/performance.html) after merge.\n\n`
              + table;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Generate live test report (ctest across every suite)
        run: python3 bench/gen_test_report.py
      # -n -W --keep-going: nitpicky, warnings are errors, and report them all rather
      # than stopping at the first. This is the link-integrity gate — a broken
      # cross-reference, a dead toctree entry or an @ref that no page publishes fails
      # the PR check instead of shipping as unlinked plain text. docs/conf.py records
      # the two Breathe-generated reference classes that are deliberately not nitpicked.
      - name: Build (sphinx-build, config in docs/, source = repo root)
        run: sphinx-build -n -W --keep-going -b html -c docs . docs/_build/html
      # Released-version subtree cache (#1603). Each vX.Y.Z subtree is a pure function
      # of (tag, docs toolchain, assembler script), yet rebuilding all of them was ~13 of
      # this job's ~35 minutes on every PR. The key is
      #   release-docs-<toolchain fingerprint>-<hash of the ordered release-tag list>
      # where the fingerprint covers the RESOLVED toolchain (pip freeze, not the ranges
      # in docs/requirements.txt), the python and doxygen versions, and the assembler's
      # own hash. An exact hit copies every subtree and builds none. A new tag misses
      # the exact key, restores the newest entry with the same fingerprint by prefix,
      # and builds only the new tag. A toolchain or assembler change matches no prefix
      # and rebuilds everything, which is the same work as before this cache existed.
      # The cache lives outside the checkout, since the checkout is the Sphinx source root.
      - name: Fingerprint the released-docs toolchain
        id: release-docs-key
        run: |
          fp="$( { python3 --version; pip freeze; doxygen --version; sha256sum tools/assemble_release_docs.sh; } | sha256sum | cut -c1-16)"
          tags="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sha256sum | cut -c1-16)"
          echo "prefix=release-docs-${fp}-" >> "$GITHUB_OUTPUT"
          echo "key=release-docs-${fp}-${tags}" >> "$GITHUB_OUTPUT"
          echo "release-docs cache key: release-docs-${fp}-${tags}"
      - name: Restore the released-version subtree cache
        uses: actions/cache@v4
        # Same reasoning as the install step's ceiling: a healthy restore takes seconds,
        # so a stalled cache download fails here and names itself.
        timeout-minutes: 10
        with:
          path: ~/.cache/libtracer-release-docs
          key: ${{ steps.release-docs-key.outputs.key }}
          restore-keys: ${{ steps.release-docs-key.outputs.prefix }}
      # Rebuild each released version's docs from its vX.Y.Z tag into a subtree of
      # the site (deploy-pages replaces the WHOLE site every push, so released
      # subtrees must be re-assembled on every deploy, not once at release time).
      # Tags already in the cache are copied instead of rebuilt.
      # A tag whose docs fail to build is skipped — the manifest stays honest.
      - name: Assemble released-version doc subtrees
        # `~` is expanded by actions/cache but not in an `env:` value, hence $HOME here.
        run: RELEASE_DOCS_CACHE="$HOME/.cache/libtracer-release-docs" bash tools/assemble_release_docs.sh docs/_build/html
      # Emit the version manifest the sidebar switcher reads. It scans the built
      # site for the vX.Y.Z/ subtrees assembled above; "latest" (the main build,
      # at the site root) is always first.
      - name: Generate the docs version manifest (versions.json)
        run: python3 tools/gen_versions_json.py docs/_build/html
      # Mirror the benchmark-history chart into the deployed site. The trend store
      # (benchmark-action/github-action-benchmark, written ONLY by perf.yml) lives on
      # the machine-maintained `gh-pages` BRANCH, but Pages source is this workflow's
      # artifact — the branch itself is never served. Copying its dev/bench/ tree into
      # the artifact serves the interactive chart at <site>/dev/bench/ (linked and
      # embedded from the Performance page). Best-effort: a missing branch (fresh fork)
      # must never break a docs deploy. Freshness: the mirror updates on each docs
      # deploy; perf.yml and docs.yml share the core/** + bench/** push triggers, so
      # the served chart tracks main closely (at most one docs deploy behind).
      - name: Mirror the perf-history chart (gh-pages branch -> /dev/bench/)
        if: github.ref == 'refs/heads/main'
        run: |
          if git fetch --no-tags --depth=1 origin gh-pages; then
            git archive FETCH_HEAD dev | tar -x -C docs/_build/html/
            # Overlay a store-navigation banner onto the MIRRORED COPY of the two stock
            # benchmark-action pages. Each of them renders one store and names neither the
            # other one nor the unified family charts, so a reader landing there concludes
            # the site has a single store and no selector. The gh-pages branch is not
            # touched — only the extracted artifact tree. Idempotent, and fail-soft: an
            # upstream page whose shape changed ships unmodified with a workflow warning
            # rather than failing the deploy.
            python3 tools/inject_store_nav.py docs/_build/html
          else
            echo "gh-pages branch not found — perf-history chart omitted from this deploy"
          fi
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # THE REQUIRED CHECK `build` (#1614). Always runs: green when `docs-build` passed, or
  # when `changes` decided it had nothing to build and it was skipped; red otherwise
  # (failure, cancellation, or a skip the decision did not ask for).
  build-required:
    name: build
    # Not on a workflow_run rebuild: no pull request reads its check, and a skipped
    # `changes` there is a decision, not a failure.
    if: always() && github.event_name != 'workflow_run'
    needs: [changes, docs-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Combine the docs job results into one verdict
        env:
          CHANGES: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD: ${{ needs.docs-build.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "::error::the changes job ended '$CHANGES'; there is no decision to report"
            exit 1
          fi
          if [ "$RELEVANT" = "true" ]; then want=success; else want=skipped; fi
          if [ "$BUILD" != "$want" ]; then
            echo "::error::docs-build ended '$BUILD', expected '$want' (relevant=$RELEVANT)"
            exit 1
          fi
          echo "ok: docs-build $BUILD (relevant=$RELEVANT)"

  deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The deployment lock (see the workflow `concurrency:` above): newest deploy wins.
    concurrency:
      group: pages
      cancel-in-progress: true
    # #1403 bounded the build job above and left this job unbounded — it is a single
    # actions/deploy-pages@v4 call against a GitHub service and can hang the same way.
    # Measured max 1.05 min over the 10 deploy runs (healthy max 0.38, p50 0.23);
    # 10 = ~9.5x the worst observed.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Builds run in parallel now, so an older build can reach this job after a newer
      # one deployed. Only the build of `main`'s head deploys; a newer run owns the rest.
      - name: Deploy only the head of main
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" || head=""
          if [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved to ${head:0:8} since this build of ${GITHUB_SHA:0:8}; its own run deploys"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.fresh.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
