#
# On-silicon build gate for the integrations/esp-idf component. Builds the
# inprocess_mirror example (the libtracer P0 in-process profile) for a real
# RISC-V target inside the official espressif/idf Docker image. A clean
# `idf.py build` (a produced .bin/.elf, no errors) IS the gate — it proves
# libtracer's L0/L1/L2/L4 core compiles and links as an ESP-IDF managed
# component on single-core FreeRTOS, including the <atomic> segment-refcount path.
#
# This is a SEPARATE, standalone workflow (mirroring can-vcan-e2e.yml): the
# required core gates (build-test / sanitizers / format / doxygen) must never
# depend on the multi-GB ESP-IDF toolchain image. esp32c6 is the required
# target; the rest of the matrix exists so that every target claimed by
# `integrations/esp-idf/libtracer/idf_component.yml`'s `targets:` list is
# actually built (#1159). That list is a SUPPORT CLAIM the component manager
# enforces as a hard install rejection, so an unbuilt entry is a promise nothing
# checks. esp32c3 is a second RISC-V single-core check; esp32 and esp32s3 are
# Xtensa, and esp32 is additionally DUAL-core — before #1159 the matrix was
# RISC-V-only and single-core-only, so two claimed architectures and the whole
# `CONFIG_FREERTOS_UNICORE=n` configuration were unbuilt.
#
# Keep this matrix and that `targets:` list in sync in both directions: adding a
# target here without adding it there supports nothing, and adding it there
# without adding it here claims something untested.
name: esp-idf

on:
  push:
    branches: [main]
    paths:
      - "integrations/esp-idf/**"
      - "core/src/**"
      - "core/include/**"
      - "tools/check_esp_srcs.py"
      - "tools/check_esp_ws_plane.py"
      - "tools/check_esp_thread_id.py"
      - ".github/workflows/esp-idf.yml"
  pull_request:
    paths:
      - "integrations/esp-idf/**"
      - "core/src/**"
      - "core/include/**"
      - "tools/check_esp_srcs.py"
      - "tools/check_esp_ws_plane.py"
      - "tools/check_esp_thread_id.py"
      - ".github/workflows/esp-idf.yml"
  workflow_dispatch:

# ── Footprint contract (full-node job): TRACKED, never GATED ─────────────────
# The libtracer component's flash and static-RAM contribution is MEASURED and
# PUBLISHED on every run — a markdown table in the job step summary plus the
# machine-readable footprint-<target> artifact — and it is never a merge gate.
# No ceiling is set here, by maintainer ruling: the library must stay free to
# serve the thinnest possible client, and what actually has to fit is the
# PRODUCT image on its own target, which CI cannot know. A ceiling here would
# police a number nobody deploys and would red a main for a feature landing.
# Regressions are caught by READING the tracked numbers run to run, not by a
# threshold. (tools/esp_size_gate.py still fails the job if it cannot parse the
# esp-idf-size output — a broken reporter must not look like a green report.)
#
# MEASURED provenance, kept as historical reference (PR #193 first run,
# 2026-07-03, espressif/idf:release-v6.0, -Os): libtracer.a flash 78,825 B
# (esp32c3) / 82,861 B (esp32c6); static RAM 16 B on both. Both figures have
# moved since — CURRENT numbers live in the footprint-<target> artifact and the
# step summary, never in this comment. The library holds no internal buffers
# (ADR-0041 §5): its static RAM is function-local bookkeeping only, a property
# tracked and reviewed rather than enforced by a tight ceiling. The reported
# numbers cover the libtracer component archive (libtracer.a) only, not the
# whole app image.

jobs:
  # Fast fail-first guard: every core/src/*.cpp is either in the component's
  # hand-maintained LIBTRACER_SRCS or explicitly opted out. Catches the "new core
  # source forgotten in the ESP list" drift at lint time instead of as a much later
  # full-node LINK error (the two lists legitimately differ — core assembles
  # conditionally, the ESP list is a flat subset — so they can't share a fragment).
  srcs-drift:
    runs-on: ubuntu-24.04
    # Measured max 0.13 min (8 seconds), p50 0.08 — a pure file-list comparison with no
    # network beyond checkout. 10 = the short-job floor, and still fails an hour and a
    # half sooner than doing nothing. See core-ci.yml's header for the policy.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Guard ESP-IDF LIBTRACER_SRCS against core/src drift
        run: python3 tools/check_esp_srcs.py

  build:
    needs: srcs-drift
    runs-on: ubuntu-24.04
    # Measured worst leg 6.07 min (esp32c6, p50 5.83); the other three targets 3.5-3.7.
    # 20 = ~3.3x. The espressif/idf image pull is inside the measured job time.
    timeout-minutes: 20
    # Pinned ESP-IDF v6.0 release (GCC 15 RISC-V toolchain — C++23: std::expected,
    # std::span; matches the origin firmware's IDF v6.0-dev toolchain). Bumped from v5.3/GCC13.
    container: espressif/idf:release-v6.0
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6, esp32c3, esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4

      - name: Build inprocess_mirror (P0 in-process component) for ${{ matrix.target }}
        shell: bash
        working-directory: integrations/esp-idf/examples/inprocess_mirror
        # The container ships the IDF tools; source the export script, then build.
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      # #781: pin_bench is RFC-0022 §6's MCU-half apparatus. Nothing built it, so it
      # rotted against the very API change it measures — `settings_t`, deleted by
      # §3.B, six PRs before anyone noticed. One target is enough: this is a
      # COMPILE gate on an example that uses the store path, not a second portability
      # check. Ablate it by reverting app_main.cpp to a deleted API — the step reds.
      - name: Build pin_bench (RFC-0022 §6 MCU apparatus) for ${{ matrix.target }}
        if: matrix.target == 'esp32c6'
        shell: bash
        working-directory: integrations/esp-idf/examples/pin_bench
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Show build artifacts
        if: always()
        shell: bash
        working-directory: integrations/esp-idf/examples/inprocess_mirror
        run: |
          ls -la build/*.bin build/*.elf 2>/dev/null || true

  # Full-node gate (#183): build the full_node example — the FULL component
  # (net plane: fwd_router / transport_vertex / udp / tcp / transport_can + the
  # TWAI can_link_t + the IDF-NATIVE WS links, which since #947 are the chip
  # WebSocket plane) — for every target `idf_component.yml` claims (#1159). A clean `idf.py build` proves the
  # whole net plane compiles and links against lwIP BSD sockets, esp_http_server
  # and esp_driver_twai; the runtime proof is the linux-
  # target run below (full-node-host), and bus-/radio-level validation is the
  # on-silicon checklist on #183.
  full-node:
    needs: srcs-drift
    runs-on: ubuntu-24.04
    container: espressif/idf:release-v6.0
    # Measured 3.90-4.15 min across the four targets. 20 = ~4.8x, kept equal to `build`
    # so the container-image pull is covered by one reviewable number.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [esp32c6, esp32c3, esp32, esp32s3]
    steps:
      - uses: actions/checkout@v4

      - name: Build full_node (full-node component) for ${{ matrix.target }}
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      # WS-plane gate (#947 ruling): ESP-IDF WebSocket must never use POSIX sockets.
      # Asserts the linked chip ELF carries ZERO transport_ws_server /
      # transport_ws_client symbols (nm), that their TUs were not compiled, and that
      # the IDF-native links that replace them (httpd_ws_link_t / esp_ws_client_link_t)
      # ARE built — so an over-trim that sheds WebSocket entirely cannot pass as a fix.
      # A build alone proves nothing here: the portable pair COMPILES fine against
      # lwIP, which is exactly how it shipped into images, and --gc-sections cannot
      # drop it while the built-in catalog registers its factory (the measured
      # before-figure on this very example was 46 linked symbols).
      - name: Assert the WS plane is IDF-native only (no POSIX transport_ws)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "${GITHUB_WORKSPACE}/tools/check_esp_ws_plane.py" --build-dir build

      # The v0.15.0 boot regression, gated at the object level (#1532). An ownership
      # stamp taken with std::this_thread::get_id() lowers to pthread_self(), which
      # ESP-IDF ASSERTS out of for any task it did not register — the IDF main task
      # running app_main included — and under the default SILENT assert level that is
      # a bare reset loop. A successful build proves nothing: the call links fine for
      # every target and only fails on silicon, from an unregistered task. So this
      # reads the objects. Measured as a real differential on this very example: before
      # the fix transport_vertex.cpp.obj and self_heal_link.cpp.obj both list
      # `U pthread_self`; after it, neither does and both list
      # `U xTaskGetCurrentTaskHandle`.
      - name: Assert no ownership stamp calls pthread_self (#1532)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          . "${IDF_PATH}/export.sh"
          python3 "${GITHUB_WORKSPACE}/tools/check_esp_thread_id.py" --build-dir build

      # Footprint report (docs/reference/00-overview.md §"build-size profiles";
      # numbers described by integrations/esp-idf/README.md §Memory budget).
      # Prints the per-component breakdown to the log, publishes a markdown
      # table to the step summary and uploads a JSON artifact. It reports the
      # libtracer component's flash / static-RAM contribution; it sets no
      # ceiling on either (see the footprint contract at the top of this file).
      - name: Report footprint (idf.py size / size-components)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          ls -la build/*.bin build/*.elf
          . "${IDF_PATH}/export.sh"
          idf.py size
          idf.py size-components

      - name: Extract footprint JSON (esp-idf-size)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          . "${IDF_PATH}/export.sh"
          MAP=$(find build -maxdepth 1 -name '*.map' | head -n1)
          # esp-idf-size NG (>= 2.0, IDF v6.0) speaks json2; older images speak
          # the legacy json — try NG first, fall back.
          python -m esp_idf_size --format json2 --archives "$MAP" > size_components.json ||
            python -m esp_idf_size --format json --archives "$MAP" > size_components.json
          python -m esp_idf_size --format json2 "$MAP" > size_summary.json ||
            python -m esp_idf_size --format json "$MAP" > size_summary.json

      - name: Footprint report (step summary + component-size table)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          python3 "${GITHUB_WORKSPACE}/tools/esp_size_gate.py" \
            --components-json size_components.json \
            --summary-json size_summary.json \
            --target "${{ matrix.target }}" \
            --out-json "footprint-${{ matrix.target }}.json"

      - name: Upload footprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: footprint-${{ matrix.target }}
          path: integrations/esp-idf/examples/full_node/footprint-${{ matrix.target }}.json

  # Transport-trim gate (#393): prove the per-transport Kconfig knobs actually shed
  # translation units and still link on-target. Builds full_node for esp32c6 with TCP +
  # WS trimmed off (the self-proof only creates a `kind=udp` connection, so UDP + CAN
  # stay on) — exercising the CMake-generated register_builtin_transports dispatcher
  # (udp-only) and dropping transport_tcp + its factory glue and the IDF-native WS links
  # from libtracer.a. A clean build proves a role-composed node links with a partial
  # transport set; the object-file assertions prove the trim REALLY happened (a broken
  # gate would still build — just fatter — so build-success alone is not proof).
  #
  # NB what the WS half asserts, post-#947: on a chip target the portable transport_ws
  # TUs are NEVER compiled, so asserting their absence here would be vacuous — it would
  # pass with the knob broken. The chip WS TUs are httpd_ws_link / esp_ws_client_link,
  # so those are what LIBTRACER_TRANSPORT_WS=n has to shed, and those are what is checked.
  full-node-trimmed:
    needs: srcs-drift
    runs-on: ubuntu-24.04
    container: espressif/idf:release-v6.0
    # Measured max 3.92 min. 20 = ~5x, same group and same image pull as `full-node`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build full_node (TCP+WS trimmed; UDP+CAN on) for esp32c6
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        env:
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.ci_trim"
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py set-target esp32c6
          idf.py build

      - name: Assert the trimmed transport TUs were shed (and UDP kept)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          fail=0
          # transport_tcp + glue is the TCP half; httpd_ws_link / esp_ws_client_link are
          # the chip WS plane (#947) — the portable transport_ws TUs are absent on a chip
          # target regardless of this knob, so naming them here would prove nothing.
          for dropped in transport_tcp builtin_transport_tcp httpd_ws_link esp_ws_client_link; do
            if find build -name "${dropped}.cpp.obj" | grep -q .; then
              echo "ERROR: ${dropped}.cpp.obj was compiled — the transport trim did not shed it"
              fail=1
            fi
          done
          # Sanity: the transports we kept ON must still be present (guard against over-trim).
          for kept in transport_udp builtin_transport_udp transport_can; do
            if ! find build -name "${kept}.cpp.obj" | grep -q .; then
              echo "ERROR: ${kept}.cpp.obj missing — over-trimmed a kept transport"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: TCP + WS transport TUs shed; UDP + CAN retained in the trimmed archive"

  # Full-node HOST run (#183): the same full_node example on the ESP-IDF
  # `linux` target, executed — the device node and an in-process host peer talk
  # over REAL loopback datagrams (config-created udp connections via
  # :children[] SPECs), driving read / subscribe / latch / fan-out / await end
  # to end. This is the runtime proof CI can give without silicon. Same v5.5 +
  # g++-12 arrangement as host-build (see the NOTE there re v6.0 linux target).
  full-node-host:
    runs-on: ubuntu-24.04
    container: espressif/idf:release-v5.5
    # Measured max 2.83 min, p50 2.50. 15 = ~5.3x — extra headroom over 3x because this
    # job apt-installs g++-12 inside the IDF container, i.e. the demonstrated wedge point.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-12 (C++23 <expected> for the host/linux toolchain)
        shell: bash
        # Measured p50 0.15 min, max 0.20. 8 = the install-step floor (~40x), so a wedged
        # apt inside the IDF container reds as itself. Runs as root — no sudo here.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++-12 gcc-12

      - name: Build full_node for the linux target
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py -D CMAKE_C_COMPILER=gcc-12 -D CMAKE_CXX_COMPILER=g++-12 \
            --preview set-target linux build

      - name: Run full_node (device node + host peer over real datagrams)
        shell: bash
        working-directory: integrations/esp-idf/examples/full_node
        run: |
          ls -la build/full_node.elf
          ./build/full_node.elf

  # Host-target gate: build the host_smoke example for the ESP-IDF `linux`
  # (POSIX host) target — proves the ESP-IDF *component* packages the core for a
  # host consumer (manifest target `linux`), distinct from core-ci.yml's plain
  # host build of the core. The host/linux target uses the container's native g++;
  # we pin g++-12 (C++23 <expected>) so the build is independent of the image's
  # default. A produced ELF that runs register/write/read IS the gate.
  #
  # NOTE: on release-v5.5, not v6.0. The v6.0 `linux` target fails component
  # resolution (esp_driver_ana_cmpr → esp_hal_ana_cmpr, a chip-specific HAL not
  # registered for linux) — an IDF v6.0 linux-target issue, not libtracer. The
  # GCC-15 host gate now lives in core-ci.yml (build-test-gcc15), where a plain
  # host build of the core belongs; migrate this IDF-component example to v6.0
  # once an IDF patch fixes the linux component graph.
  #
  # It was release-v5.3 until #949 raised the component's floor to idf >=5.5.5
  # (a TX-path correctness floor — see idf_component.yml). The component manager
  # enforces that constraint on a local component too, so a v5.3 image can no
  # longer resolve this example at all; the two `linux`-target jobs move to the
  # oldest release branch that satisfies the floor.
  host-build:
    runs-on: ubuntu-24.04
    container: espressif/idf:release-v5.5
    # Measured max 2.83 min, p50 2.37. 15 = ~5.3x, same reasoning as full-node-host: it
    # carries the same g++-12 apt step inside the container.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-12 (C++23 <expected> for the host/linux toolchain)
        shell: bash
        # Measured p50 0.15 min, max 0.20. 8 = the install-step floor (~40x), so a wedged
        # apt inside the IDF container reds as itself. Runs as root — no sudo here.
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends g++-12 gcc-12

      - name: Build host_smoke (P0 in-process component) for the linux target
        shell: bash
        working-directory: integrations/esp-idf/examples/host_smoke
        env:
          CC: gcc-12
          CXX: g++-12
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py -D CMAKE_C_COMPILER=gcc-12 -D CMAKE_CXX_COMPILER=g++-12 \
            --preview set-target linux build

      - name: Run host_smoke (register / write / read)
        shell: bash
        working-directory: integrations/esp-idf/examples/host_smoke
        run: |
          ls -la build/host_smoke.elf
          ./build/host_smoke.elf

      - name: Show build artifacts
        if: always()
        shell: bash
        working-directory: integrations/esp-idf/examples/host_smoke
        run: |
          ls -la build/*.elf 2>/dev/null || true

