#
# The Cortex-M0 required-modules footprint sentinel (ADR-0047 §5). Cross-compiles
# the minimum-feature (P0) libtracer node — the substrate + wire codec + path
# modules a bare-metal MCU links, exercised by core/tests/footprint/sentinel_node.cpp
# — for arm-none-eabi Cortex-M0 with the MCU profile, and gates the flash
# footprint at 16 KiB. This is the standing referee for the compile-time /
# template doctrine: templating techniques are admissible exactly as far as this
# gate stays green (it catches vtable/erasure bloat AND template-instantiation
# bloat). Complements the ESP-IDF whole-image sentinel in esp-idf.yml.
#
# `--mode fail` governs the BUDGET VERDICT only: a node over 16 KiB reds this job
# (#2116). It ran in warn mode while the node was over the bound; #2116 attributed the
# overage per translation unit (the slice-by-8 CRC-32C tables) and cut it, so the
# ceiling is a hard gate now.
#
# The RECORD of what the node measures is the `footprint-cortexm0` artifact
# series each run uploads (toolchain-labeled JSON) — NOT this comment. Numbers
# hand-maintained here went stale and mixed local with CI toolchains, which
# manufactured a phantom +1 KiB regression once (#1138). Drift IS gated now:
# each run fetches the previous successful main measurement and compares flash
# on matched toolchains; growth warns (`--drift-mode warn`) while the
# run-over-run noise band is measured, and the ruling is to flip
# `--drift-mode fail` at ~2x observed noise once a release's worth of labeled
# points exists.
#
# A failure to MEASURE is not a budget verdict and warn mode no longer answers
# for it (#982): a missing toolchain, compile error, link error, or unparsable
# `size` output reds this job in either mode. It had to, because the gate has
# reported success while measuring nothing twice — once when REQUIRED_MODULES
# omitted `mem_source` and the link failed with an undefined reference, and again
# for the seven days after #681 gave `path_key` an optional return the fixture
# never adapted to. Nothing else in the tree compiles that fixture, so this job
# is the only thing standing between an API change and a dead sentinel.
name: footprint-cortexm0

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tools/cortexm0_footprint.py"
      - "tools/check_no_heap.py"
      - "tools/no_heap_baseline.json"
      - ".github/workflows/footprint-cortexm0.yml"
  pull_request:
    paths:
      - "core/**"
      - "tools/cortexm0_footprint.py"
      - "tools/check_no_heap.py"
      - "tools/no_heap_baseline.json"
      - ".github/workflows/footprint-cortexm0.yml"
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: --memory 10g
    # This is the WORST measured wedge in the repo, and it went unreported because the
    # job eventually succeeded: on 2026-08-19 the install step below ran 36.4, 35.3,
    # 28.4, 28.1 and 23.9 minutes, and in the slowest run 36.38 of those 36.57 job
    # minutes were inside that single apt step. A 36-minute "success" is invisible in the
    # checks UI. Measured healthy (26 runs off the incident day): max 1.22 min, p50 0.70.
    # 20 is ~16x the healthy job time — absurdly generous on purpose, because the only
    # thing this ceiling has to catch is a multi-tens-of-minutes hang. See core-ci.yml's
    # header note for the tree-wide policy.
    timeout-minutes: 20
    # actions: read lets the drift baseline step download the previous main
    # run's artifact with the default token.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install arm-none-eabi toolchain
        # The step that wedged. Measured healthy p50 0.68 min, max 1.0 off the incident
        # day; 10 is ~15x that and would have caught all five multi-tens-of-minutes
        # hangs. Over 50 runs, 41 of these installs finished under two minutes and every
        # one of the six over five minutes is dated 2026-08-19.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # gcc-arm-none-eabi on 24.04 is 13.2 (has -std=c++23, <expected>,
          # <memory_resource>); it pulls in binutils (arm-none-eabi-size) and
          # newlib-nano (nano.specs / nosys.specs) as dependencies.
          #
          # NOT --no-install-recommends, unlike every other apt call hardened alongside
          # this one: `gcc-arm-none-eabi` carries `Recommends: libnewlib-arm-none-eabi`,
          # which is where nano.specs / nosys.specs come from. Dropping recommends here
          # would change WHICH packages are installed and break the link.
          apt-get install -y -qq gcc-arm-none-eabi gh
          arm-none-eabi-g++ --version | head -1

      - name: Fetch the previous main measurement (drift baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The baseline is the footprint-cortexm0 artifact of the most recent
          # successful main run (on a main push that is the previous commit's
          # run — this run is still in_progress and never matches). Absence —
          # first run, expired retention — is not an instrument failure: the
          # gate step skips the drift comparison with a ::notice::.
          run_id=$(gh run list --workflow footprint-cortexm0.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId') || run_id=""
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name footprint-cortexm0 --dir baseline \
              || echo "baseline artifact missing/expired on run $run_id — drift gate will skip"
          else
            echo "no successful main run of this workflow yet — drift gate will skip"
          fi

      - name: Cortex-M0 required-modules footprint gate
        run: |
          python3 tools/cortexm0_footprint.py \
            --mode fail \
            --max-flash-bytes 16384 \
            --baseline-json baseline/footprint-cortexm0.json \
            --drift-mode warn \
            --max-growth-bytes 0 \
            --out-json footprint-cortexm0.json \
            --archive-out libtracer.a

      # The MCU no-heap link check (#1783, ADR-0083 Decision 1). The required modules, archived
      # without the fixture, must reference no heap entry point (malloc/free/calloc/realloc,
      # any operator new or delete), directly or through a function in the archive that does,
      # beyond the functions pinned in tools/no_heap_baseline.json, which only ever shrink. A
      # new such function, or an extra path in a pinned one, reds this job; a pin that is gone
      # does too, until `--repin` lowers it.
      # Unlike the budget above this is a hard gate from day one.
      - name: No-heap link check (libtracer.a references no heap)
        run: |
          python3 tools/check_no_heap.py --target cortex-m0 --archive libtracer.a \
            --objdump arm-none-eabi-objdump

      - name: Upload footprint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-cortexm0
          path: footprint-cortexm0.json
          if-no-files-found: ignore
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: footprint-cortexm0-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
