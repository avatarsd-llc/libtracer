#
# The Cortex-M0 required-modules footprint sentinel (ADR-0047 §5). Cross-compiles
# the minimum-feature (P0) libtracer node — the substrate + wire codec + path
# modules a bare-metal MCU links, exercised by core/tests/footprint/sentinel_node.cpp
# — for arm-none-eabi Cortex-M0 with the MCU profile, and gates the flash
# footprint at 16 KiB. This is the standing referee for the compile-time /
# template doctrine: templating techniques are admissible exactly as far as this
# gate stays green (it catches vtable/erasure bloat AND template-instantiation
# bloat). Complements the ESP-IDF whole-image sentinel in esp-idf.yml.
#
# `--mode warn` governs the BUDGET VERDICT only. Today the measured node is
# 20,977 B — 4.49 KiB over the 16 KiB bound (re-measured 2026-08-07 at 3935d4e;
# 20,937 B on 2026-07-27 and 21,025 B at v0.8.0, so +40 B over the blind window).
# The old note blamed std::pmr soft-float reaching the image via the arena
# decoder's `memory_resource&` seam; #588 removed that seam, so that attribution
# no longer holds and the remaining overage has not been re-attributed. Flip
# `--mode fail` only after the overage is understood.
#
# A failure to MEASURE is not a budget verdict and warn mode no longer answers
# for it (#982): a missing toolchain, compile error, link error, or unparsable
# `size` output reds this job in either mode. It had to, because the gate has
# reported success while measuring nothing twice — once when REQUIRED_MODULES
# omitted `mem_source` and the link failed with an undefined reference, and again
# for the seven days after #681 gave `path_key` an optional return the fixture
# never adapted to. Nothing else in the tree compiles that fixture, so this job
# is the only thing standing between an API change and a dead sentinel.
name: footprint-cortexm0

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "tools/cortexm0_footprint.py"
      - ".github/workflows/footprint-cortexm0.yml"
  pull_request:
    paths:
      - "core/**"
      - "tools/cortexm0_footprint.py"
      - ".github/workflows/footprint-cortexm0.yml"
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update
          # gcc-arm-none-eabi on 24.04 is 13.2 (has -std=c++23, <expected>,
          # <memory_resource>); it pulls in binutils (arm-none-eabi-size) and
          # newlib-nano (nano.specs / nosys.specs) as dependencies.
          sudo apt-get install -y -qq gcc-arm-none-eabi
          arm-none-eabi-g++ --version | head -1

      - name: Cortex-M0 required-modules footprint gate
        run: |
          python3 tools/cortexm0_footprint.py \
            --mode warn \
            --max-flash-bytes 16384 \
            --out-json footprint-cortexm0.json

      - name: Upload footprint artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: footprint-cortexm0
          path: footprint-cortexm0.json
          if-no-files-found: ignore
