#
# Model-checks the shipped QSBR header with GenMC (#2120): tools/genmc_qsbr.sh runs
# core/tests/genmc/qsbr_mc.cpp, which drives qsbr.hpp's own code (not a transcription) in a
# domain it owns, under every execution RC11 and IMM allow for the FENCED flavour and every
# SC interleaving for the COMPILER flavour. It catches what TSan cannot (GCC TSan ignores
# fences) and x86 cannot show (TSO): a relaxed announce is a use-after-free on a weak
# machine, and this job fails on it (ADR-0080 §3).
#
# Its own workflow, not a core-ci job, and NOT a required check. core-ci's trigger is derived
# from what core-ci compiles (tools/gen_ci_paths.py), and its aggregator is required, so a
# path-filtered job inside it would leave the required check unreported on most PRs (#1614).
# This filter is exactly the checker's inputs: the reclaim headers and the config they read.
#
# GenMC is built from a pinned tag against the distribution's LLVM 19, with one fix to how it
# names a location in a trace (core/tests/genmc/genmc-nameinfo.patch), and cached by tag, LLVM
# major and patch, so a warm run is the apt install plus the checks. The checker shells out to
# clang-19 at run time, which is why the apt step runs on a cache hit too.
#
# RUNNER: hosted `ubuntu-24.04` on every route. It builds nothing of libtracer's, so there is
# nothing to gain from the ci-local pool, and no fork guard or workspace-ownership step.
name: genmc

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    # Duplicated rather than a YAML anchor: GitHub Actions does not expand aliases.
    paths:
      - "core/include/libtracer/qsbr.hpp"
      - "core/include/libtracer/edge_pin.hpp"
      - "core/include/libtracer/reclaim.hpp"
      - "core/include/libtracer/config.hpp"
      - "core/tests/genmc/**"
      - "tools/genmc_qsbr.sh"
      - ".github/workflows/genmc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genmc-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GENMC_TAG: v0.19.0
  LLVM_MAJOR: "19"

jobs:
  qsbr:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # Warm: ~1 min of apt, ~1 min of checks. Cold: plus the GenMC build (~10 min on 4 vCPUs).
    timeout-minutes: 30
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install LLVM ${{ env.LLVM_MAJOR }} and GenMC's build dependencies
        timeout-minutes: 10
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            "llvm-${LLVM_MAJOR}-dev" "clang-${LLVM_MAJOR}" "libclang-${LLVM_MAJOR}-dev" \
            "libclang-cpp${LLVM_MAJOR}-dev" libffi-dev zlib1g-dev libzstd-dev libedit-dev \
            g++-14 cmake ninja-build
      - name: Restore GenMC
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/genmc
          key: genmc-${{ env.GENMC_TAG }}-llvm${{ env.LLVM_MAJOR }}-ubuntu-24.04-${{ hashFiles('core/tests/genmc/genmc-nameinfo.patch') }}
      # Built in place and run from the build tree: the binary records its runtime-include
      # directory as an absolute path, and the cache restores it at the same one.
      - name: Build GenMC ${{ env.GENMC_TAG }}
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 25
        run: |
          git clone --quiet --depth 1 --branch "$GENMC_TAG" \
            https://github.com/MPI-SWS/genmc.git ~/genmc
          git -C ~/genmc apply "$GITHUB_WORKSPACE/core/tests/genmc/genmc-nameinfo.patch"
          cmake -S ~/genmc -B ~/genmc/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_MAJOR}/lib/cmake"
          cmake --build ~/genmc/build --target genmc
      - name: Model-check qsbr.hpp
        run: GENMC="$HOME/genmc/build/bin/genmc" tools/genmc_qsbr.sh
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
