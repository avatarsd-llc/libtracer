#
# Render the Tracer Internet-Draft and check it (#1964).
#
# docs/ietf/build.sh turns the kramdown-rfc source into RFCXML v3, renders text
# and HTML with xml2rfc, and runs idnits on the text. It fails on any kramdown-rfc or
# xml2rfc warning or error and on any idnits error, flaw or warning. The one exception
# is the idnits "first submitted" warning, which a never-posted draft cannot avoid (see
# the script). CI and a local run use the same script.
#
# RUNNER ROUTING (#2348): the trusted-run guard core-ci.yml documents under RUNNER ROUTING
# sends this repository's own runs to the self-hosted `ci-local` runners and a fork PR to
# `ubuntu-24.04`. The job runs in the CI base image on both routes and installs what the
# hosted image used to carry (gawk, ruby for kramdown-rfc, curl for idnits); its toolchain
# and reference data still come from the network (RubyGems, PyPI, bib.ietf.org, the
# Datatracker for idnits).
#
# Toolchain pins: kramdown-rfc and xml2rfc by version. idnits v2 is a single script
# with no release artifact, so it is fetched from a pinned commit of
# ietf-tools/idnits and checked against its sha256. idnits v2 needs gawk.
name: internet-draft

on:
  push:
    branches: [main]
    paths:
      - "docs/ietf/**"
      - ".github/workflows/internet-draft.yml"
  pull_request:
    # Duplicated rather than a YAML anchor: GitHub Actions does not expand aliases.
    paths:
      - "docs/ietf/**"
      - ".github/workflows/internet-draft.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internet-draft-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KRAMDOWN_RFC_VERSION: "1.7.43"
  XML2RFC_VERSION: "3.34.1"
  IDNITS_COMMIT: "dfbd43e9c1f9f7224a96e25ec8be085d8de850e9" # v2 branch, idnits 2.17.1
  IDNITS_SHA256: "e070604fc65ca732e2cb3d1543c99ce7dde579c0d291fb21d85585b0337fece9"

jobs:
  render:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    timeout-minutes: 15
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the toolchain (kramdown-rfc, xml2rfc, idnits)
        run: |
          apt-get update -q
          apt-get install -y -q gawk ruby curl
          gem install --user-install --no-document kramdown-rfc -v "$KRAMDOWN_RFC_VERSION"
          echo "$(ruby -e 'print Gem.user_dir')/bin" >> "$GITHUB_PATH"
          python -m pip install --quiet "xml2rfc==$XML2RFC_VERSION"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/idnits" \
            "https://raw.githubusercontent.com/ietf-tools/idnits/$IDNITS_COMMIT/idnits"
          echo "$IDNITS_SHA256  $HOME/.local/bin/idnits" | sha256sum -c -
          chmod +x "$HOME/.local/bin/idnits"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Render and check the draft
        run: docs/ietf/build.sh "$RUNNER_TEMP/draft"
      - name: Upload the rendered draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-avatarsd-tracer
          path: |
            ${{ runner.temp }}/draft/*.xml
            ${{ runner.temp }}/draft/*.txt
            ${{ runner.temp }}/draft/*.html
            ${{ runner.temp }}/draft/*.log
          if-no-files-found: error
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
