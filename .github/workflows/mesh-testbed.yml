#
# Decentralized multi-node MESH testbed (#408). Brings up FOUR real libtracer host
# nodes in docker-compose — each its own container, network namespace and IP — forms
# every inter-node link the real way (an in-band `write /net:children[] += SPEC{…}`
# issued REMOTELY by the TypeScript client SDK, no provide_link seam anywhere), and
# then routes across the mesh it just made: remote read/write/subscribe through TWO
# forwarding hops, ADR-0044 `:children[]` peer enumeration on a peer_named listener,
# and per-op loop safety over a deliberate physical cycle (a->b->c->a).
#
# WHY IT EARNS ITS KEEP: every existing FWD test has exactly ONE forwarder
# (fwd_multihop_test, fwd_compact_test, fwd_rope_forward_test), and the conformance
# vectors are static fixtures nothing routes. This is the repo's first two-forwarder
# coverage — which is precisely how it caught the /net routing-prefix divergence
# between the impl, reference/03+/07 and the vectors (#419).
#
# SEPARATE from core-ci on purpose (mirroring can-vcan-e2e.yml / ws-interop.yml): the
# required core gates (build-test / sanitizers / tsan / format / doxygen) must never
# depend on Docker or a Node toolchain, and a mesh failure must read distinctly from a
# core failure.
#
# ADVISORY BY DESIGN — do NOT add this to the required-checks ruleset. It is
# path-filtered, so a PR that touches neither core/ nor the TS workspace would never
# report it, and a required-but-never-reported context blocks a merge forever.
#
# RUNNER (#2348): a HOST job on the ci-local runners, behind core-ci's trust guard (a
# fork PR skips it). It needs a Docker daemon, which a job container does not have, and
# the host's runner user can reach the host daemon without sudo. The mesh nodes join
# runners-ci.slice through a generated compose override (`cgroup_parent`), so the slice's
# limits bound them like any CI container. On the host the mesh subnet moves to
# 10.228.47.0/24 (LIBTRACER_MESH_NET), outside Docker's shared default pools, and its
# ctrl ports are free loopback ports Docker picks. The compose project name and the
# subnet are still host-wide, so the job also
# holds one host-wide lock (`mesh-testbed-host`): two PRs' meshes never run at once. A
# newer queued run replaces an older queued one in that lock, which GitHub reports as
# cancelled; the newer run tests the newer head. The hosted fallback (CI_SELF_HOSTED=false)
# runs the same steps on the image's preinstalled Docker Engine and compose v2.
name: mesh-testbed

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "core/**"
      - "bindings/typescript/**"
      - "tests/testbed/**"
      - ".github/workflows/mesh-testbed.yml"
      - "!**/*.md" # Markdown is never an input here (core-ci.yml, DOCS-ONLY PULL REQUESTS)
  workflow_dispatch:

jobs:
  mesh-testbed:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    # Host job, not a container (header, RUNNER).
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    concurrency:
      group: mesh-testbed-host
      cancel-in-progress: false
    # Measured max 1.65 min, p50 1.47, min 1.27. 15 = the short-job floor (~9x observed);
    # it exists for the `npm ci` below. See core-ci.yml's header for the policy.
    timeout-minutes: 15
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # On the host the nodes join runners-ci.slice, as every CI container does (#2348).
      # COMPOSE_FILE carries the override into every compose call below, the teardown
      # and the log dump included.
      - name: Place the mesh nodes in runners-ci.slice and a free subnet (host route)
        run: |
          files=tests/testbed/compose.yml
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            o="$RUNNER_TEMP/compose.ci-slice.yml"
            printf 'services:\n' > "$o"
            # Host ports: the fixed 47301-47304 sit inside Linux's ephemeral range
            # (32768-60999), so on a busy shared host any outgoing connection can hold
            # one ("address already in use"). Docker picks a free loopback port instead;
            # the step after `up` reads the choice back.
            for svc in a b c bus; do printf '  %s:\n    cgroup_parent: runners-ci.slice\n    ports: !override ["127.0.0.1::47300"]\n' "$svc" >> "$o"; done
            files="$files:$o"
            # The host's 172.16.0.0/12 and 192.168.0.0/16 are Docker's default address
            # pools, shared with every other project and job network on the machine, and
            # one already held 172.28.0.0/16 ("Pool overlaps"). 10.228.47.0/24 is outside
            # those pools and outside the host's LAN.
            echo "LIBTRACER_MESH_NET=10.228.47" >> "$GITHUB_ENV"
          fi
          echo "COMPOSE_FILE=$files" >> "$GITHUB_ENV"
          echo "COMPOSE_FILE=$files"

      # `--wait` here only waits for the containers to be RUNNING (the services declare
      # no healthcheck, deliberately — see compose.yml). The real readiness gate is the
      # driver's ctrl-connect retry loop: a node binds its link listeners BEFORE its
      # ctrl listener, so ctrl-reachable implies every listener is bound.
      # The host is shared and the subnet fixed: a network or container a cancelled run
      # left behind would make this run's `up` fail on it, so clear it first.
      - name: Remove a previous run's mesh leftovers (host route)
        if: runner.environment == 'self-hosted'
        run: docker compose down -v --remove-orphans

      - name: Build the node image and bring the four-node mesh up
        run: docker compose up -d --build --wait

      - name: Read back each node's published ctrl port
        run: |
          set -o pipefail
          ctrl=""
          for svc in a b c bus; do
            p=$(docker compose port "$svc" 47300 | sed -e 's/^0\.0\.0\.0:/127.0.0.1:/' -e 's/^\[::\]:/127.0.0.1:/')
            [[ "$p" =~ ^127\.0\.0\.1:[1-9][0-9]*$ ]] || { echo "::error::mesh node $svc has no usable published ctrl port (got '$p')"; exit 1; }
            ctrl="${ctrl:+$ctrl,}$svc=$p"
          done
          echo "LIBTRACER_MESH_CTRL=$ctrl" >> "$GITHUB_ENV"
          echo "LIBTRACER_MESH_CTRL=$ctrl"

      # setup-node's npm cache fails ("Some specified paths were not resolved") when the
      # cache directory does not exist yet, which on the host route it does not (#2348).
      - name: Create the npm cache directory
        run: mkdir -p "$HOME/.npm"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install + build the TypeScript workspace
        working-directory: bindings/typescript
        # `npm ci` is a registry round-trip; measured 0.02-0.13 min. 8 = install floor.
        timeout-minutes: 8
        run: |
          npm ci
          npm run build

      # CTRL = each node's published ctrl port, reached from the runner host.
      # PEERS = each node's link listener, reached from INSIDE the mesh — static IPs,
      # because the built-in factories are inet_pton-only (no DNS).
      - name: Drive the mesh from the TS client SDK and assert multi-hop routing
        working-directory: bindings/typescript/packages/client
        run: |
          m="${LIBTRACER_MESH_NET:-172.28.0}"
          export LIBTRACER_MESH_PEERS="a=$m.11:47311,b=$m.12:47311,c=$m.13:47311,bus=$m.14:47320"
          node --test test/mesh-testbed.test.mjs

      # Runs SECOND, and only against a mesh the step above already formed: the walk is
      # a read-only projection of whatever links exist. It is the executable argument
      # for #406 — the same ring yields ~170 nodes for 4 devices without an identity,
      # and exactly 4 with one.
      - name: Project the formed mesh with the topology walk (#409)
        working-directory: bindings/typescript/packages/client
        run: node --test test/topology.test.mjs

      - name: Dump every node's log on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the testbed down
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job; a host job first takes root-owned leftovers back through a throwaway
        # container (no sudo), so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; if [ "$(id -u)" != 0 ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then docker run --rm -v "$w/..:/w" -v "$t:/t" ghcr.io/avatarsd-llc/libtracer-ci:noble-d3cc1cb0835e chown -R "$(id -u):$(id -g)" /w /t || r=1; fi; find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: mesh-testbed-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
