#
# The committed-binary gate (#1359).
#
# PR #1356 added 34 compiled ELFs — a whole `bench/buildA/` tree, ~49 MB — and every CI
# job in the repo went green. A human caught it at the merge gate. The `.gitignore`
# widening that landed with it closes that one spelling; an ignore rule is a convenience
# that stops accidental staging, not a gate. This job is the gate: it fails a PR whose
# diff against the merge base adds binary content, so a build tree named something the
# ignore rules never anticipated (`out/`, `cmake-build-debug/`, `obj/`, a stray `a.out`)
# cannot reach `main` green. Merged history is permanent — the fix afterwards is a
# history rewrite of `main`, which is far worse than a red check on a PR.
#
# NO `paths:` FILTER, DELIBERATELY. Every other structural gate in this repo is filtered
# to the trees it watches; this one must not be. A path filter here would recreate exactly
# the hole being closed: a binary dropped in an unfiltered tree would skip the job, and a
# skipped required check reports as green. The whole point is that no diff escapes it.
# It is also why this is its own workflow rather than a job inside an existing one —
# `paths:` is a workflow-level property, and the only unfiltered PR workflow in the tree
# is `conformance.yml`, whose subject is protocol vectors, not repository hygiene. A red
# `conformance / no-binaries` would misdescribe the failure to whoever hits it.
#
# Cost: one checkout and ~0.3 s of python, no toolchain, no build.
name: no-binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-binaries-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # Measured p50 0.70 min, max 7.77 — of which 7.63 was inside actions/checkout@v4,
    # which fetches full history here to scan the diff. All 40 sampled runs fall on the
    # 2026-08-19 incident day (the workflow has only ~70 successful runs total), so
    # healthy and incident cannot be separated by date and the max is almost certainly
    # inflated. 20 = ~2.6x the worst observed. See core-ci.yml's header for the policy.
    timeout-minutes: 20
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      # Full history: the check diffs against the MERGE BASE, so both endpoints and
      # their common ancestor have to be present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # An unverified gate is how #1356 happened. The gate's own suite runs first, so a
      # classifier bug reports as a classifier bug rather than as a phantom clean diff —
      # it drives real throwaway repositories through both arms (red on a committed ELF,
      # green on a conformance vector).
      - name: Gate unit tests (red on an ELF, green on a conformance vector)
        run: python3 -m unittest discover -s tools/tests -p "test_check_no_binaries.py" -v
      - name: Resolve the diff endpoints
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              BASE='${{ github.event.pull_request.base.sha }}'
              HEAD='${{ github.event.pull_request.head.sha }}'
              ;;
            push)
              BASE='${{ github.event.before }}'
              HEAD='${{ github.sha }}'
              # A force-push or a branch creation leaves `before` unreachable (or all
              # zeros); the previous commit is the honest fallback.
              git cat-file -e "${BASE}^{commit}" 2>/dev/null || BASE="${HEAD}^"
              ;;
            *)
              BASE='origin/${{ github.event.repository.default_branch }}'
              HEAD='${{ github.sha }}'
              ;;
          esac
          echo "BASE=${BASE}" >> "$GITHUB_ENV"
          echo "HEAD=${HEAD}" >> "$GITHUB_ENV"
          echo "diffing ${BASE}...${HEAD}"
      - name: No committed binaries in this diff
        run: python3 tools/check_no_binaries.py --base "$BASE" --head "$HEAD"
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"
