# Fixed-host bench series (bench-local) — the absolute-trend instrument.
#
# perf.yml's history rides GitHub-hosted runners, which vary ~2x in absolute speed
# run to run (hardware lottery); its store answers portability, and only its
# SAME-RUNNER interleaved gates carry regression verdicts. What no hosted store can
# give is a readable absolute trend — a two-point read of it manufactures
# regressions that do not exist (it did, twice, on one day: byte-identical .text
# "regressed" 60%+ across docs-only merges).
#
# This workflow runs the SAME transcript set on ONE fixed self-hosted machine
# (runner label `bench-local`), pinned to one fixed logical CPU, and records to its
# own store on gh-pages (`dev/bench-local/` — never mixed into `dev/bench/`; mixing
# machines in one series is precisely the defect this exists to remove). The host's
# characteristics are stamped onto EVERY recorded point (`extra` field — visible in
# the chart tooltip) and captured in full next to the store (`host.txt`).
#
# SECURITY (public repo + self-hosted runner): fork code must never execute on the
# bench machine. Triggers are push-to-main ONLY — no pull_request — plus the
# repository guard on the job. Keep it that way.
#
# NOISE: the bench host also serves other repos' CI, so single points can catch a
# noisy neighbour. The series is read by medians over points, the alert threshold
# is a soft signal, and the hard verdicts stay with perf.yml's interleaved gates.
#
# RAM (#1228): this workflow also carries the two RAM-census instruments. Steady-state
# RAM is what decides whether a node fits the 16 KB target, and it was the only cost
# axis with neither a gate nor a recorded trend. Both censuses publish here (same
# store, same commit axis as the latency trend); the PER-CONNECTION figure additionally
# carries a WARN-FIRST drift ratchet against measured pins, while the WHOLE-NODE census
# is TREND-ONLY — do not read its published series as gated. The criterion for flipping
# the ratchet to `--mode fail` lives in bench/ram_census_pins.json, next to the pins it
# governs, rather than in this comment.
name: perf-local

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'bench/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/perf-local.yml'

# One measurement at a time; never cancel a measurement mid-run (a half-measured
# point is worse than a late one — the next push queues behind it).
concurrency:
  group: perf-local
  cancel-in-progress: false

jobs:
  bench-local:
    if: github.repository == 'avatarsd-llc/libtracer'
    runs-on: [self-hosted, bench-local]
    permissions:
      contents: write # benchmark-action pushes the history to the gh-pages branch
    env:
      BENCH_CPU: "2" # the one pinned logical CPU — every measured process runs here
    steps:
      - uses: actions/checkout@v4

      - name: Capture host characteristics (stamped onto every recorded point)
        id: host
        run: |
          model=$(grep -m1 "model name" /proc/cpuinfo | cut -d: -f2- | xargs)
          gov=$(cat /sys/devices/system/cpu/cpu${BENCH_CPU}/cpufreq/scaling_governor 2>/dev/null || echo "not-exposed")
          desc="$(hostname) · pinned cpu${BENCH_CPU} · ${model} · $(nproc) cpus · governor ${gov} · $(uname -r)"
          echo "desc=${desc}" >> "$GITHUB_OUTPUT"
          { echo "${desc}"; echo; lscpu; } > bench/host.txt
          { echo "### bench-local host"; echo '```'; echo "${desc}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the benchmark set (Release)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_libtracer bench_forward_heap \
            bench_forward_demux bench_compact_delivery \
            bench_conn_ram bench_ram_census_tcp -j "$(nproc)"

      # QUIESCENCE (#1236). The build above just ran `-j$(nproc)` and the 1-minute load
      # average is still carrying it, so this WAITS for the machine rather than checking
      # it — a bare check placed here would refuse every run. A host that never settles
      # skips its sample and leaves the job green: refusing to measure is a correct
      # outcome, and a red job trains the reader to ignore red.
      - name: Wait for the host to go quiet (skip the sample if it does not)
        id: guard
        run: python3 bench/host_guard.py wait --timeout 900

      # The A/A null pair, leg one. Same binary either side of the measured run, so the
      # text layout is held constant and the only thing left that can move the number is
      # the machine — which is what makes this a HOST instrument. `bench_forward_demux`
      # is the probe because its rows were measured layout-STABLE on this host (~0%
      # across placements of identical source, where fold-b4 swings ~15%), so movement
      # in it is unambiguous.
      - name: A/A null — before the measured run
        if: steps.guard.outputs.bank == 'true'
        env:
          LIBTRACER_BENCH_SECONDS: "1"
        run: taskset -c "$BENCH_CPU" ./bench/build/bench_forward_demux >bench/aa_pre.txt || true

      # Deterministic (allocation counts, not time) — a free consistency check per
      # point, and its transcript feeds the memory series (mirrors perf.yml).
      - name: Zero-heap forward gate (ADR-0038 §16KB-RAM)
        run: |
          set -o pipefail
          ZEROHEAP_MAX=0 taskset -c "$BENCH_CPU" ./bench/build/bench_forward_heap \
            | tee bench/bench_forward_heap_raw.txt

      - name: Run the bench transcripts, pinned
        env:
          LIBTRACER_BENCH_SECONDS: "1"
        run: |
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v taskset -c "$BENCH_CPU" ./bench/build/bench_libtracer \
              >bench/bench_libtracer_raw.txt 2>bench/bench_libtracer_time.txt
          else
            taskset -c "$BENCH_CPU" ./bench/build/bench_libtracer >bench/bench_libtracer_raw.txt
            : >bench/bench_libtracer_time.txt
          fi
          taskset -c "$BENCH_CPU" ./bench/build/bench_forward_demux >bench/bench_forward_demux_raw.txt || true
          taskset -c "$BENCH_CPU" ./bench/build/bench_compact_delivery >bench/bench_compact_delivery_raw.txt || true
          # An empty transcript is a silent non-recording — say so (mirrors perf.yml,
          # where `|| true` once swallowed a missing binary into a green job).
          for f in bench/bench_forward_demux_raw.txt bench/bench_compact_delivery_raw.txt; do
            [ -s "$f" ] || echo "::warning::$f is empty — its series will not be recorded"
          done

      # Zenoh control series, pinned to the same CPU: a pinned control that moves is
      # the HOST changing (thermal, neighbour), not the code — on a fixed machine the
      # control is what turns "the series moved" into a diagnosis. Optional: a failed
      # vendor fetch must never cost the commit its history point.
      - name: Run the Zenoh comparison bench (control series, optional)
        run: |
          if bash bench/fetch_zenoh.sh; then
            cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
            if cmake --build bench/build --target bench_zenoh -j "$(nproc)"; then
              taskset -c "$BENCH_CPU" ./bench/build/bench_zenoh >bench/bench_zenoh_raw.txt || true
            fi
          fi
          [ -s bench/bench_zenoh_raw.txt ] || \
            echo "::warning::no Zenoh transcript — the control series will not be recorded this commit"

      # The A/A null pair, leg two. Disagreement with leg one means the machine moved
      # under the measurement; the sample is still banked (a datum taken in known
      # conditions beats no datum) but carries the verdict into the store.
      - name: A/A null — after the measured run
        if: steps.guard.outputs.bank == 'true'
        env:
          LIBTRACER_BENCH_SECONDS: "1"
        run: taskset -c "$BENCH_CPU" ./bench/build/bench_forward_demux >bench/aa_post.txt || true

      - name: A/A bracket verdict
        id: bracket
        if: steps.guard.outputs.bank == 'true'
        run: python3 bench/host_guard.py bracket --pre bench/aa_pre.txt --post bench/aa_post.txt

      # --- RAM census (#1228) ----------------------------------------------------
      # Steady-state RAM decides whether a node fits the 16 KB target, and it was the
      # one cost axis with neither a gate nor a recorded trend: latency, allocations,
      # code size and flash all have one. Both censuses run HERE, after the A/A pair
      # closes, on purpose — they take ~90 s and are load-INSENSITIVE (allocator byte
      # counts, not time), so running them inside the bracket would widen the window
      # the A/A pair is supposed to bracket for nothing.
      #
      # They are also NOT conditioned on the quiescence guard's `bank`. That split is
      # deliberate: banking a *series* point on a busy host is what #1236 exists to
      # refuse, but the RAM figures do not move with load, so the GATE below still
      # gets to render a verdict on a commit whose timing sample was skipped.
      #
      # --no-can: the CAN arms need a privileged kernel `vcan0` this host does not
      # carry (can-vcan-e2e.yml owns that path). The pin file does not pin a CAN arm,
      # and if it ever did the gate would fail it as a dead pin rather than pass while
      # measuring less.
      - name: Per-connection RAM census (bench_conn_ram)
        run: |
          set -o pipefail
          taskset -c "$BENCH_CPU" ./bench/build/bench_conn_ram --no-can --reps=5 \
            | tee bench/bench_conn_ram_raw.txt
          [ -s bench/bench_conn_ram_raw.txt ] || \
            echo "::warning::no per-connection census transcript — its series will not be recorded"

      # The whole-node census forks its own remote peer PROCESS (before any graph,
      # socket or thread exists — forking a threaded process under a counting
      # allocator can deadlock in the child) and reaps it itself, so peer lifetime is
      # the binary's job, not a manual step. A peer that fails to come up makes the
      # binary exit non-zero: that costs this commit its census point with a notice,
      # never the pinned-host job. TREND-ONLY — no pins, no ratchet (see
      # bench/ram_census_pins.json `activation.whole_node_census`).
      - name: Whole-node RAM census (bench_ram_census_tcp, forks its own peer)
        run: |
          if taskset -c "$BENCH_CPU" ./bench/build/bench_ram_census_tcp --reps=6 \
               >bench/bench_ram_census_tcp_raw.txt 2>bench/bench_ram_census_tcp_err.txt; then
            cat bench/bench_ram_census_tcp_raw.txt
          else
            cat bench/bench_ram_census_tcp_err.txt || true
            : >bench/bench_ram_census_tcp_raw.txt
            echo "::notice::whole-node census skipped (peer process or an arm failed) — its series is not recorded this commit"
          fi

      # WARN-FIRST (#1228). The pins are MEASURED per-connection values, the band is 2x
      # the measured run-to-run spread, and the flip to `--mode fail` is a deliberate PR
      # edit governed by the activation criterion recorded in the pin file — never an
      # auto-ratchet. An instrument failure (no transcript, a drifting NULL arm, a pin
      # the run does not produce) reds this step in EITHER mode: a failure to measure is
      # not a budget verdict.
      - name: Per-connection RAM drift ratchet (warn-first)
        run: |
          python3 bench/ram_census.py gate \
            --conn-raw bench/bench_conn_ram_raw.txt \
            --pins bench/ram_census_pins.json \
            --mode warn

      # A live negative control on every run: the warn path is invisible by
      # construction (nothing turns red when it fires), so a doctored baseline proves
      # each run that the annotation still comes out. Without this the ratchet could
      # warn on nothing for its entire warn-first life and read exactly the same.
      - name: The ratchet must warn on an induced growth (dry run, doctored baseline)
        run: |
          python3 - <<'PY'
          import json, pathlib
          p = json.loads(pathlib.Path("bench/ram_census_pins.json").read_text())
          for pin in p["pins"]:
              pin["value"] = pin["value"] - 4096  # induce +4 KB of "growth"
          pathlib.Path("/tmp/doctored_pins.json").write_text(json.dumps(p))
          PY
          out=$(python3 bench/ram_census.py gate --conn-raw bench/bench_conn_ram_raw.txt \
                  --pins /tmp/doctored_pins.json --mode warn)
          echo "$out"
          case "$out" in
            *"::warning::per-connection RAM drift"*) echo "warn path is live" ;;
            *) echo "::error::the ratchet did not warn on a 4 KB induced growth — it is vacuous"
               exit 1 ;;
          esac

      - name: Emit history metrics + stamp the host onto every point
        if: steps.guard.outputs.bank == 'true'
        run: |
          args=""
          for f in bench/bench_libtracer_raw.txt bench/bench_forward_demux_raw.txt \
                   bench/bench_compact_delivery_raw.txt bench/bench_zenoh_raw.txt; do
            [ -s "$f" ] && args="$args --raw $f"
          done
          python3 bench/perf_emit_benchmark.py $args \
            --zeroheap-raw bench/bench_forward_heap_raw.txt \
            --time-v bench/bench_libtracer_time.txt \
            --out-smaller bench/benchmark_output.json \
            --out-bigger bench/benchmark_throughput.json
          # The RAM censuses MERGE into the smaller-is-better file the emitter just
          # wrote, rather than opening a second store: same commit axis as the latency
          # trend, same host/compiler stamp below, same publish step. Bytes are
          # smaller-is-better, so no second suite is needed. Rows whose median is 0 are
          # skipped — a ratio against zero is undefined and would render a flat line
          # that can never alert; the gate asserts those exactly instead.
          python3 bench/ram_census.py emit \
            --conn-raw bench/bench_conn_ram_raw.txt \
            --node-raw bench/bench_ram_census_tcp_raw.txt \
            --merge bench/benchmark_output.json
          # benchmark-action renders each point's `extra` in the chart tooltip — this
          # is where "which host produced this number" lives, per bench, per point.
          # It now also carries the COMPILER (a toolchain bump and a code change used
          # to move the trend identically, with nothing recorded to tell them apart)
          # and the A/A verdict, so a suspect point declares itself in the store.
          python3 bench/host_guard.py stamp \
            --json bench/benchmark_output.json \
            --json bench/benchmark_throughput.json \
            --desc "$HOST_DESC" --compiler --note "$AA_NOTE"
        env:
          HOST_DESC: ${{ steps.host.outputs.desc }}
          AA_NOTE: ${{ steps.bracket.outputs.note }}

      - name: Upload this point's transcripts + host capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-local-${{ github.sha }}
          path: |
            bench/host.txt
            bench/bench_libtracer_raw.txt
            bench/bench_libtracer_time.txt
            bench/bench_forward_heap_raw.txt
            bench/bench_forward_demux_raw.txt
            bench/bench_compact_delivery_raw.txt
            bench/bench_zenoh_raw.txt
            bench/bench_conn_ram_raw.txt
            bench/bench_ram_census_tcp_raw.txt
            bench/aa_pre.txt
            bench/aa_post.txt
          retention-days: 90

      # BANKING is conditional (#1236): a busy host contributes no point at all. The
      # transcripts above are uploaded either way, so a skipped sample is still
      # evidence — it is only the persisted series that stays clean.
      - name: Track latency + memory history (fixed host)
        if: steps.guard.outputs.bank == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: libtracer bench-local latency (ns, smaller is better, fixed pinned host)
          tool: customSmallerIsBetter
          output-file-path: bench/benchmark_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-local
          # Tighter than the hosted store's 125%: the machine is fixed, so creep at
          # 115% is signal, not lottery. Still a soft alert — the hard verdicts stay
          # with perf.yml's same-runner interleaved gates.
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@avatarsd'

      - name: Track throughput history (fixed host)
        if: steps.guard.outputs.bank == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: libtracer bench-local throughput (deliveries/s, bigger is better, fixed pinned host)
          tool: customBiggerIsBetter
          output-file-path: bench/benchmark_throughput.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench-local
          alert-threshold: '115%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@avatarsd'

      - name: Publish host.txt next to the store
        run: |
          git fetch --no-tags --depth=1 origin gh-pages
          git worktree add ../ghp FETCH_HEAD
          mkdir -p ../ghp/dev/bench-local
          cp bench/host.txt ../ghp/dev/bench-local/host.txt
          cd ../ghp
          if ! git diff --quiet -- dev/bench-local/host.txt 2>/dev/null || [ -n "$(git status --porcelain dev/bench-local/host.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add dev/bench-local/host.txt
            git commit -m "bench-local: refresh host.txt"
            # Best-effort: the histories above are already recorded; a race with a
            # concurrent gh-pages push must not turn this point's job red.
            git push origin HEAD:gh-pages || echo "::warning::host.txt push raced a concurrent gh-pages write"
          fi
          cd - && git worktree remove ../ghp
