# In-process latency/throughput gate (bench/perf_gate.py) — split out of conformance.yml.
#
# Design (all comparisons are SAME-RUNNER, because GitHub-hosted runners vary ~2x in
# absolute speed — cross-runner nanoseconds cannot gate):
#
#  1. Path filter — perf only runs when performance can actually change: C++ core, the
#     bench harness, CMake, or this workflow. A PR touching only bindings/typescript/**,
#     docs/**, packaging, etc. does NOT run perf.
#  2. PR gate (`gate-pr`) — main's bench_libtracer and the PR's bench_libtracer are BOTH
#     built on the SAME runner and then timed INTERLEAVED (A B / B A / …, 4 pairs) in one
#     job, so a drift window in the machine is shared by the two arms instead of landing
#     on whichever one happened to be running. A fail needs the regression to be large
#     (median past p50 +15% / mean +12% / throughput -12%), separated (the arms' ranges do
#     not overlap) AND reproduced across a majority of the pairs — #763. No Actions cache
#     feeds the gate.
#  3. Push ratchet (`ratchet`) — every main push re-runs the same gate on THREE
#     independently-drawn runners (redundant testing): each replica builds HEAD and its
#     PARENT commit and gates HEAD against the parent on its own hardware. A pullback
#     that lands anyway turns main red — and a single slow/noisy runner cannot
#     manufacture a false verdict, because the other two replicas measured the same
#     pair of commits on different machines.
#  4. History (`history`) — aggregates the three replicas' transcripts and records the
#     BEST across runners per metric (min latency / max throughput), so the recorded
#     trend approximates the code's capability, not the machine lottery.
name: perf

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'bench/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/perf.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'bench/**'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '.github/workflows/perf.yml'

jobs:
  # --- PR gate: same-runner baseline against main --------------------------------
  gate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need origin/main history to build the same-runner baseline
      - name: Build the PR (candidate) benchmark (Release)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_libtracer bench_forward_heap \
            bench_compact_delivery bench_forward_demux -j
      # A hard, absolute gate (no baseline needed): the FWD forward hop MUST allocate
      # zero heap (ADR-0038 §16KB-RAM), measured by a global operator-new counter.
      - name: Zero-heap forward gate (ADR-0038 §16KB-RAM)
        run: ZEROHEAP_MAX=0 ./bench/build/bench_forward_heap
      # Build main's bench_libtracer in a worktree on THIS runner, record its numbers
      # as the baseline, then gate the PR's numbers against it. Same hardware, same
      # job -> absolute-ns runner speed cancels; only a real regression fails.
      - name: Build main's benchmark on this runner (baseline)
        run: |
          git fetch --no-tags origin main
          git worktree add --detach ../main-baseline origin/main
          cmake -S ../main-baseline/bench -B ../main-baseline/bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build ../main-baseline/bench/build --target bench_libtracer bench_forward_heap \
            bench_compact_delivery bench_forward_demux -j
      # The gate's OWN decision rules, unit-tested before anything is timed: #763 was a
      # defect in the gate, not in what it measures, so the rules are regression-tested
      # against the recorded false-failure and true-regression sample sets.
      - name: Perf-gate decision-rule tests
        run: python3 bench/test_perf_gate.py
      # The pinned host's quiescence rules (#1236), tested here because the guard decides
      # whether a sample is banked AT ALL — and under the two-tier policy the pinned store
      # is the blocking tier, so "skip when busy" and "flagged samples are ignored by the
      # consumer" are gate rules even though they run in perf-local.yml.
      - name: Bench-host quiescence-guard tests
        run: python3 bench/test_host_guard.py
      # The RAM-census series + warn ratchet (#1228), tested here for the same reason:
      # it runs on the pinned host, and for its whole warn-first life a wrong verdict is
      # INVISIBLE — nothing turns red to report it. These are the only check that the
      # ratchet warns on drift rather than on nothing, and they need no build.
      - name: RAM-census decision-rule tests
        run: python3 bench/test_ram_census.py
      # The bench's ARGV contract (#1040), also before anything is timed. An unrecognised
      # mode used to fall through into the full default sweep and exit 0, which in a
      # cross-commit A/B silently joins one axis against every axis on the same row keys.
      # LIBTRACER_BENCH is spelled explicitly so a binary that failed to build FAILS this
      # step instead of skipping it.
      - name: Bench argv-contract tests (an unknown mode must refuse to run)
        env:
          LIBTRACER_BENCH: bench/build/bench_libtracer
        run: python3 bench/test_bench_cli.py
      # The composition bench's wire-use guard (#568 criterion 3), tested in BOTH directions
      # against the real strace: a process that transmits must pass, and one that does not
      # must fail. It needs no build and no network, and it is the check that stops a
      # comparison from ever again reporting a rate for an engine that never reached the wire.
      - name: Composition-bench wire-use guard tests
        run: python3 bench/test_compose_guard.py
      # The receiver-side half of the same harness: the per-point nonce that rejects a
      # concurrent run of this bench at the same K, and the sample floor under which a point
      # publishes nothing. Bytes built in-process — no network, no subprocess, no timing.
      - name: Composition-bench receiver guard tests
        run: |
          cmake --build bench/build --target test_compose_record -j
          ./bench/build/test_compose_record
      - name: Performance gate (INTERLEAVED same-runner A/B vs main)
        run: |
          python3 bench/perf_gate.py \
            --baseline-bench ../main-baseline/bench/build/bench_libtracer \
            --baseline-bench-fwd ../main-baseline/bench/build/bench_forward_heap

  # --- symbol-size ratchet on the hot dispatch symbols (#1155) --------------------
  # A TRIPWIRE, not a proof. `dispatch_edge_target` is where #1065/#1078 landed, then #1086
  # one day later, then #1129 had to undo the cause — every one of them found by a bench run
  # AFTER the fact. This leg puts the code-shape half of that signal at review time.
  #
  # It cannot flake: compilation is deterministic, so the A/A null on this instrument is
  # exactly 0, which is what licenses a zero-tolerance comparison. It is also toolchain-bound
  # (this repo has measured 955 B of spread on a footprint number across toolchains), so the
  # pin records its compiler and the gate REFUSES an unattributable cross-toolchain compare
  # rather than reporting a difference it cannot explain. Pinning the runner image is
  # therefore load-bearing, not cosmetic.
  #
  # What it does NOT buy: it measures shape, not time. A regression with no size signature
  # still needs the bench, and a green ratchet is not a performance verdict.
  symbol-ratchet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the bench targets carrying the pinned symbols (Release = -O3 -DNDEBUG)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_libtracer bench_compact_delivery -j
      # Printed on every run, pass or fail: the measured sizes are the record, and a gate
      # whose numbers are only visible when it fails cannot be re-pinned from its own log.
      - name: Measured symbol sizes (the record, whatever the verdict)
        run: python3 bench/symbol_ratchet.py --build bench/build --pins bench/symbol_ratchet.json --emit
      - name: Symbol-size ratchet
        run: python3 bench/symbol_ratchet.py --build bench/build --pins bench/symbol_ratchet.json
  # --- the composition harness, EXECUTED (audit pass only) -----------------------
  # bench/run_compose.sh is the two-process, delivery-counted composition harness (#568).
  # Until #1151 nothing ran it: `grep -rn run_compose .github/` matched one COMMENT. Its two
  # unit tests above (test_compose_guard.py, test_compose_record) check parsers — neither
  # starts a process, opens a socket, or counts a delivery, so a refactor could break any of
  # the harness's three load-bearing properties with every check still green.
  #
  # This leg runs the harness's AUDIT pass and nothing else. No rate is taken and none is
  # published: shared runners vary ~2x in absolute speed, and the audit pass runs the
  # publisher under strace, where a timing would mean nothing anyway. What it asserts is
  # deterministic — the publisher reached the wire, the values arrived intact, and
  # values/message == K, which is the composite send itself.
  #
  # The Zenoh arm is optional (bench/fetch_zenoh.sh vendors it) and is not fetched here,
  # matching how the ratchet job treats the Zenoh control series: absent is not a failure.
  compose-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # strace is the instrument. Without it syscall_guard.py reports verdict=UNAVAILABLE,
      # and check_compose_audit.py treats that as a FAILURE rather than a pass — a guard that
      # silently downgrades to measuring nothing is the shape this leg exists to remove.
      - name: Install strace (the wire-use instrument)
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Build the composition arm
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_compose_net -j
      # The missing-arm contract, asserted rather than assumed: pointed at a build directory
      # it cannot build into, the harness must exit non-zero instead of reporting on an arm
      # that is not there. This is a live negative control on every run, not a one-off demo.
      - name: The harness must fail when the libtracer arm is missing
        run: |
          mkdir -p /tmp/no-arm && chmod 555 /tmp/no-arm
          if COMPOSE_AUDIT_ONLY=1 COMPOSE_WIDTHS="1" ./bench/run_compose.sh /tmp/no-arm; then
            echo "::error::run_compose.sh exited 0 with no libtracer arm — the guard is vacuous"
            exit 1
          fi
          echo "missing-arm contract holds (non-zero exit)"
      - name: Composition harness — audit pass (deliveries and wire use, no rate)
        env:
          COMPOSE_AUDIT_ONLY: "1"
          COMPOSE_WIDTHS: "1 4"
          COMPOSE_AUDIT_GROUPS: "200"
          COMPOSE_AUDIT_WINDOW_MS: "60000"
        run: |
          set -o pipefail
          ./bench/run_compose.sh ./bench/build 2>&1 | tee compose-audit.log
      - name: Assert the audit (SYSCALL_AUDIT PASS, bad=0, values/message == K)
        run: python3 bench/check_compose_audit.py --widths 1 4 --log compose-audit.log

  # --- main push: REDUNDANT no-pullback ratchet (3 runners, HEAD vs parent) -------
  # Each replica is a complete same-runner experiment on independently-drawn hardware:
  # build HEAD, build the parent commit, gate HEAD against the parent. fail-fast is
  # off so one replica's verdict (or infrastructure hiccup) never hides the others'.
  ratchet:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need the parent commit for the ratchet baseline
      - name: Build HEAD's benchmark (Release)
        run: |
          cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
          cmake --build bench/build --target bench_libtracer bench_forward_heap \
            bench_forward_demux bench_compact_delivery -j
      # The zero-heap gate is deterministic (allocation counts, not time) — running it
      # per replica is a free consistency check; its transcript feeds the memory series.
      - name: Zero-heap forward gate (ADR-0038 §16KB-RAM)
        run: |
          set -o pipefail
          ZEROHEAP_MAX=0 ./bench/build/bench_forward_heap | tee bench/bench_forward_heap_raw.txt
      # One full-bench transcript per replica; the history job aggregates all three.
      # GNU time -v: whole-run max RSS feeds the memory-footprint series. Degrades
      # to an empty transcript (metric omitted) if GNU time is absent on the runner.
      - name: Run the bench once (this replica's history transcript)
        run: |
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -v ./bench/build/bench_libtracer \
              >bench/bench_libtracer_raw.txt 2>bench/bench_libtracer_time.txt
          else
            ./bench/build/bench_libtracer >bench/bench_libtracer_raw.txt
            : >bench/bench_libtracer_time.txt
          fi
      # The NETWORK-plane series. These emit the same 12-column RESULT rows as
      # bench_libtracer, so they feed the same history store with no emitter change — and
      # without them the routing and delivery numbers are untracked, which is how a 63%
      # win regresses unnoticed. Both self-calibrate and are budget-bounded; one second per
      # point keeps this job's wall-clock roughly where it was.
      - name: Run the network-plane benches (routing + steady-state delivery)
        env:
          LIBTRACER_BENCH_SECONDS: "1"
        run: |
          ./bench/build/bench_forward_demux >bench/bench_forward_demux_raw.txt || true
          ./bench/build/bench_compact_delivery >bench/bench_compact_delivery_raw.txt || true
          # `|| true` keeps a crashing bench from costing this commit its whole history
          # point — but it also silently swallowed a MISSING BINARY once, producing a green
          # job that recorded nothing. Make an empty transcript visible in the log.
          for f in bench/bench_forward_demux_raw.txt bench/bench_compact_delivery_raw.txt; do
            [ -s "$f" ] || echo "::warning::$f is empty — its series will not be recorded"
          done
      # Zenoh, on the SAME runner and in the same pass. Its version is pinned, so its line
      # is expected to be FLAT — which is the point: it is a control. A libtracer series
      # that moves while Zenoh's stays put is the code changing; both moving together is
      # the runner, and shared runners vary ~2x. Until now Zenoh was measured only for the
      # per-build comparison charts, so libtracer-vs-Zenoh could not be read over time at
      # all. Entirely optional — a failed vendor download must never cost this commit its
      # history point.
      - name: Run the Zenoh comparison bench (control series, optional)
        run: |
          if bash bench/fetch_zenoh.sh; then
            cmake -S bench -B bench/build -DCMAKE_BUILD_TYPE=Release
            if cmake --build bench/build --target bench_zenoh -j; then
              ./bench/build/bench_zenoh >bench/bench_zenoh_raw.txt || true
            fi
          fi
          # Same visibility rule as the network-plane benches above: an empty transcript is
          # a silent non-recording, so say so rather than letting the job go green quietly.
          [ -s bench/bench_zenoh_raw.txt ] || \
            echo "::warning::no Zenoh transcript — its control series will not be recorded this commit"
      - name: Build the parent commit's benchmark on this runner (ratchet baseline)
        run: |
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git worktree add --detach ../parent-baseline HEAD^
            cmake -S ../parent-baseline/bench -B ../parent-baseline/bench/build -DCMAKE_BUILD_TYPE=Release
            cmake --build ../parent-baseline/bench/build --target bench_libtracer \
              bench_forward_heap bench_compact_delivery bench_forward_demux -j
          else
            echo "root commit — no parent to ratchet against"
          fi
      - name: No-pullback ratchet (HEAD vs parent, this runner, interleaved)
        run: |
          if [ -x ../parent-baseline/bench/build/bench_libtracer ]; then
            echo "== gate HEAD against its parent, interleaved on this runner =="
            python3 bench/perf_gate.py \
              --baseline-bench ../parent-baseline/bench/build/bench_libtracer \
              --baseline-bench-fwd ../parent-baseline/bench/build/bench_forward_heap
          else
            echo "== no parent build — absolute floors only =="
            python3 bench/perf_gate.py --update-baseline
          fi
      # if: always() is load-bearing, not defensive. The ratchet gate above EXITS
      # NON-ZERO on a regression, which aborts the job — so without this the one
      # commit guaranteed to have no artifact is the one that regressed, and the
      # `history` job's own `always()` (which exists for exactly this case) has
      # nothing to download. That is how #385's merge produced a chart that jumps
      # straight from its parent to the next commit, and why the regression was
      # misattributed to a later PR.
      - name: Upload this replica's transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-raw-r${{ matrix.replica }}
          path: |
            bench/bench_libtracer_raw.txt
            bench/bench_libtracer_time.txt
            bench/bench_forward_heap_raw.txt
            bench/bench_forward_demux_raw.txt
            bench/bench_compact_delivery_raw.txt
            bench/bench_zenoh_raw.txt
          retention-days: 90

  # --- main push: persist the build-to-build history (best across runners) --------
  # Aggregates whatever replicas produced transcripts (if: always() — a failing
  # ratchet verdict must still leave a history point for the offending commit) and
  # records EVERY (mode,size,fan,ep) point — latency, throughput and memory footprint
  # as separate series — with a 125% soft alert that comments on drift.
  #
  # NOTE: the history + interactive chart live on the `gh-pages` BRANCH (github-
  # action-benchmark's store; machine-maintained — only this workflow writes it).
  # Pages source is "GitHub Actions" (docs.yml's Sphinx artifact), so the branch is
  # not served directly; docs.yml mirrors dev/bench/ from the branch into each
  # deploy, so the chart is served at https://libtracer.avatarsd.com/dev/bench/.
  history:
    if: github.event_name == 'push' && always()
    needs: ratchet
    runs-on: ubuntu-24.04
    # contents: write lets the tracker push the history to the gh-pages branch and
    # post a commit comment when a metric drifts past the soft alert.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the replicas' transcripts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-raw-r*
          path: bench/raws
      - name: Emit best-across-runners history metrics (github-action-benchmark JSON)
        run: |
          args=""
          for f in bench/raws/*/bench_libtracer_raw.txt \
                   bench/raws/*/bench_forward_demux_raw.txt \
                   bench/raws/*/bench_compact_delivery_raw.txt \
                   bench/raws/*/bench_zenoh_raw.txt; do
            [ -s "$f" ] && args="$args --raw $f"
          done
          if [ -z "$args" ]; then
            echo "no replica produced a transcript — nothing to record"; exit 1
          fi
          zh=$(ls bench/raws/*/bench_forward_heap_raw.txt 2>/dev/null | head -1)
          tv=$(ls bench/raws/*/bench_libtracer_time.txt 2>/dev/null | head -1)
          python3 bench/perf_emit_benchmark.py $args \
            ${zh:+--zeroheap-raw "$zh"} ${tv:+--time-v "$tv"} \
            --out-smaller bench/benchmark_output.json \
            --out-bigger bench/benchmark_throughput.json
      - name: Upload the aggregated bench results (rich per-commit record)
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: |
            bench/raws
            bench/benchmark_output.json
            bench/benchmark_throughput.json
          retention-days: 90
      - name: Track latency + memory history + soft-alert on drift
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # Keep the historical suite name so the pre-existing ns series continue.
          name: libtracer in-process latency (ns, smaller is better)
          tool: customSmallerIsBetter
          output-file-path: bench/benchmark_output.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '125%'      # tighter than the hard gate: catch creep
          comment-on-alert: true       # auto-comment on the commit that drifted
          fail-on-alert: false         # perf_gate.py remains the hard gate; this is a signal
          alert-comment-cc-users: '@avatarsd'
      - name: Track throughput history + soft-alert on drift
        uses: benchmark-action/github-action-benchmark@v1
        with:
          # Separate suite: throughput in natural deliveries/s needs the opposite
          # direction (bigger is better); same gh-pages store, its own chart set.
          name: libtracer in-process throughput (deliveries/s, bigger is better)
          tool: customBiggerIsBetter
          output-file-path: bench/benchmark_throughput.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@avatarsd'
