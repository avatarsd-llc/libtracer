#
# Packaging gate for the PlatformIO espressif32 CAN glue (#965), no hardware.
#
# The ESP-IDF TWAI can_link_t (twai_link.cpp) is CI-built by esp-idf.yml, but
# through the ESP-IDF *managed component* path. The PlatformIO path is a different
# mechanism end to end — library.json's `build.extraScript` and `export.include`,
# plus integrations/platformio/pio_esp32_can.py's CPPPATH and env.BuildSources —
# and nothing built it. This job does: it packs the package exactly as `pio pkg
# publish` would and `pio run`s a `framework = espidf` consumer that names
# `tr::net::twai_link_t`, a CLASSIC `transport_can` over it, and
# `can_transport_factory()`. A clean compile+link IS the gate.
#
# The link is the assertion, and it is not vacuous — measured by ablation on the
# fixture before this landed, each of these reddens the job on its own:
#   - deriving the package root from `__file__` in the hook  -> NameError, no build;
#   - dropping the compat/include CPPPATH                    -> posix_endpoint.cpp,
#                                                               "poll.h: No such file";
#   - dropping the twai include CPPPATH                      -> main.cpp, "twai_link.hpp:
#                                                               No such file";
#   - dropping the env.BuildSources call                     -> "undefined reference to
#                                                               twai_link_t::twai_link_t";
#   - dropping its once-per-run guard                        -> "multiple definition" x10;
#   - dropping esp_thread.hpp or compat/include from
#     library.json's export.include                          -> "No such file" in the
#                                                               packed consumer.
#
# The same linked image also carries the #984 WS-plane gate (see that step's
# comment): PlatformIO espressif32 ships NO WebSocket plane, asserted with
# tools/check_esp_ws_plane.py --ws-plane none.
#
# SEPARATE workflow, like esp-idf.yml and can-vcan-e2e.yml: the required core
# gates must never depend on a multi-GB embedded toolchain download.
#
# OUT OF SCOPE: frames moving on a real TWAI bus. That is the on-bus sign-off and
# it still needs a transceiver and a second node; nothing here energises a pin.
name: pio-esp32-can

# The two path lists are duplicated rather than shared through a YAML anchor: `on:`
# is parsed before any anchor a job could define, and this file needs no other
# sharing, so the duplication costs one edit and avoids depending on how the parser
# treats anchors here. `core/include/**` + `core/src/**` are in both: the hook's
# source filter compiles the whole core, so a shared-header change can break this build
# without touching a single platformio/ file (the trap quic.yml's allowlist fell into).
on:
  push:
    branches: [main]
    paths:
      - "library.json"
      - "integrations/platformio/**"
      - "integrations/esp-idf/libtracer/twai_link.cpp"
      - "integrations/esp-idf/libtracer/esp_thread.hpp"
      - "integrations/esp-idf/libtracer/include/**"
      - "integrations/esp-idf/libtracer/compat/**"
      - "core/include/**"
      - "core/src/**"
      - "tests/packaging/pio_esp32_can/**"
      - "tools/check_esp_ws_plane.py"
      - "tools/check_source_list.py"
      - "core/cmake/libtracer_sources.cmake"
      - ".github/workflows/pio-esp32-can.yml"
  pull_request:
    paths:
      - "library.json"
      - "integrations/platformio/**"
      - "integrations/esp-idf/libtracer/twai_link.cpp"
      - "integrations/esp-idf/libtracer/esp_thread.hpp"
      - "integrations/esp-idf/libtracer/include/**"
      - "integrations/esp-idf/libtracer/compat/**"
      - "core/include/**"
      - "core/src/**"
      - "tests/packaging/pio_esp32_can/**"
      - "tools/check_esp_ws_plane.py"
      - "tools/check_source_list.py"
      - "core/cmake/libtracer_sources.cmake"
      - ".github/workflows/pio-esp32-can.yml"
  workflow_dispatch:

jobs:
  pio-run:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # Measured max 3.57 min, p50 3.32, min 3.25 — extremely tight. 15 = ~4.2x, kept above
    # 3x because PlatformIO downloads a full ESP32 toolchain+framework on a cold cache.
    timeout-minutes: 15
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The source filter this job builds with is a deny-list over core/src; hold it to
      # core's one source list first (#1702), so a drifted list fails in seconds and
      # names the file, before a multi-minute toolchain download.
      - name: PlatformIO deny-lists match the core source list
        run: python3 tools/check_source_list.py

      # PINNED on purpose. The hook reads `pio_lib_builder.path` — a PlatformIO
      # builder internal, and the handle this hook uses to reach the package root
      # (`__file__` is undefined in an SCons SConscript, so dirname arithmetic is
      # out; piolib does chdir into the package, so a relative path would work too,
      # but it would depend on that behaviour rather than on an exported value). A floating core could
      # move that under us and red main for a reason outside this repo; bumping
      # this pin is the visible, reviewable act that re-validates the assumption.
      - name: Install PlatformIO Core
        # Measured max 0.18 min, but a cold PlatformIO cache pulls a full toolchain later
        # in the job, so this install step gets 10 rather than the 8-minute floor.
        timeout-minutes: 10
        run: pip install --quiet "platformio==6.1.18"

      # Pack the package the way the release job publishes it, so the consumer
      # below compiles the file set `export.include` really ships — not the
      # working tree. Reads the working tree, so the change under test is built.
      - name: Pack the PlatformIO package (export.include as published)
        run: pio pkg pack -o tests/packaging/pio_esp32_can/libtracer-pkg.tar.gz

      - name: Build the espressif32 TWAI consumer (compile + link)
        working-directory: tests/packaging/pio_esp32_can
        run: pio run

      # WS-plane gate on the LINKED PlatformIO image (#984 — the #947 ruling's
      # PlatformIO half, same shape as esp-idf.yml's): the espressif32 packaging
      # ships NO WebSocket plane. The extra script excludes the portable POSIX
      # transport_ws pair per-environment and swaps in a udp+tcp-only
      # register_builtin_transports dispatcher; the IDF-native links are not
      # packaged for PlatformIO at all. `--ws-plane none` asserts both halves —
      # zero portable-WS AND zero native-link symbols in firmware.elf (nm, with
      # the symbol-table-floor guard so a stripped/unreadable ELF cannot pass
      # vacuously), plus the object-tree check under PlatformIO's `.o` spelling.
      # Not vacuous on the image side either: the fixture takes the address of
      # register_builtin_transports, so before the exclusion this exact image
      # linked the portable pair (--gc-sections could not shed it).
      - name: Assert the image ships no WS plane (#984, mirrors the #947 gate)
        working-directory: tests/packaging/pio_esp32_can
        run: |
          NM=$(find ~/.platformio/packages -type f -name 'riscv32-esp-elf-nm' | head -n1)
          if [ -z "$NM" ]; then
            echo "ERROR: riscv32-esp-elf-nm not found under ~/.platformio/packages" >&2
            exit 1
          fi
          python3 "${GITHUB_WORKSPACE}/tools/check_esp_ws_plane.py" \
            --build-dir .pio/build/esp32c6 --ws-plane none --nm "$NM"

      - name: Show build artifacts
        if: always()
        working-directory: tests/packaging/pio_esp32_can
        run: ls -la .pio/build/esp32c6/firmware.elf .pio/build/esp32c6/firmware.bin || true
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: pio-esp32-can-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
