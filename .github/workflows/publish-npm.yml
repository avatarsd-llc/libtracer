#
# Publish the libtracer npm packages (ADR-0033, #98). The TypeScript workspace
# (bindings/typescript) ships three publishable, independently-versioned packages:
# the cross-validated core (@avatarsd-llc/libtracer), the WebSocket transport
# (@avatarsd-llc/libtracer-ws), and the experimental client SDK
# (@avatarsd-llc/libtracer-client, #56). All are ESM, scoped, and publish with
# public access; the private workspace root is skipped by `npm publish --workspaces`.
#
# This is a SEPARATE, standalone workflow: it does NOT alter the required core
# gates (build-test / sanitizers / tsan / format / doxygen) nor the ts.yml unit
# gate. It runs ONLY on a manual `workflow_dispatch` — it is intentionally NOT
# wired to the core release tag (see the `on:` note below). A dispatch defaults
# to a dry run, so the pipeline is exercisable end-to-end without a token or an
# actual publish.
#
# Requires a repository secret `NPM_TOKEN` (an npm automation token for the
# @avatarsd-llc org) for real publishes; the maintainer sets it. Provenance needs
# `id-token: write` (OIDC) and the public npm registry.
name: publish-npm

on:
  # MANUAL RE-PUBLISH PATH ONLY — it is not how a release reaches npm.
  #
  # The release path is `release.yml`, which publishes npm alongside crates.io,
  # PlatformIO and ESP on a `v*` tag, stamping every manifest from the tag. The
  # TypeScript packages do NOT version independently: `tools/sync-version.py` is
  # a single-source-of-truth stamper and the root `VERSION` file drives all of
  # them, so one `vX.Y.Z` tag means X.Y.Z everywhere.
  #
  # This workflow exists for the cases that path cannot serve — re-publishing
  # after a registry-side failure, or validating a publish with dry-run. It is
  # dispatch-only for that reason, not because npm is decoupled from the tag.
  # Republishing an already-published version still fails, which is why the
  # dry-run input exists.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run only (validate the publish, upload nothing)"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # required for npm provenance (--provenance)

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Only 3 successful runs exist (workflow_dispatch only): max 0.50 min, p50 0.42, min
    # 0.27 — a thin sample, and stated as one. 15 = the short-job floor plus
    # registry-publish headroom, matching release.yml's publish jobs; `npm ci` and
    # `npm publish` are both registry round-trips. See core-ci.yml's header.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install (clean, from the committed lockfile)
        # Registry round-trip. 8 = the install-step floor.
        timeout-minutes: 8
        run: npm ci

      - name: Build the workspace (tsc)
        run: npm run build

      # Manual dispatch with dry-run=true: validate the manifests/tarballs only.
      # No token needed; nothing is uploaded.
      - name: Publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: npm publish --workspaces --access public --dry-run

      # Real publish: a manual dispatch with dry-run=false. Private packages
      # (the workspace root) are skipped by `npm publish --workspaces`.
      - name: Publish to npm
        if: ${{ !inputs.dry-run }}
        run: npm publish --workspaces --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
