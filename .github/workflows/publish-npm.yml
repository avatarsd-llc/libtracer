#
# Publish the libtracer npm packages (ADR-0033, #98). The TypeScript workspace
# (bindings/typescript) ships three publishable, independently-versioned packages:
# the cross-validated core (@avatarsd-llc/libtracer), the WebSocket transport
# (@avatarsd-llc/libtracer-ws), and the experimental client SDK
# (@avatarsd-llc/libtracer-client, #56). All are ESM, scoped, and publish with
# public access; the private workspace root is skipped by `npm publish --workspaces`.
#
# This is a SEPARATE, standalone workflow that VALIDATES a publish and uploads
# nothing: it runs `npm publish --dry-run` on a manual `workflow_dispatch`, so the
# pipeline is exercisable end-to-end with no credential. It does NOT alter the
# required core gates nor the ts.yml unit gate.
#
# Real publishes happen only in release.yml, the one workflow file each package
# names as its npm Trusted Publisher (OIDC; npm allows one per package, and no
# token exists). Re-publishing after a registry-side failure is a release.yml
# dispatch with the existing tag and `only: npm`.
name: publish-npm

on:
  # VALIDATION ONLY. The release path is `release.yml`, which publishes npm alongside
  # crates.io, PlatformIO and ESP on a `v*` tag, stamping every manifest from the tag
  # (`tools/sync-version.py`; the root `VERSION` drives every package in lockstep).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Only 3 successful runs exist (workflow_dispatch only): max 0.50 min, p50 0.42, min
    # 0.27 — a thin sample, and stated as one. 15 = the short-job floor plus
    # registry-publish headroom, matching release.yml's publish jobs; `npm ci` and
    # `npm publish` are both registry round-trips. See core-ci.yml's header.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: bindings/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install (clean, from the committed lockfile)
        # Registry round-trip. 8 = the install-step floor.
        timeout-minutes: 8
        run: npm ci

      - name: Build the workspace (tsc)
        run: npm run build

      # Validate the manifests and tarballs only; nothing is uploaded.
      - name: Publish (dry run)
        run: npm publish --workspaces --access public --dry-run
