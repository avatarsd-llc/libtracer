#
# The qsbr fenced fallback on Linux (#2121). Built with the asymmetric fence
# (`kQsbrAsymmetricFence`, core/tests/presets/reclaim-qsbr-membarrier), reclaim_qsbr_t
# registers for `membarrier(2)` and, when the kernel refuses, keeps the fenced bracket entry
# for good (qsbr.hpp §qsbr_asym). A hosted Linux runner always accepts the registration, so
# core-ci's `tsan (fence=membarrier)` leg only ever runs the plain entry, and the
# fallback ran only on targets without membarrier. This job builds the same membarrier
# configuration under ThreadSanitizer and runs its whole ctest under
# tools/refuse_membarrier.c, a seccomp filter that fails every membarrier call with EPERM,
# as a container or a sandbox would. So the fenced entry runs, on Linux, under TSan.
#
# Proof it took, three ways: the launcher checks that membarrier now fails before it runs
# anything; LT_EXPECT_MEMBARRIER=refused makes qsbr_epoch_wrap_test FAIL unless the fence is
# compiled in and its registration was refused; and the last step greps that test's own log
# line ("refused, fenced entry kept") out of a verbose run.
#
# Its own workflow, not a core-ci leg, so that it can be path-filtered to the reclaim code:
# core-ci's trigger is derived from everything core-ci compiles (tools/gen_ci_paths.py), and
# this leg is only worth its TSan build when the reclaim code moves. It is not a required
# check: a path-filtered required check never reports on a PR it skips (the #1614 trap).
#
# RUNNER: hosted `ubuntu-24.04`, like core-ci's TSan jobs: no container and no self-hosted
# routing, so there is no fork guard or workspace-ownership step to carry.
name: qsbr-fenced

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  # The same list: Actions does not expand YAML anchors.
  pull_request:
    paths:
      - "core/include/libtracer/qsbr.hpp"
      - "core/include/libtracer/reclaim.hpp"
      - "core/include/libtracer/lkv_slot.hpp"
      - "core/include/libtracer/config.hpp"
      - "core/src/graph.cpp"
      - "core/tests/qsbr_*.cpp"
      - "core/tests/presets/reclaim-qsbr-membarrier/**"
      - "tools/refuse_membarrier.c"
      - ".github/workflows/qsbr-fenced.yml"
      - "!**/*.md" # Markdown is never an input here (core-ci.yml, DOCS-ONLY PULL REQUESTS)

permissions:
  contents: read

# One run per PR (a newer push supersedes the older one); on main every push keeps its own run.
concurrency:
  group: qsbr-fenced-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tsan-qsbr-fenced:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    name: tsan qsbr (membarrier refused, fenced entry)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Set build parallelism (BUILD_JOBS)
        run: |
          echo "BUILD_JOBS=$(nproc)" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$(nproc)"
      - uses: actions/checkout@v4
      - name: Build the membarrier-refusing launcher
        run: cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/refuse_membarrier" tools/refuse_membarrier.c
      - name: ThreadSanitizer build (reclaim_qsbr_t, asymmetric fence compiled in)
        run: |
          cmake -S core -B core/build-tsan-qsbr-fenced -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -I$PWD/core/tests/presets/reclaim-qsbr-membarrier"
          cmake --build core/build-tsan-qsbr-fenced --parallel "$BUILD_JOBS"
      - name: ctest with membarrier refused
        env:
          LT_EXPECT_LKV_SLOT: single_writer_slot_t
          LT_EXPECT_RECLAIM_POLICY: reclaim_qsbr_t
          LT_EXPECT_ACL_POLICY: allow_only_policy_t
          LT_EXPECT_MEMBARRIER: refused
        run: |
          "$RUNNER_TEMP/refuse_membarrier" setarch "$(uname -m)" -R \
            ctest --test-dir core/build-tsan-qsbr-fenced --output-on-failure
      - name: The fenced entry was the one taken
        env:
          LT_EXPECT_MEMBARRIER: refused
        run: |
          set -o pipefail
          "$RUNNER_TEMP/refuse_membarrier" setarch "$(uname -m)" -R \
            ctest --test-dir core/build-tsan-qsbr-fenced -R '^qsbr_epoch_wrap$' -V | tee qsbr-fenced.log
          if ! grep -q "membarrier registration: refused, fenced entry kept" qsbr-fenced.log; then
            echo "::error::qsbr_epoch_wrap did not report the fenced entry: the leg tested the plain one"
            exit 1
          fi
          echo "fenced entry confirmed: membarrier registration refused under the seccomp filter"
