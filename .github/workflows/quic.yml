#
# Dedicated job for the libtracer_quic transport MODULE (ADR-0043 Phase A:
# quic_transport_t; Phase B: webtransport_transport_t + its minimal H3 layer,
# src/wt_h3.hpp) — a separate library target a QUIC/WebTransport-talking host
# links; the core never compiles these sources. SEPARATE from core-ci on
# purpose: the required core gates stay dependency-free. This job builds msquic
# from source (cached by tag), configures the module (-DLIBTRACER_WITH_QUIC=ON),
# and runs the FULL ctest suite (quic + webtransport included) plus ASan+UBSan
# and TSan variants.
#
# RUNNER ROUTING (#2348): host jobs on the `ci-local` runners. All three legs run
# `setarch -R`, i.e. `personality(ADDR_NO_RANDOMIZE)`, which Docker's default seccomp
# profile denies with EPERM, so they cannot run in a job container. They run on the host
# as the runner user (core-ci.yml's header, HOST JOBS), print the host toolchain first,
# and keep the msquic prefix inside the workspace rather than under the home directory
# the host's runners share.
name: quic

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "core/src/transport_quic.cpp"
      - "core/include/libtracer/transport_quic.hpp"
      - "core/src/transport_webtransport.cpp"
      - "core/include/libtracer/transport_webtransport.hpp"
      - "core/src/wt_h3.hpp"
      - "core/src/msquic_endpoint.hpp"  # the shared msquic-mechanical base of both transports
      - "core/include/libtracer/frame.hpp"  # quic/webtransport TUs decode through it
      - "core/include/libtracer/grammar.hpp"  # the one wire grammar frame decoding walks
      - "core/include/libtracer/length_prefix_framer.hpp"  # quic/webtransport RX reassembler
      - "core/include/libtracer/config_reader.hpp"  # the quic factory parses its TLS keys through it
      - "core/include/libtracer/config.hpp"  # kAllowInsecureTls gates the SPEC `insecure` key
      - "core/tests/insecure-tls/**"  # the dev preset the second (honoured-arm) run binds
      - "core/include/libtracer/transport.hpp"  # the receiver seam both transports implement
      - "core/include/libtracer/receiver_slot.hpp"  # the delivery-tier slot transport.hpp embeds
      - "core/src/transport_vertex.cpp"
      - "core/include/libtracer/transport_vertex.hpp"
      - "core/include/libtracer/mem_heap.hpp"  # tr::detail::try_* — the nothrow growth both TUs refuse through
      - "core/tests/quic_test.cpp"
      - "core/tests/webtransport_test.cpp"
      - "core/tests/wt_interop_server.cpp"
      - "core/tests/tsan-msquic.supp"
      - "!**/*.md" # Markdown is never an input here (core-ci.yml, DOCS-ONLY PULL REQUESTS)
      # #934 — the tight-heap gate and its out-of-process peer. Without these four entries a
      # PR that only touches the gate (or the driver, or the shared raw client they both take
      # their peer from) never runs this job at all, so the one test that proves a pre-auth
      # allocation refuses instead of aborting would go unexecuted on the PR that changed it.
      - "core/tests/webtransport_alloc_gate_test.cpp"
      - "core/tests/wt_peer_driver.cpp"
      - "core/tests/raw_wt_client.hpp"
      # #874 — the shared test runner. quic_test.cpp and webtransport_test.cpp take their
      # runner, their frame collector AND their TSan happens-before shims from test_support.hpp,
      # so a change confined to it can break both of these TUs without touching either. This
      # allowlist is the ONLY thing that decides whether they get compiled on a PR.
      - "core/tests/test_support.hpp"
      # test_values.hpp is listed defensively, NOT because either quic TU includes it today —
      # neither does. It is the sibling header a future migration of these TUs would reach for.
      - "core/tests/test_values.hpp"
      - "core/CMakeLists.txt"
      - "core/tests/CMakeLists.txt"
      - "tools/gen-dev-cert.sh"
      - ".github/workflows/quic.yml"
  workflow_dispatch:

env:
  MSQUIC_TAG: v2.4.18

jobs:
  quic-build-test:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    # A HOST job on the ci-local runners (#2348), not a container: Docker's default seccomp
    # profile denies the personality(ADDR_NO_RANDOMIZE) that `setarch -R` needs, and the
    # host allows it. core-ci's trust guard: a fork PR skips the job.
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    # Measured on the msquic cache-HIT path only: quic-tsan max 9.95 min (healthy 9.30,
    # p50 6.58), quic-asan 8.92, quic-release 6.22. 3x would be ~30 — but across 500
    # sampled successful runs of this workflow and wt-interop.yml the
    # `Build msquic from source (cache miss only)` step below executed ZERO times, so the
    # miss path is entirely UNMEASURED. It fires on the next MSQUIC_TAG bump or a 7-day
    # cache eviction and is a full from-source msquic build. 45 covers the measured
    # 10-min hit path at 4.5x AND leaves ~35 min for a cold build. This number is
    # measurement PLUS declared headroom — re-measure it after the first real cache miss.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            cmake_flags: '-DCMAKE_BUILD_TYPE=RelWithDebInfo'
          - name: asan
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -g"
          - name: tsan
            cmake_flags: >-
              -DCMAKE_BUILD_TYPE=Debug
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1"
    name: quic-${{ matrix.name }}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      # Build parallelism (#1637) and the host compiler cache (#2348). A host job runs in
      # its runner's own unit under runners.slice, not in runners-ci.slice: moving a
      # process into another system slice needs privilege the runner user does not hold.
      # It counts the libtracer CI containers in runners-ci.slice plus itself, and takes
      # core-ci's adaptive rule: 4 with three or fewer running, otherwise 2, and 2 when
      # the slice cannot be read. The shared /ccache is the containers' (root-owned
      # entries), so a host job keeps its own cache under the runner user's home.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            slice=/sys/fs/cgroup/runners.slice/runners-ci.slice
            if [ -d "$slice" ]; then
              n=$(( $(ls -d "$slice"/docker-*.scope 2>/dev/null | wc -l) + 1 ))
              echo "libtracer CI jobs running (containers in runners-ci.slice + this host job): $n"
              if [ "$n" -le 3 ]; then jobs=4; else jobs=2; fi
            else jobs=2; fi
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=$HOME/ccache-host"
              echo "CCACHE_MAXSIZE=10G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
            } >> "$GITHUB_ENV"
            echo "ccache: ON ($HOME/ccache-host)"
          else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
      - name: Host toolchain (asserted, not assumed)
        # A host job builds with what the host carries (core-ci.yml's header, HOST JOBS);
        # a missing tool fails here, named, instead of halfway through the build.
        run: |
          g++ --version | head -1
          cmake --version | head -1
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then ccache --version | head -1; fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the msquic install prefix
        id: msquic-cache
        uses: actions/cache@v4
        with:
          # Workspace-relative, not under ~ (#2348): on the ci-local host the runners share
          # one home directory, and concurrent legs must not unpack or build into the
          # same prefix. A relative path also keys the same on every runner.
          path: msquic-install
          key: msquic-${{ env.MSQUIC_TAG }}-${{ runner.os }}-ubuntu24

      - name: Build msquic from source (cache miss only)
        if: steps.msquic-cache.outputs.cache-hit != 'true'
        # NOT a tight cap, unlike the other install steps hardened alongside it: this one
        # has never executed in the sampled history, so there is no healthy figure to
        # take a multiple of. 30 is headroom for a clone + submodules + full cmake build.
        timeout-minutes: 30
        run: |
          git clone --depth 1 --branch "$MSQUIC_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/microsoft/msquic.git "$RUNNER_TEMP/msquic-src"
          cmake -S "$RUNNER_TEMP/msquic-src" -B "$RUNNER_TEMP/msquic-src"/build -DCMAKE_BUILD_TYPE=Release \
            -DQUIC_BUILD_TOOLS=OFF -DQUIC_BUILD_TEST=OFF -DQUIC_BUILD_PERF=OFF \
            -DQUIC_ENABLE_LOGGING=OFF -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/msquic-install"
          cmake --build "$RUNNER_TEMP/msquic-src"/build --parallel "$BUILD_JOBS"
          cmake --install "$RUNNER_TEMP/msquic-src"/build

      - name: Configure + build (LIBTRACER_WITH_QUIC=ON) + full ctest
        run: |
          cmake -S core -B core/build-quic-${{ matrix.name }} -DBUILD_TESTING=ON \
            -DLIBTRACER_WITH_QUIC=ON -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/msquic-install" \
            ${{ matrix.cmake_flags }}
          cmake --build core/build-quic-${{ matrix.name }} --parallel "$BUILD_JOBS"
          # ASLR can make ASan/TSan abort in this runner; pin it off (harmless
          # for the release leg). LD_LIBRARY_PATH covers the msquic shared lib.
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/msquic-install/lib:${LD_LIBRARY_PATH:-}"
          setarch "$(uname -m)" -R ctest --test-dir core/build-quic-${{ matrix.name }} \
            --output-on-failure

      - name: QUIC + WebTransport tests under kAllowInsecureTls (release only)
        # The run above is the DEFAULT build, where a SPEC carrying `insecure` = non-zero is
        # refused. This one binds the checked-in dev preset so the honoured arm of the same
        # two tests runs too. Only the two test targets (and what they link) are built.
        if: matrix.name == 'release'
        run: |
          cmake -S core -B core/build-quic-insecure-tls -DBUILD_TESTING=ON \
            -DLIBTRACER_WITH_QUIC=ON -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/msquic-install" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-I$PWD/core/tests/insecure-tls"
          cmake --build core/build-quic-insecure-tls --parallel "$BUILD_JOBS" \
            --target quic_test webtransport_test
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/msquic-install/lib:${LD_LIBRARY_PATH:-}"
          setarch "$(uname -m)" -R ctest --test-dir core/build-quic-insecure-tls \
            -R '^(quic|webtransport)$' --output-on-failure
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job; a host job first takes root-owned leftovers back through a throwaway
        # container (no sudo), so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; if [ "$(id -u)" != 0 ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then docker run --rm -v "$w/..:/w" -v "$t:/t" ghcr.io/avatarsd-llc/libtracer-ci:noble-d3cc1cb0835e chown -R "$(id -u):$(id -g)" /w /t || r=1; fi; find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: quic-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
