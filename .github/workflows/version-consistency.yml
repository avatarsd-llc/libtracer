# SPDX-FileCopyrightText: Copyright 2026 avatarsd LLC
#
# Guards the single source of truth for the release version. The repo-root
# `VERSION` file is the sole hand-edited version; every publishable artifact is
# versioned in lockstep from it via `tools/sync-version.py` — the PlatformIO /
# ESP manifests, the four TypeScript packages (version + internal dep
# ranges), the npm lockfile that mirrors them, and the Rust crate. This job runs
# the stamper in --check mode and fails if anything has drifted from `VERSION`, so
# a version bump can never land half-applied. (The ROS 2 stub is unreleased and
# intentionally excluded.)
#
# `paths:` below is an allowlist, so every guarded file must be listed — the
# lockfile went unwatched for two releases precisely because it was not (#862).
#
# It also runs the unit tests for the two other release-mechanics tools —
# `tools/gen_release_notes.py` (the multi-package GitHub Release body) and
# `tools/consolidate_changelog.py` (the at-tag-time `[Unreleased]` consolidation).
# Both run exactly once per release, where a mistake is expensive and hard to undo,
# so they are gated here rather than discovered during a cut (#607).
name: version-consistency

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - library.json
      - integrations/esp-idf/libtracer/idf_component.yml
      - bindings/typescript/packages/**/package.json
      - bindings/typescript/package-lock.json
      - bindings/rust/Cargo.toml
      - tools/sync-version.py
      - tools/gen_release_notes.py
      - tools/consolidate_changelog.py
      - tools/tests/**
      - "**/CHANGELOG.md"
      - .github/workflows/version-consistency.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - VERSION
      - library.json
      - integrations/esp-idf/libtracer/idf_component.yml
      - bindings/typescript/packages/**/package.json
      - bindings/typescript/package-lock.json
      - bindings/rust/Cargo.toml
      - tools/sync-version.py
      - tools/gen_release_notes.py
      - tools/consolidate_changelog.py
      - tools/tests/**
      - "**/CHANGELOG.md"
      - .github/workflows/version-consistency.yml
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice' || '--memory 10g' }}
    # Measured max 0.27 min, p50 0.22, min 0.20. Its only network step is
    # actions/setup-python@v5. 10 = the short-job floor, ~37x observed.
    timeout-minutes: 10
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package manifests match the VERSION file
        run: python3 tools/sync-version.py --check
      - name: Release-mechanics tool tests (release notes + changelog consolidation)
        run: python3 -m unittest discover -s tools/tests -v
      - name: Release-body dry run — every package contributes (no tag is created)
        run: |
          # Probe with the tree's own VERSION: mid-cycle that section does not exist
          # yet, so every package falls back to its [Unreleased] entries — exactly
          # what the next real cut will emit. On the release PR itself (the one
          # commit where consolidation has just moved [Unreleased] under the new
          # version heading) the section DOES exist and the probe reads it — the
          # old fixed 0.0.0-dry-run probe was guaranteed to fail precisely there,
          # because it matched no section and the fallback found a just-emptied
          # [Unreleased].
          # ANTHROPIC_API_KEY is deliberately absent here, so no model is called.
          python3 tools/gen_release_notes.py --version "$(cat VERSION)" \
            > "${RUNNER_TEMP}/release-body.md"
          echo '----- release body (dry run) -----'
          cat "${RUNNER_TEMP}/release-body.md"
          for pkg in core bindings/ros2 bindings/rust bindings/typescript integrations/esp-idf; do
            grep -q "^#### ${pkg}" "${RUNNER_TEMP}/release-body.md" \
              || { echo "::error::${pkg} contributes nothing to the release body"; exit 1; }
          done
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: version-consistency-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
