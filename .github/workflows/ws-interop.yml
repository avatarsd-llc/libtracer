#
# C++ <-> TypeScript transport_ws INTEROP end-to-end job (#54). Builds the C++
# `ws_interop_server` helper binary (a real `tr::net::ws_server_transport_t`) and
# runs the TypeScript transport-ws interop test against it over a live socket: a
# genuine RFC 6455 101 handshake, a MASKED TS client frame in, an UNMASKED C++
# server frame back. This proves the published @avatarsd-llc/libtracer-ws client
# actually interoperates with the C++ server, beyond the codec-vector agreement.
#
# This is a SEPARATE, standalone workflow (mirroring can-vcan-e2e.yml / ts.yml):
# the required core gates (build-test / sanitizers / tsan / format / doxygen) must
# never depend on a Node toolchain, and the TS gates must never depend on a C++
# build. Path-filtered to the C++ transport, the TypeScript workspace, and this
# file, so it only runs when one of those changes.
name: ws-interop

on:
  # NIGHTLY, NOT PER MAIN PUSH (#2348). A train merge lands a tree equal to the PR head
  # this workflow already passed, so a push to main runs only core-ci's smoke set
  # (core-ci.yml's header, QUICK SET). This workflow runs nightly at 00:00 UTC
  # (02:00 Kyiv winter time, clear of the HIL and perf-local bench windows) and on
  # every release tag.
  push:
    tags: ["v*"]
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
      - "core/**"
      - "bindings/typescript/**"
      - ".github/workflows/ws-interop.yml"
      - "!**/*.md" # Markdown is never an input here (core-ci.yml, DOCS-ONLY PULL REQUESTS)
  workflow_dispatch:

jobs:
  ws-interop:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-d3cc1cb0835e
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      # The trusted route also mounts the persistent compiler cache (core-ci.yml's
      # COMPILER CACHE header); the guard is the `runs-on` one verbatim.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice -v /home/github-runner/ccache:/ccache -v /sys/fs/cgroup/runners.slice/runners-ci.slice:/ci-slice:ro' || '--memory 10g' }}
    # Measured max 1.15 min (healthy 1.07), p50 ~0.9. 15 = the short-job floor, ~13x
    # observed: the ceiling exists for the `npm ci` below, not for the work. See
    # core-ci.yml's header for the tree-wide policy.
    timeout-minutes: 15
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      # Build parallelism (#1637, #1691, #2348): on the self-hosted runners, 4 while at most 3
      # CI containers share the 11-core slice and 2 above that or when the count is
      # unreadable (see BUILD_JOBS in core-ci.yml's header); `nproc` on hosted runners.
      # RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (core-ci.yml's COMPILER CACHE header).
      # POSIX sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            n=$(ls -d /ci-slice/docker-*.scope 2>/dev/null | wc -l)
            echo "CI containers running in runners-ci.slice (this one included): $n"
            if [ "$n" -ge 1 ] && [ "$n" -le 3 ]; then jobs=4; else jobs=2; fi
          else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the C++ ws_interop_server helper binary
        run: |
          cmake -S core -B core/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build core/build --target ws_interop_server --parallel "$BUILD_JOBS"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install + build the TypeScript workspace
        working-directory: bindings/typescript
        # `npm ci` is a registry round-trip; measured 0.02-0.13 min. 8 = the install-step
        # floor, so a hung registry names itself instead of stalling the job.
        timeout-minutes: 8
        run: |
          npm ci
          npm run build

      - name: Run the TS <-> C++ transport_ws interop test over a real socket
        working-directory: bindings/typescript/packages/transport-ws
        env:
          LIBTRACER_WS_INTEROP_SERVER: ${{ github.workspace }}/core/build/tests/ws_interop_server
        run: npm test
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job; a host job first takes root-owned leftovers back through a throwaway
        # container (no sudo), so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; if [ "$(id -u)" != 0 ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then docker run --rm -v "$w/..:/w" -v "$t:/t" ghcr.io/avatarsd-llc/libtracer-ci:noble-d3cc1cb0835e chown -R "$(id -u):$(id -g)" /w /t || r=1; fi; find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

  # RFC-0004 client interop (#56): the TypeScript LibtracerClient drives all five
  # path-addressed operations (read / write / await / readField / subscribe) over
  # real FWD frames against a live C++ graph-backed node (fwd_node_server) over a
  # genuine ws socket, and decodes the source-routed FWD{REPLY} / producer delivery
  # — the web-UI<->device proof, one layer above the transport_ws interop above.
  # A SEPARATE, standalone job for the same reason: the required core gates must
  # never depend on a Node toolchain, and a client-FWD failure must read distinctly
  # from a transport-ws failure. Same path-filter as this whole workflow.
  fwd-interop:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'batch/'))
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-d3cc1cb0835e
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      # The trusted route also mounts the persistent compiler cache (core-ci.yml's
      # COMPILER CACHE header); the guard is the `runs-on` one verbatim.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice -v /home/github-runner/ccache:/ccache -v /sys/fs/cgroup/runners.slice/runners-ci.slice:/ci-slice:ro' || '--memory 10g' }}
