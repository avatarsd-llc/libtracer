#
# C++ <-> BROWSER WebTransport INTEROP end-to-end job (#321) — the one capability
# matrix cell that was verified by framing shape + codec agreement rather than by
# a live byte exchange. Builds the C++ `wt_interop_server` echo harness (a real
# `tr::net::webtransport_transport_t`, LIBTRACER_WITH_QUIC=ON) and drives a real
# chrome-headless against it: a genuine HTTP/3 extended-CONNECT session with
# `serverCertificateHashes` dev trust, one browser `createBidirectionalStream()`,
# a length-prefixed record out, the echoed record back.
#
# Unlike ws-interop this needs a BROWSER: TS WebTransport is the browser
# `WebTransport` API over HTTP/3, so there is no in-process Node client to drive.
# That is why the harness carries a puppeteer dependency this job installs, and
# why it lives in its own workflow rather than joining ws-interop.yml — that file
# is path-filtered on all of `core/**`, and an msquic build has no business
# running on every core change.
#
# The msquic cache key is deliberately IDENTICAL to quic.yml's, so whichever
# workflow runs first populates the prefix and the other hits it.
name: wt-interop

on:
  push:
    branches: [main]
    paths:
      - "core/src/transport_webtransport.cpp"
      - "core/include/libtracer/transport_webtransport.hpp"
      - "core/src/wt_h3.hpp"
      - "core/src/msquic_endpoint.hpp"
      - "core/include/libtracer/length_prefix_framer.hpp"
      - "core/tests/wt_interop_server.cpp"
      - "core/CMakeLists.txt"
      - "core/tests/CMakeLists.txt"
      - "bindings/typescript/packages/transport-webtransport/**"
      - ".github/workflows/wt-interop.yml"
  pull_request:
    paths:
      - "core/src/transport_webtransport.cpp"
      - "core/include/libtracer/transport_webtransport.hpp"
      - "core/src/wt_h3.hpp"
      - "core/src/msquic_endpoint.hpp"
      - "core/include/libtracer/length_prefix_framer.hpp"
      - "core/tests/wt_interop_server.cpp"
      - "core/CMakeLists.txt"
      - "core/tests/CMakeLists.txt"
      - "bindings/typescript/packages/transport-webtransport/**"
      - ".github/workflows/wt-interop.yml"
  workflow_dispatch:

env:
  MSQUIC_TAG: v2.4.18

jobs:
  wt-interop:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","ci-local"]') || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/avatarsd-llc/libtracer-ci:noble-7ca1b7c862e8
      # The ci-local runners are bare machines, so the job runs in a container on BOTH
      # routes (core-ci.yml's CONTAINER header). CPU is bounded host-side by runners.slice;
      # 10g is the per-job memory budget.
      # The trusted route also mounts the persistent compiler cache (core-ci.yml's
      # COMPILER CACHE header); the guard is the `runs-on` one verbatim.
      options: ${{ (vars.CI_SELF_HOSTED != 'false' && github.repository == 'avatarsd-llc/libtracer' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '--memory 10g --cgroup-parent=runners-ci.slice -v /home/github-runner/ccache:/ccache -v /sys/fs/cgroup/runners.slice/runners-ci.slice:/ci-slice:ro' || '--memory 10g' }}
    # Measured max 1.42 min, healthy max 1.38, p50 1.23 — trivially short on the msquic
    # cache-HIT path. Set to 45 for the same unmeasured reason as quic.yml: this job
    # carries the identical `Build msquic from source (cache miss only)` step, which never
    # executed in 500 sampled runs, and it also pulls ~200 MB of Chromium below. Kept
    # EQUAL to quic.yml so the two msquic consumers share one reviewable ceiling.
    timeout-minutes: 45
    defaults:
      run:
        # Bash as on the hosted image (`bash -e {0}`): a container job otherwise falls back
        # to `sh` (dash), and these steps were written for the hosted bash (#2348).
        shell: bash -e {0}
    steps:
      - name: Check the runner workspace has room
        # FIRST, before checkout: a full runner disk fails here, named, instead of as an
        # action download or a test (#2343). Gated by tools/check_ci_workspace_cleanup.py.
        run: a=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}'); [ "${a:-0}" -ge 4194304 ] || { echo "::error::runner workspace has $(( ${a:-0} / 1048576 )) GB free (< 4 GB); clean the runner, this is not a test failure"; exit 1; }
      # Build parallelism (#1637, #1691, #2348): on the self-hosted runners, 4 while at most 3
      # CI containers share the 11-core slice and 2 above that or when the count is
      # unreadable (see BUILD_JOBS in core-ci.yml's header); `nproc` on hosted runners.
      # RUNNER_ENVIRONMENT comes
      # from the runner, so this follows the runtime `runs-on` routing. The compiler cache
      # switches on only where `/ccache` is mounted (core-ci.yml's COMPILER CACHE header).
      # POSIX sh on purpose: `container:` jobs may resolve the shell to dash.
      - name: Set build parallelism (BUILD_JOBS) + compiler cache
        run: |
          if [ "$RUNNER_ENVIRONMENT" = "self-hosted" ]; then
            n=$(ls -d /ci-slice/docker-*.scope 2>/dev/null | wc -l)
            echo "CI containers running in runners-ci.slice (this one included): $n"
            if [ "$n" -ge 1 ] && [ "$n" -le 3 ]; then jobs=4; else jobs=2; fi
          else jobs="$(nproc)"; fi
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
          echo "BUILD_JOBS=$jobs"
          if [ -d /ccache ]; then
            {
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CCACHE_DIR=/ccache"
              echo "CCACHE_MAXSIZE=20G"
              echo "CCACHE_COMPILERCHECK=content"
              echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
              echo "CCACHE_STATSLOG=$RUNNER_TEMP/ccache-stats.log"
            } >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust the checkout for git
        # The container runs as root over a workspace the host runner user owns, so git
        # refuses it as dubious ownership; checkout trusts it only for its own calls (#2348).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install the msquic build and headless-Chrome runtime dependencies
        # The CI base image is ubuntu:24.04 plus a compiler; the hosted image carried these.
        # msquic's bundled quictls configures with perl and its Linux platform links
        # libnuma; puppeteer's Chrome needs the X11/GTK/NSS shared libraries even headless.
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends perl libnuma-dev \
            ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 \
            libglib2.0-0t64 libgtk-3-0t64 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxkbcommon0 libxrandr2 libxrender1 libxss1 libxtst6
      - name: Cache the msquic install prefix
        id: msquic-cache
        uses: actions/cache@v4
        with:
          path: ~/msquic-install
          key: msquic-${{ env.MSQUIC_TAG }}-${{ runner.os }}-ubuntu24

      - name: Build msquic from source (cache miss only)
        if: steps.msquic-cache.outputs.cache-hit != 'true'
        # Deliberately NOT a tight cap — never executed in the sampled history, so there
        # is no healthy figure to multiply. Same 30 as quic.yml's identical step.
        timeout-minutes: 30
        run: |
          git clone --depth 1 --branch "$MSQUIC_TAG" --recurse-submodules --shallow-submodules \
            https://github.com/microsoft/msquic.git ~/msquic-src
          cmake -S ~/msquic-src -B ~/msquic-src/build -DCMAKE_BUILD_TYPE=Release \
            -DQUIC_BUILD_TOOLS=OFF -DQUIC_BUILD_TEST=OFF -DQUIC_BUILD_PERF=OFF \
            -DQUIC_ENABLE_LOGGING=OFF -DCMAKE_INSTALL_PREFIX="$HOME/msquic-install"
          cmake --build ~/msquic-src/build --parallel "$BUILD_JOBS"
          cmake --install ~/msquic-src/build

      - name: Build the C++ wt_interop_server helper binary
        run: |
          cmake -S core -B core/build-wt -DBUILD_TESTING=ON \
            -DLIBTRACER_WITH_QUIC=ON -DCMAKE_PREFIX_PATH="$HOME/msquic-install" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build core/build-wt --target wt_interop_server --parallel "$BUILD_JOBS"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bindings/typescript/package-lock.json

      - name: Install + build the TypeScript workspace
        working-directory: bindings/typescript
        # `npm ci` is a registry round-trip; measured 0.02-0.13 min. 8 = the install-step
        # floor, so a hung registry names itself instead of stalling the job.
        timeout-minutes: 8
        run: |
          npm ci
          npm run build

      # puppeteer is deliberately NOT a devDependency of the package (the mocked
      # unit tests cover the transport logic without a browser download), so the
      # browser harness installs it here — ~200 MB of browser, pulled only in the
      # one job that drives a browser. --no-save so the install cannot rewrite the
      # checked-in package.json or lockfile underneath a later step; the workspace
      # was already resolved by `npm ci` above, and publish-npm.yml ships from the
      # same committed lockfile.
      - name: Install puppeteer for the browser harness
        working-directory: bindings/typescript
        # Measured max 0.22 min warm; ~200 MB of Chromium cold, hence 10 rather than 8.
        timeout-minutes: 10
        run: npm i --no-save puppeteer

      # Only the interop case — the package's mocked unit tests are ts.yml's job,
      # and running them here would make a browser failure and a codec failure
      # share one red badge.
      #
      # The harness SKIPS rather than fails when the server binary or puppeteer
      # is missing. That is deliberate and right: `npm test` must stay green for a
      # contributor with no QUIC build. In CI the same property is a hazard —
      # a skipped run exits 0, so the job would report success having exchanged no
      # bytes, which is the exact gap this workflow exists to close. Trusting the
      # exit status is therefore not enough; TAP is parsed and the case is
      # asserted to have genuinely PASSED.
      - name: Run the browser <-> C++ WebTransport interop test
        working-directory: bindings/typescript/packages/transport-webtransport
        env:
          LIBTRACER_WT_INTEROP_SERVER: ${{ github.workspace }}/core/build-wt/tests/wt_interop_server
        run: |
          set -o pipefail
          # msquic ships as a shared lib; the spawned server needs it on the path.
          export LD_LIBRARY_PATH="$HOME/msquic-install/lib:${LD_LIBRARY_PATH:-}"
          node --test --test-reporter=tap test/interop-browser.test.mjs 2>&1 | tee wt-interop.tap
          if ! grep -qx '# pass 1' wt-interop.tap || ! grep -qx '# skipped 0' wt-interop.tap; then
            echo "::error::the WebTransport interop case did not execute (it skipped)."
            echo "A skipped browser harness exits 0 while exchanging no bytes — see the TAP above"
            echo "for which precondition was missing (server binary, or puppeteer)."
            exit 1
          fi
      - name: Compiler cache statistics (this job)
        # Hit rate of THIS job only: the stats log is per-job, the cache's own counters
        # are shared by every runner. Absent on the hosted route (no `/ccache`).
        if: always() && env.CCACHE_DIR != ''
        run: ccache --show-log-stats -v || true
      - name: Clean this job's workspace off the host runner
        # LAST, on every outcome (#2343): deletes this job's checkout, build trees, sibling
        # worktrees and temp files so the shared runner tmpfs does not fill, and hands the
        # runner's own _temp/_* dirs back to the host runner user (#1538). Runs as root in a
        # container job and with sudo where the host grants it, so root-owned files go too.
        # The workspace dir itself stays for the post steps. Gated, first step included,
        # by tools/check_ci_workspace_cleanup.py.
        if: always()
        run: s=$(sudo -n true 2>/dev/null && echo 'sudo -n' || true); w="${GITHUB_WORKSPACE%/}"; w="${w:?}"; t="${RUNNER_TEMP:?}"; r=0; $s find "$w/.." -mindepth 1 -maxdepth 1 ! -path "$w/../${w##*/}" -exec rm -rf {} + || r=1; $s find "$w" -mindepth 1 -maxdepth 1 -exec rm -rf {} + || r=1; $s find "$t" -mindepth 1 -maxdepth 1 ! -name '_*' -exec rm -rf {} + || r=1; $s chown -R "$(stat -c '%u:%g' "$w/..")" "$t" || r=1; [ "$r" = 0 ] || echo "::warning::this job left files in the runner workspace; the next job's free-space check names a full disk"

concurrency:
  group: wt-interop-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
