version: "0.12.0"
description: "libtracer — decentralized, zero-copy, graph-based pub/sub protocol (C++ reference core, full-node profile: graph + FWD router + udp/tcp/ws/can transports + TWAI link)"
url: "https://github.com/avatarsd-llc/libtracer"
repository: "https://github.com/avatarsd-llc/libtracer.git"
documentation: "https://avatarsd-llc.github.io/libtracer/"
issues: "https://github.com/avatarsd-llc/libtracer/issues"
license: "Apache-2.0"
# The component manager treats a target absent from this list as a HARD INSTALL
# REJECTION, so the list is a support claim, not a hint. Every entry below is built
# by the `esp-idf` workflow's `build` and `full-node` matrices — keep the two in sync
# in both directions, because an unbuilt entry is a promise nothing checks (#1159).
#
# Deliberately NOT claimed, and why:
#   esp32c2, esp32s2 — no TWAI-node peripheral for the `esp_twai` driver, while
#     CONFIG_LIBTRACER_TRANSPORT_CAN defaults y. Adding them without first making the
#     CAN TU conditional on target capability would trade this clean rejection for a
#     compile error inside third-party code, which is strictly worse.
#   esp32h2, esp32p4, esp32c5 — plausibly fine, but UNVERIFIED: no CI build and no
#     board. Claiming an untested target is how this list went wrong the first time.
#     Add the CI matrix entry first, then the claim.
targets:
  - esp32
  - esp32s3
  - esp32c3
  - esp32c6
  - linux
dependencies:
  # >=5.5.5 is a TX-path correctness floor, not a packaging preference. Below it
  # `httpd_queue_work` is a bare non-blocking `sendto` on the loopback control socket, so an
  # enqueue past CONFIG_LWIP_UDP_RECVMBOX_SIZE is discarded inside lwIP while the call still
  # returns ESP_OK — the frame is lost with nothing observable anywhere. From 5.5.5 the
  # control mbox is reserved through a counting semaphore first (esp_http_server
  # httpd_main.c), so a full queue is ESP_FAIL to the caller and the silent bin cannot occur.
  # httpd_ws_link_t's TX path is written for that guarantee and carries no compensation for
  # its absence (#949).
  idf: ">=5.5.5"
