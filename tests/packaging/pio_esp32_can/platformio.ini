;
; Downstream PlatformIO consumer fixture for the espressif32 TWAI packaging glue
; (#965). Built by the `pio-esp32-can` workflow; a clean `pio run` IS the gate.
; See src/main.cpp for what the fixture names and which piece of
; integrations/platformio/pio_esp32_can.py each name pins.
;
; The dependency is the PACKED package, not the working tree: the workflow runs
; `pio pkg pack -o tests/packaging/pio_esp32_can/libtracer-pkg.tar.gz` from the
; repo root first, so what gets compiled here is the file set library.json's
; `export.include` actually ships. That is deliberate — the hook and the export
; list rot independently, and a `symlink://` consumer would happily compile files
; a published consumer never receives. `pio pkg pack` reads the working tree, so
; a hook edit under test is still the one built. A missing tarball is a hard
; PlatformIO error (exit 1), never a quiet skip.
;
; The platform is PINNED. framework-espidf ~4.60001.0 (ESP-IDF v6.0.1) is the
; PlatformIO-packaged IDF carrying the `esp_driver_twai` node API (esp_twai.h /
; esp_twai_onchip.h) that twai_link.cpp is written against, and it brings the
; GCC 15 RISC-V toolchain libtracer's C++23 core needs. An unpinned `espressif32`
; would silently move both. This fixture sets no -std of its own because the IDF
; build already supplies one: the toolchain's OWN default is C++17
; (riscv32-esp-elf-g++ 15.2.0 reports __cplusplus 201703L), and what the core is
; actually compiled with here is the -std=gnu++26 that framework-espidf puts on
; every C++ translation unit.
;
; NOTE for a local re-run: `.pio/libdeps` caches the installed package by name,
; so after editing library.json or the hook, repack AND `rm -rf .pio` — otherwise
; the old extraction is reused and the edit looks like it had no effect. CI always
; starts from a fresh checkout.

[env:esp32c6]
platform = espressif32@7.0.1
framework = espidf
board = esp32-c6-devkitc-1
lib_deps = file://libtracer-pkg.tar.gz
